<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Residents’ Corner moderation | Rochdale Daily</title><style>:root{--navy:#0b1f3a;--cyan:#22d3ee;--paper:#0d1c2e;--card:#112741;--soft:#12263d;--line:#1e3550;--ink:#eef3f9;--muted:#93a6bd;--green:#23a06a;--red:#ff7388;--amber:#f5c400}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial}.wrap{width:min(1080px,calc(100% - 24px));margin:auto}header{background:var(--navy);border-bottom:3px solid var(--cyan);padding:16px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.head a{color:var(--cyan);text-decoration:none;font-weight:700}h1{margin:24px 0 10px}.bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:14px}.bar input,.bar select{flex:1;padding:11px;background:var(--soft);border:1px solid var(--line);color:var(--ink);min-width:180px}button{padding:10px 14px;border:0;font-weight:800;text-transform:uppercase;cursor:pointer}.load{background:var(--cyan);color:var(--navy)}.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--cyan);padding:17px;margin:14px 0}.card.death{border-left-color:#d7a7b4}.card.missing_pet,.card.found_pet{border-left-color:var(--amber)}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.badge{display:inline-block;background:var(--soft);border:1px solid var(--line);padding:4px 8px;font-size:11px;font-weight:800;text-transform:uppercase}.meta{color:var(--muted);font-size:13px;margin-top:5px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.detail{background:var(--soft);padding:10px}.detail strong{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.body{white-space:pre-wrap;background:var(--soft);padding:13px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.approve{background:var(--green);color:#05251a}.reject{background:transparent;color:var(--red);border:1px solid var(--red)}.status{color:var(--muted)}.empty{padding:18px;background:var(--card);border:1px solid var(--line);margin-top:14px}.warning{background:#3a2d10;border-left:5px solid var(--amber);padding:11px;margin:12px 0;font-size:13px}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}.top{display:block}.bar{display:grid}.bar input,.bar select,.bar button{width:100%}.card{padding:14px}}</style></head><body><header><div class="wrap head"><div><strong>Rochdale Daily</strong><div>Residents’ Corner moderation</div></div><a href="/residents-corner.html">View submission page</a></div></header><main class="wrap"><h1>Pending submissions</h1><div class="bar"><input id="token" type="password" placeholder="Admin token"><select id="filter"><option value="all">All types</option><option value="story">Stories</option><option value="recipe">Recipes</option><option value="birthday">Celebrations</option><option value="exam">Exam results</option><option value="death">Death notices</option><option value="missing_pet">Missing animals</option><option value="found_pet">Found animals</option></select><button class="load" id="load">Load queue</button></div><p class="status" id="status">Use the same token as event moderation.</p><div id="queue"></div></main><script>(function(){const API='/api/residents',tokenEl=document.getElementById('token'),queue=document.getElementById('queue'),status=document.getElementById('status'),filter=document.getElementById('filter');let items=[];const saved=sessionStorage.getItem('rd_admin_token');if(saved)tokenEl.value=saved;const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const labels={story:'Resident story',recipe:'Recipe',birthday:'Celebration',exam:'Exam success',death:'Death notice',missing_pet:'Missing animal',found_pet:'Found animal'};function render(){const selected=filter.value;const visible=items.filter(x=>selected==='all'||x.type===selected);queue.innerHTML=visible.length?visible.map(x=>{const animal=x.type==='missing_pet'||x.type==='found_pet';const warning=x.type==='death'?'<div class="warning">Check family authority, names, dates and any funeral details before approval.</div>':animal?'<div class="warning">Confirm ownership or finder details. Avoid publishing a private home address or unique proof-of-ownership detail.</div>':'';const details=animal?`<div class="detail-grid"><div class="detail"><strong>When</strong>${esc(x.eventDate||'Not supplied')}</div><div class="detail"><strong>Where</strong>${esc(x.location||'Not supplied')}</div><div class="detail"><strong>Description</strong>${esc(x.animalDetails||'Not supplied')}</div></div>`:'';return `<article class="card ${esc(x.type)}" data-id="${esc(x.id)}"><div class="top"><div><span class="badge">${esc(labels[x.type]||x.type)}</span><h2>${esc(x.title)}</h2></div><div class="meta">${esc((x.submittedAt||'').replace('T',' ').slice(0,16))}</div></div><div class="meta">Submitted by ${esc(x.name)} · ${esc(x.area)} · <strong>${esc(x.contact)}</strong></div>${warning}${details}<div class="body">${esc(x.body)}</div><div class="actions"><button class="approve" data-action="approve">Approve</button><button class="reject" data-action="reject">Reject</button></div></article>`}).join(''):'<div class="empty">Nothing waiting in this category.</div>'}async function load(){const token=tokenEl.value.trim();if(!token)return status.textContent='Enter the token.';status.textContent='Loading…';const r=await fetch(API+'?queue=pending&t='+Date.now(),{headers:{'x-admin-token':token}});const d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Could not load.';return}sessionStorage.setItem('rd_admin_token',token);items=d.pending||[];render();status.textContent=items.length+' waiting.'}async function act(card,action){if(action==='reject'&&!confirm('Reject this submission?'))return;if(action==='approve'&&!confirm('Approve this for the public Residents’ Corner feed?'))return;const r=await fetch(API,{method:'POST',headers:{'x-admin-token':tokenEl.value.trim(),'Content-Type':'application/json'},body:JSON.stringify({action,id:card.dataset.id})});const d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Action failed.';return}items=items.filter(x=>x.id!==card.dataset.id);render();status.textContent=action==='approve'?'Approved.':'Rejected.'}document.getElementById('load').onclick=load;filter.onchange=render;queue.onclick=e=>{const b=e.target.closest('button[data-action]');if(b)act(b.closest('.card'),b.dataset.action)};if(saved)load()})();</script></body></html>
