<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Residents’ Corner moderation | Rochdale Daily</title><style>:root{--navy:#0b1f3a;--cyan:#22d3ee;--paper:#0d1c2e;--card:#112741;--soft:#12263d;--line:#1e3550;--ink:#eef3f9;--muted:#93a6bd;--green:#23a06a;--red:#ff7388}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}header{background:var(--navy);border-bottom:3px solid var(--cyan);padding:16px 0}h1{margin:24px 0 10px}.bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:14px}.bar input{flex:1;padding:11px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}button{padding:10px 14px;border:0;font-weight:800;text-transform:uppercase;cursor:pointer}.load{background:var(--cyan);color:var(--navy)}.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cyan);padding:16px;margin:14px 0}.meta{color:var(--muted);font-size:13px}.body{white-space:pre-wrap;background:var(--soft);padding:12px;margin:12px 0}.actions{display:flex;gap:8px}.approve{background:var(--green)}.reject{background:transparent;color:var(--red);border:1px solid var(--red)}.status{color:var(--muted)}.empty{padding:18px;background:var(--card);border:1px solid var(--line);margin-top:14px}</style></head><body><header><div class="wrap"><strong>Rochdale Daily</strong><div>Residents’ Corner moderation</div></div></header><main class="wrap"><h1>Pending submissions</h1><div class="bar"><input id="token" type="password" placeholder="Admin token"><button class="load" id="load">Load queue</button></div><p class="status" id="status">Use the same token as event moderation.</p><div id="queue"></div></main><script>(function(){const API='/api/residents',tokenEl=document.getElementById('token'),queue=document.getElementById('queue'),status=document.getElementById('status');const saved=sessionStorage.getItem('rd_admin_token');if(saved)tokenEl.value=saved;const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');async function load(){const token=tokenEl.value.trim();if(!token)return status.textContent='Enter the token.';status.textContent='Loading…';const r=await fetch(API+'?queue=pending&t='+Date.now(),{headers:{'x-admin-token':token}});const d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Could not load.';return}sessionStorage.setItem('rd_admin_token',token);const items=d.pending||[];queue.innerHTML=items.length?items.map(x=>`<article class="card" data-id="${esc(x.id)}"><h2>${esc(x.title)}</h2><div class="meta">${esc(x.type)} · ${esc(x.name)} · ${esc(x.area)} · ${esc(x.contact)}</div><div class="body">${esc(x.body)}</div><div class="actions"><button class="approve" data-action="approve">Approve</button><button class="reject" data-action="reject">Reject</button></div></article>`).join(''):'<div class="empty">Nothing waiting.</div>';status.textContent=items.length+' waiting.'}async function act(card,action){if(action==='reject'&&!confirm('Reject this submission?'))return;const r=await fetch(API,{method:'POST',headers:{'x-admin-token':tokenEl.value.trim(),'Content-Type':'application/json'},body:JSON.stringify({action,id:card.dataset.id})});const d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Action failed.';return}card.remove();status.textContent=action==='approve'?'Approved.':'Rejected.'}document.getElementById('load').onclick=load;queue.onclick=e=>{const b=e.target.closest('button[data-action]');if(b)act(b.closest('.card'),b.dataset.action)};if(saved)load()})();</script></body></html>
