name: Correct stone circle and hide social sources

on:
  push:
    paths:
      - social_source_privacy_trigger.txt

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Correct article and sanitise public sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, 'scraper')
          from source_presentation import sanitise_article

          path = Path('articles.json')
          articles = json.loads(path.read_text(encoding='utf-8'))
          for article in articles:
              if article.get('slug') == 'new-stone-circle-installed-near-rochdale':
                  article['title'] = 'Stone Circle Near Rochdale Has Stood for Nearly 20 Years'
                  article['excerpt'] = 'A stone circle near Stoney Heys and Brownhouse Wham Reservoir is a long-established local landmark rather than a new installation.'
                  article['content_html'] = (
                      '<p>A stone circle near Stoney Heys and Brownhouse Wham Reservoir has attracted renewed attention after photographs were shared locally.</p>'
                      '<p>Residents and regular walkers have pointed out that the feature is not new and has stood on the hillside for close to two decades, with some dating it to around 2010.</p>'
                      '<p>The earlier version of this article incorrectly described the stone circle as a new installation. Rochdale Daily apologises for the error and has corrected the record.</p>'
                      '<p>The site remains a familiar landmark for walkers using the surrounding moorland paths.</p>'
                  )
                  article['last_updated_at'] = datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
                  article['correction'] = 'The original article incorrectly described the stone circle as newly installed. It has been present for many years.'
              sanitise_article(article)
          path.write_text(json.dumps(articles, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scraper/generate_pages.py
      - name: Commit corrected public site
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json articles sitemap.xml
          git commit -m "Correct stone circle story and hide social source links" || exit 0
          git push
