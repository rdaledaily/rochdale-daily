name: Rochdale Daily slow-news evergreen fallback

on:
  workflow_dispatch:
  schedule:
    # Check hourly; the Python guard permits publication only 09:00-20:00
    # Europe/London and only when the measurable 12-hour supply rule is thin.
    - cron: "47 * * * *"

permissions:
  contents: write
  actions: write

# Serialize with every canonical newspaper writer. A fallback can never race a
# real-news edition or publish from a stale checkout.
concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  evergreen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVERGREEN_MODEL: "gpt-5-mini"
      EVERGREEN_THIN_THRESHOLD: "6"
      EVERGREEN_LOOKBACK_HOURS: "12"
      EVERGREEN_COOLDOWN_HOURS: "24"
      EVERGREEN_START_HOUR: "9"
      EVERGREEN_END_HOUR: "20"
      EVERGREEN_TIMEZONE: "Europe/London"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      USE_SOURCE_IMAGES: "true"
      USE_WIKIMEDIA_COMMONS: "true"
      CSS_SOURCE_PATH: assets/css/article-inline.css
      FRONTPAGE_PRIMARY_DAYS: "2"
      FRONTPAGE_FALLBACK_DAYS: "4"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "45"
      FRONTPAGE_FRESH_HOURS: "36"
      MIN_LIVE_STORIES: "0"
      MIN_FRESH_FRONTPAGE_STORIES: "0"
      SCRAPER_HEALTH_FRESH_HOURS: "36"
      COMMIT_MESSAGE: "Publish Rochdale Daily slow-news evergreen feature"

    steps:
      - name: Check out latest newspaper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Verify fallback trigger before production use
        run: |
          python -m py_compile scraper/evergreen_fallback.py
          PYTHONPATH=scraper python scraper/test_evergreen_fallback.py
          python -m json.tool scraper/evergreen_topics.json > /dev/null

      - name: Measure supply and publish at most one fallback
        id: evergreen
        run: |
          result="$(python scraper/evergreen_fallback.py)"
          echo "$result"
          if printf '%s' "$result" | grep -q '"evergreen": "published"'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean and validate generated feature
        if: steps.evergreen.outputs.published == 'true'
        run: |
          python scraper/content_hygiene.py --fix
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
          python scraper/ensure_article_images.py --articles articles.json
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/content_hygiene.py --fix
          python scraper/content_hygiene.py

      - name: Publish canonical newspaper snapshot
        if: steps.evergreen.outputs.published == 'true'
        id: publish
        run: bash scraper/publish_newsroom_snapshot.sh

      - name: Deploy published fallback edition
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
