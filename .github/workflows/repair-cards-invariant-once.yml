name: Repair canonical cards-only feed invariant

on:
  push:
    paths:
      - '.github/workflows/repair-cards-invariant-once.yml'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

# Re-trigger after the manual publisher verifier proved page generation can
# still reintroduce non-card and missing image references after a clean feed.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install newsroom dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Make front-page post-processing enforce cards-only images
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scraper/frontpage_pipeline.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from story_image import compose_story_card\n'
          new_import = 'from story_image import compose_story_card\nfrom ensure_article_images import enforce_article\n'
          if 'from ensure_article_images import enforce_article\n' not in text:
              if old_import not in text:
                  raise SystemExit('Expected story_image import not found; refusing blind patch')
              text = text.replace(old_import, new_import, 1)

          old_block = '''    # One card style for everything: give every event the same composed\n    # area/category card the rest of the feed uses (replacing category_events.svg).\n    for article in merged:\n        ensure_event_card(article)\n'''
          new_block = '''    # Enforce the cards-only contract AFTER manual/event injection and BEFORE\n    # articles.json, frontpage, area/category archives, or article pages are\n    # derived. This prevents manual records, remote URLs and the legacy\n    # assets/article-images event-card path from re-entering public output.\n    for article in merged:\n        if str(article.get("status") or "published").lower() == "published":\n            enforce_article(article, Path.cwd())\n'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif 'enforce_article(article, Path.cwd())' not in text:
              raise SystemExit('Expected event-card block not found; refusing blind patch')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile and run targeted tests
        env:
          PYTHONPATH: scraper
        run: |
          python -m py_compile scraper/frontpage_pipeline.py scraper/ensure_article_images.py scraper/generate_pages.py
          # Run this regression file exactly as the main CI suite does.  Using
          # `python -m unittest scraper.test_frontpage_pipeline` is incorrect in
          # this repository because scraper/scraper.py shadows a package named
          # `scraper`, so unittest tries to import an attribute that cannot exist.
          python scraper/test_frontpage_pipeline.py

      - name: Rebuild canonical feed and generated pages
        run: |
          python scraper/frontpage_pipeline.py
          python scraper/generate_pages.py

      - name: Verify cards-only image contract after full regeneration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path('articles.json').read_text(encoding='utf-8'))
          bad = []
          missing = []
          for article in rows:
              if not isinstance(article, dict) or str(article.get('status') or 'published').lower() != 'published':
                  continue
              image = str(article.get('image_url') or article.get('img') or '').replace('\\\\', '/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((article.get('slug'), image))
                  continue
              if not Path(image).is_file():
                  missing.append((article.get('slug'), image))
          if bad:
              raise SystemExit(f'Non-cards images remain after canonical rebuild: {bad[:20]}')
          if missing:
              raise SystemExit(f'Missing card files remain after canonical rebuild: {missing[:20]}')
          print(f'Cards-only contract passed for {len(rows)} feed records.')
          PY

      - name: Commit repaired pipeline and regenerated site
        run: |
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scraper/frontpage_pipeline.py articles.json articles image_coverage_report.json assets/img/cards event_dates.json scraper_status.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Enforce cards-only images after editorial injection'
          if git push origin HEAD:main; then
            exit 0
          fi
          echo 'main moved while repairing; aborting rather than rebasing generated output.' >&2
          exit 1
