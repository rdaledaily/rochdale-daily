name: Rochdale Daily immediate scraper run

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-kick.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-scrape-pipeline
  cancel-in-progress: false

jobs:
  fast-news:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "false"
      MAX_NEWS_AGE_HOURS: "72"
      SAME_DAY_ONLY: "false"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "2"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      MAX_AI_ARTICLES_PER_RUN: "50"
      MAX_AI_ARTICLES_INITIAL: "100"
      RESPECT_ROBOTS: "true"
      REQUEST_TIMEOUT: "8"
      SLOW_DOMAIN_FAILURE_THRESHOLD: "2"
      SLOW_DOMAIN_BENCH_HOURS: "12"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "false"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      DISCOVERY_LINKS_PER_SOURCE: "36"
      RSS_ITEMS_PER_SOURCE: "100"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_PAGE_LIMIT: "3"
      DISCOVERY_WORKERS: "16"
      DISCOVERY_LINK_WORKERS: "16"
      AI_WORKERS: "8"
      MIN_BALANCED_SELECTION_LIMIT: "30"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      MIN_LIVE_STORIES: "20"
      SCRAPER_HEALTH_FRESH_HOURS: "24"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      BROWSER_RENDER_ENABLED: "false"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "false"
      COMMIT_MESSAGE: "Update Rochdale Daily immediate local news"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Run resilient Rochdale newsroom pipeline
        timeout-minutes: 18
        run: python scraper/run_newspaper_pipeline.py

      - name: Enforce cards-only article images
        timeout-minutes: 3
        run: python scraper/ensure_article_images.py

      - name: Validate, generate fresh site and verify health
        timeout-minutes: 6
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/repair_merged_bodies.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/check_scraper_health.py

      - name: Refresh weather
        timeout-minutes: 2
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: python scraper/weather_forecast.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json slow_domains.json scraper_status.json scraper_health.json event_dates.json \
            google_news_resolution_report.json google_news_resolutions.json \
            image_coverage_report.json assets/img/cards \
            articles sitemap.xml wards/ ward_areas.json council_votes.json weather.json index.html
          if git diff --cached --quiet; then
            echo "Pipeline completed with no file changes."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          exit 1
