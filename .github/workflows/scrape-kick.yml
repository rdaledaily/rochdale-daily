name: Rochdale Daily immediate scraper run

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-kick.yml"
  workflow_dispatch:

permissions:
  contents: write

# Immediate newsroom refreshes must not sit in the generic background-writer
# queue. GitHub keeps only one pending run per concurrency group, so archive,
# image-repair or other maintenance work could previously cancel this scrape
# before a runner was even assigned. Publication itself remains race-safe via
# publish_newsroom_snapshot.sh if main moves while this job is running.
# Manual kick: 2026-08-15T13:04+01:00
concurrency:
  group: rd-immediate-news-writer
  cancel-in-progress: false

jobs:
  fast-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "false"
      MAX_NEWS_AGE_HOURS: "14"
      SAME_DAY_ONLY: "false"
      # Fresh reporting still owns the top of the page, but the homepage is a
      # destination as well as a freshness gauge. When Rochdale has a quiet
      # 48-hour news cycle, allow useful journalism from the previous week to
      # fill lower slots rather than publishing an under-filled front page.
      # Scraper health continues to judge freshness on its independent 14-hour
      # window below, so older supplemental cards can never disguise a stale
      # newsroom.
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "7"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      MAX_AI_ARTICLES_PER_RUN: "24"
      MAX_AI_ARTICLES_INITIAL: "40"
      RESPECT_ROBOTS: "true"
      REQUEST_TIMEOUT: "5"
      SLOW_DOMAIN_FAILURE_THRESHOLD: "1"
      SLOW_DOMAIN_BENCH_HOURS: "24"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      DISCOVERY_LINKS_PER_SOURCE: "14"
      RSS_ITEMS_PER_SOURCE: "45"
      # Keep every priority/category query available, including fire and
      # environment; save time by reducing depth within each query/source.
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_PAGE_LIMIT: "1"
      DISCOVERY_WORKERS: "16"
      DISCOVERY_LINK_WORKERS: "16"
      AI_WORKERS: "8"
      MIN_BALANCED_SELECTION_LIMIT: "30"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      # A hyperlocal 14-hour window should be judged on fresh usable coverage,
      # not padded to a legacy 72-hour/20-story volume target.
      MIN_LIVE_STORIES: "8"
      MIN_FRESH_FRONTPAGE_STORIES: "6"
      SCRAPER_HEALTH_FRESH_HOURS: "14"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      BROWSER_RENDER_ENABLED: "false"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "false"
      COMMIT_MESSAGE: "Update Rochdale Daily immediate local news"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Run resilient Rochdale newsroom pipeline
        timeout-minutes: 18
        run: python scraper/run_newspaper_pipeline.py

      - name: Remove emojis and publishing artefacts before page generation
        run: python scraper/content_hygiene.py --fix

      - name: Resolve article images
        timeout-minutes: 8
        run: |
          python scraper/ensure_article_images.py
          python scraper/repair_generated_article_images.py
          python scraper/repair_generated_with_commons.py

      - name: Validate, generate fresh site and verify health
        timeout-minutes: 10
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/repair_merged_bodies.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/generate_news_sitemap.py
          python scraper/content_hygiene.py --fix
          python scraper/content_hygiene.py
          python scraper/check_scraper_health.py

      - name: Refresh weather
        timeout-minutes: 2
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: python scraper/weather_forecast.py

      - name: Commit and push race-safe newsroom snapshot
        run: bash scraper/publish_newsroom_snapshot.sh