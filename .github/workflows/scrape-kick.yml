name: Rochdale Daily immediate scraper run

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-kick.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# A code/config push represents a newer newsroom implementation and therefore
# supersedes any older render still holding the shared writer lane. Scheduled
# runs keep cancel-in-progress=false in scrape-fast.yml, so ordinary editions
# serialize rather than cancelling one another.
concurrency:
  group: rd-site-writer
  cancel-in-progress: true

jobs:
  fast-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "true"
      MAX_NEWS_AGE_HOURS: "14"
      PUBLISH_MAX_NEWS_AGE_HOURS: "14"
      CANDIDATE_RESERVOIR_HOURS: "96"
      SAME_DAY_ONLY: "false"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "7"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      MAX_AI_ARTICLES_PER_RUN: "24"
      MAX_AI_ARTICLES_INITIAL: "40"
      RESPECT_ROBOTS: "true"
      REQUEST_TIMEOUT: "7"
      GOOGLE_NEWS_REQUEST_DELAY_SECONDS: "0.5"
      SLOW_DOMAIN_FAILURE_THRESHOLD: "3"
      SLOW_DOMAIN_BENCH_HOURS: "4"
      USE_SOURCE_IMAGES: "true"
      USE_WIKIMEDIA_COMMONS: "true"
      CSS_SOURCE_PATH: assets/css/article-inline.css
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      DISCOVERY_LINKS_PER_SOURCE: "24"
      RSS_ITEMS_PER_SOURCE: "70"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_PAGE_LIMIT: "2"
      DISCOVERY_WORKERS: "16"
      DISCOVERY_LINK_WORKERS: "16"
      AI_WORKERS: "8"
      MIN_BALANCED_SELECTION_LIMIT: "30"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      MIN_LIVE_STORIES: "8"
      MIN_FRESH_FRONTPAGE_STORIES: "6"
      SCRAPER_HEALTH_FRESH_HOURS: "14"
      FRONTPAGE_FRESH_HOURS: "14"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      BROWSER_RENDER_ENABLED: "false"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "false"
      COMMIT_MESSAGE: "Update Rochdale Daily immediate local news"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Run resilient Rochdale newsroom pipeline
        timeout-minutes: 24
        run: python scraper/run_newsroom_policy.py
      - name: Remove emojis and publishing artefacts before page generation
        run: python scraper/content_hygiene.py --fix
      - name: Resolve relevant article images, then guarantee a fallback
        timeout-minutes: 8
        run: |
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
          python scraper/ensure_article_images.py --articles articles.json
      - name: Validate and generate complete canonical site
        timeout-minutes: 10
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/repair_merged_bodies.py
          python scraper/councillor_photos.py
          python scraper/patch_democracy_portraits.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/enforce_frontpage_freshness.py
          python scraper/frontpage_source_quality.py
          PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
          python scraper/enforce_live_homepage_window.py
          python scraper/generate_news_sitemap.py
          python scraper/generate_archive.py
          cp archive.html search.html
          python scraper/update_homepage_static_latest.py
          python scraper/update_homepage_weekly_news.py
          python scraper/homepage_discovery_metadata.py
          python scraper/generate_rss.py
          python scraper/generate_image_sitemap.py
          python scraper/content_hygiene.py --fix
          python scraper/content_hygiene.py
          python scraper/check_scraper_health.py
      - name: Refresh weather
        timeout-minutes: 2
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: python scraper/weather_forecast.py
      - name: Commit and push race-safe newsroom snapshot
        id: publish
        run: bash scraper/publish_newsroom_snapshot.sh
      - name: Deploy published newsroom snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main