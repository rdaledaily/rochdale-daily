name: Refresh permanent news archive

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild archive through canonical publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref main
          echo 'Canonical site rebuild requested; archive, RSS, sitemaps and homepage will be regenerated together.'
