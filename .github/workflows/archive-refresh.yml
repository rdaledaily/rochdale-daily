name: Refresh permanent news archive

on:
  workflow_dispatch:
  schedule:
    # Fast news runs at :05 and :35. Refresh the crawlable archive/homepage
    # shortly afterwards instead of every 10 minutes: bot-authored newsroom
    # commits do not trigger downstream push workflows, so a scheduled healing
    # pass is still required, but two runs per hour is sufficient and avoids
    # unnecessary contention on the shared site-writer lock.
    - cron: '15,45 * * * *'
  push:
    paths:
      - 'articles/**'
      - 'articles.json'
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'scraper/generate_archive.py'
      - 'scraper/enforce_frontpage_freshness.py'
      - 'scraper/update_homepage_static_latest.py'
      - 'scraper/generate_rss.py'
      - '.github/workflows/archive-refresh.yml'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild permanent archive, enforce homepage freshness, crawlable Latest and RSS
        env:
          FRONTPAGE_FRESH_HOURS: '14'
        run: |
          python scraper/generate_archive.py
          cp archive.html search.html
          python scraper/enforce_frontpage_freshness.py
          python scraper/update_homepage_static_latest.py
          python scraper/generate_rss.py
      - name: Advertise RSS feed to browsers and feed readers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<link rel="alternate" type="application/rss+xml" title="Rochdale Daily RSS" href="/rss.xml">'
          if tag not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Homepage </head> not found; refusing broad RSS discovery rewrite')
              text = text.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Keep archive pages in sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('sitemap.xml')
          if not p.exists(): raise SystemExit(0)
          text = p.read_text(encoding='utf-8')
          additions=[]
          for url in ('https://rochdaledaily.co.uk/archive.html','https://rochdaledaily.co.uk/search.html'):
              if url not in text: additions.append(f'  <url><loc>{url}</loc></url>\n')
          if additions:
              text=re.sub(r'\s*</urlset>\s*$','\n'+''.join(additions)+'</urlset>\n',text)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit archive refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive.html search.html archive-index.json articles/frontpage.json sitemap.xml index.html rss.xml
          if git diff --cached --quiet; then echo 'Archive, homepage Latest and RSS already current.'; exit 0; fi
          git commit -m 'Refresh archive, homepage latest news and RSS feed'
          git push origin HEAD:main
