name: Rochdale Daily pipeline tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "requirements.txt"
      - "articles.json"
      - "category.html"
      - "post.html"
      - "assets/css/rd-tokens.css"
      - "assets/css/newspaper-global.css"
      - "assets/css/public-families.css"
      - "assets/css/editorial-theme.css"
      - "assets/css/legacy-routing-pages.css"
      - "assets/js/category-page.js"
      - "assets/js/post-page.js"
      - "assets/js/menu.js"
      - "assets/js/article-comments.js"
      - "assets/js/new-story-alerts.js"
      - "assets/js/my-rochdale.js"
      - "tests/test_my_rochdale_crime.cjs"
      - "functions/api/borough-data.js"
      - "my-rochdale.html"
      - "assets/js/read-next.js"
      - "assets/js/onesignal-push.js"
      - "functions/api/news-push.js"
      - "functions/api/onesignal-web-config.js"
      - "news-alerts.html"
      - "OneSignalSDKWorker.js"
      - "assets/css/frontpage-refresh.css"
      - "index.html"
      - "assets/js/cookie-consent.js"
      - "assets/img/logo.png"
      - "assets/img/cards/**"
      - "manual_articles.json"
      - "manual_events.json"
      - "adverts.json"
      - "ward_areas.json"
      - "story_blocklist.json"
      - "council_roster.json"
      - "council_votes.json"
      - ".github/workflows/**"
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: rd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
          python -m pip install --no-cache-dir "pytest>=8,<9"
      - name: Verify Python dependencies
        run: |
          python - <<'PY'
          import bs4
          import dateparser
          import feedparser
          import lxml
          import openai
          import requests
          from PIL import Image
          from playwright.sync_api import sync_playwright
          print("Dependency verification passed.")
          print("Pillow version:", Image.__version__)
          PY
      - name: Compile pipeline modules
        run: |
          python -m py_compile \
            scraper/locality_rules.py \
            scraper/story_identity.py \
            scraper/selection_policy.py \
            scraper/search_queries.py \
            scraper/rewrite_safety.py \
            scraper/house_style.py \
            scraper/editorial_upgrade.py \
            scraper/source_presentation.py \
            scraper/content_hygiene.py \
            scraper/live_story_updates.py \
            scraper/compact_live_updates.py \
            scraper/render_live_updates.py \
            scraper/scrub_personal_name.py \
            scraper/google_news_resolver.py \
            scraper/frontpage_source_quality.py \
            scraper/frontpage_manual_publish.py \
            scraper/ensure_manual_frontpage.py \
            scraper/verify_manual_publication.py \
            scraper/generate_pages.py \
            scraper/story_background.py \
            scraper/generate_newspaper_pages.py \
            scraper/generate_ward_pages.py \
            scraper/generate_news_sitemap.py \
            scraper/update_homepage_static_latest.py \
            scraper/update_homepage_weekly_news.py \
            scraper/sync_homepage_top_story.py \
            scraper/homepage_discovery_metadata.py \
            scraper/add_article_time_metadata.py \
            scraper/externalise_article_css.py \
            scraper/enhance_image_alt_text.py \
            scraper/enhance_event_structured_data.py \
            scraper/consolidate_duplicate_article_signals.py \
            scraper/check_scraper_health.py \
            scraper/supply_watchdog.py \
            scraper/source_yield_probe.py \
            scraper/model_bridge.py \
            scraper/dual_agent_bridge.py \
            scraper/evergreen_fallback.py \
            scraper/run_newspaper_pipeline.py \
            scraper/run_newsroom_policy.py \
            scraper/councillor_photos.py \
            scraper/food_hygiene.py \
            scraper/primary_data.py \
            scraper/frontpage_pipeline.py \
            scraper/enforce_frontpage_freshness.py \
            scraper/merge_feeds.py \
            scraper/resolve_google_news_sources.py \
            scraper/ensure_article_images.py \
            scraper/enforce_cards_only_images.py \
            scraper/repair_generated_article_images.py \
            scraper/guarantee_article_images.py \
            scraper/normalise_public_theme.py \
            scraper/scraper.py \
            scraper/editorial_review.py \
            scraper/claim_evidence.py \
            scraper/source_evidence_capture.py \
            scraper/editorial_review_queue.py \
            scraper/prepare_publication_evidence.py \
            scraper/independent_fact_review.py \
            scraper/audit_published_news.py \
            scraper/structured_official_notices.py
      - name: Check route JavaScript syntax
        run: |
          node --check assets/js/category-page.js
          node --check assets/js/post-page.js
          node --check assets/js/menu.js
          node --check assets/js/new-story-alerts.js
          node --check assets/js/read-next.js
          node --check assets/js/onesignal-push.js
          node --check functions/api/news-push.js
          node --check functions/api/onesignal-web-config.js
          node --check OneSignalSDKWorker.js
          node --check assets/js/my-rochdale.js
          node tests/test_my_rochdale_crime.cjs
          node --check functions/api/borough-data.js
      - name: Verify live homepage inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          home = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script>', home, re.I | re.S)
          for number, (attrs, code) in enumerate(scripts):
              if re.search(r'\bsrc\s*=', attrs, re.I) or "application/ld+json" in attrs.lower():
                  continue
              if code.strip():
                  Path(f"/tmp/rd-inline-{number}.js").write_text(code, encoding="utf-8")
          PY
          for script in /tmp/rd-inline-*.js; do [ -f "$script" ] || continue; node --check "$script"; done
      - name: Validate hand-edited data files
        run: |
          python scraper/check_data_files.py
          python -m json.tool scraper/evergreen_topics.json > /dev/null
      - name: Run test suite
        run: |
          # t runs one test and, if it fails, puts its last 30 lines in the run
          # summary as an annotation, so a failure names itself and shows why
          # without opening the raw log.
          t() {
            local out status
            out=$("$@" 2>&1) && status=0 || status=$?
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ]; then
              local tail_lines
              tail_lines=$(printf '%s' "$out" | tail -n 30 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Failing test: $*::${tail_lines}"
              return "$status"
            fi
          }
          t python scraper/test_frontpage_pipeline.py
          t env PYTHONPATH=scraper python scraper/test_frontpage_freshness_guard.py
          t env PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
          t env PYTHONPATH=scraper python scraper/test_manual_frontpage_guard.py
          t env PYTHONPATH=scraper python scraper/test_check_scraper_health.py
          t env PYTHONPATH=scraper python scraper/test_supply_watchdog.py
          t env PYTHONPATH=scraper python scraper/test_source_yield_probe.py
          t python scraper/test_newspaper_freshness.py
          t python scraper/test_locality.py
          t python scraper/test_story_identity.py
          t python scraper/test_missing_person_identity.py
          t python scraper/test_archive_quality.py
          t python scraper/test_uk_update_times.py
          t python scraper/test_image_hierarchy.py
          t python scraper/test_context_research.py
          t python scraper/test_selection_policy.py
          t python scraper/test_search_queries.py
          t python scraper/test_rewrite_safety.py
          t env PYTHONPATH=scraper python scraper/test_house_style_voice.py
          t env PYTHONPATH=scraper python scraper/test_reader_first_template.py
          t env PYTHONPATH=scraper python scraper/test_facebook_roundups.py
          t python scraper/test_editorial_length.py
          t python scraper/test_food_hygiene.py
          t python scraper/test_content_hygiene.py
          t python scraper/test_archive_persistence.py
          t python scraper/test_event_identity.py
          t python scraper/test_article_gate.py
          t env PYTHONPATH=scraper python scraper/test_editorial_review.py
          t env PYTHONPATH=scraper python scraper/test_claim_evidence.py
          t env PYTHONPATH=scraper python scraper/test_source_evidence_capture.py
          t env PYTHONPATH=scraper python scraper/test_editorial_review_queue.py
          t env PYTHONPATH=scraper python scraper/test_evidence_publication_integration.py
          t env PYTHONPATH=scraper python scraper/test_evidence_publication_repair.py
          t env PYTHONPATH=scraper python scraper/test_structured_official_notices.py
          t env PYTHONPATH=scraper python scraper/test_workflow_evidence_order.py
          t env PYTHONPATH=scraper python scraper/test_prepare_publication_evidence.py
          t env PYTHONPATH=scraper python scraper/test_independent_fact_review.py
          t python scraper/test_resolve_google_news_sources.py
          t env PYTHONPATH=scraper python scraper/test_google_news_resolver.py
          t env PYTHONPATH=scraper python scraper/test_run_newsroom_policy.py
          t env PYTHONPATH=scraper python scraper/test_evergreen_fallback.py
          t env PYTHONPATH=scraper python scraper/test_feature_policy.py
          t env PYTHONPATH=scraper python scraper/test_rewrite_ledger.py
          t env PYTHONPATH=scraper python scraper/test_overlap_rebuild.py
          t env PYTHONPATH=scraper python scraper/test_sponsored_frontpage_floor.py
          t env PYTHONPATH=scraper python scraper/test_generated_card_style.py
          t env PYTHONPATH=scraper python scraper/test_prune_dead_related_links.py
          t env PYTHONPATH=scraper python scraper/test_deterministic_draft_gate.py
          t env PYTHONPATH=scraper python scraper/test_daily_briefing.py
          t env PYTHONPATH=scraper python scraper/test_primary_data.py
          t env PYTHONPATH=scraper python scraper/test_send_newsletter.py
          t env PYTHONPATH=scraper python scraper/test_rss_feed_isolation.py
          t env PYTHONPATH=scraper python scraper/test_clean_urls.py
          t env PYTHONPATH=scraper python scraper/test_archive_integrity.py
          t env PYTHONPATH=scraper python scraper/test_publisher_markup.py
          t env PYTHONPATH=scraper python scraper/test_indexnow.py
          t env PYTHONPATH=scraper python scraper/test_archive_pages.py
          t env PYTHONPATH=scraper python scraper/test_internal_links.py
          t env PYTHONPATH=scraper python scraper/test_briefing_formatting.py
          t env PYTHONPATH=scraper python scraper/test_dual_agent_bridge.py
          t python scraper/test_ensure_article_images.py
          t env PYTHONPATH=scraper python scraper/test_licensed_source_images.py
          t python scraper/test_councillor_photos.py
          t env PYTHONPATH=scraper python scraper/test_generate_news_sitemap.py
          t env PYTHONPATH=scraper python scraper/test_update_homepage_static_latest.py
          t env PYTHONPATH=scraper python scraper/test_update_homepage_weekly_news.py
          t env PYTHONPATH=scraper python scraper/test_sync_homepage_top_story.py
          t env PYTHONPATH=scraper python scraper/test_homepage_discovery_metadata.py
          t env PYTHONPATH=scraper python scraper/test_article_time_metadata.py
          t env PYTHONPATH=scraper python scraper/test_externalise_article_css.py
          t env PYTHONPATH=scraper python scraper/test_enhance_image_alt_text.py
          t env PYTHONPATH=scraper python scraper/test_enhance_event_structured_data.py
          t env PYTHONPATH=scraper python scraper/test_consolidate_duplicate_article_signals.py
          t env PYTHONPATH=scraper python scraper/test_live_story_updates.py
          t env PYTHONPATH=scraper python scraper/test_compact_live_updates.py
          t env PYTHONPATH=scraper python scraper/test_scrub_personal_name.py
          t env PYTHONPATH=scraper python scraper/test_model_bridge.py -v
          t python scraper/test_workflow_architecture.py
          t python scraper/test_legacy_routing_pages.py
          t python -m pytest -q scraper/test_story_background.py scraper/test_inline_related.py \
            scraper/test_headline_style.py scraper/test_ad_slots.py scraper/test_roadworks_page.py \
            scraper/test_archive_identity_repair.py scraper/test_gambling_piracy_policy.py \
            scraper/test_publisher_name_not_entity.py \
            scraper/test_social_radar.py scraper/test_takedown_beats_manual.py
          # Tests that existed but were never run by CI until 24 Oct 2026.
          t env PYTHONPATH=scraper python scraper/test_advertising_commercial_launch.py
          t env PYTHONPATH=scraper python scraper/test_archive_identity_furniture.py
          t env PYTHONPATH=scraper python scraper/test_backfill_article_images.py
          t env PYTHONPATH=scraper python scraper/test_broadsheet_article.py
          t env PYTHONPATH=scraper python scraper/test_candidate_autopsy.py
          t env PYTHONPATH=scraper python scraper/test_card_filename_matching.py
          t env PYTHONPATH=scraper python scraper/test_council_vote_integrity.py
          t env PYTHONPATH=scraper python scraper/test_gmp_watch.py
          t env PYTHONPATH=scraper python scraper/test_homepage_democracy_portraits.py
          t env PYTHONPATH=scraper python scraper/test_manual_image_boundary.py
          t env PYTHONPATH=scraper python scraper/test_manual_photo_survives_all_lanes.py
          t env PYTHONPATH=scraper python scraper/test_manual_source_links.py
          t env PYTHONPATH=scraper python scraper/test_newsroom_archive_recovery.py
          t env PYTHONPATH=scraper python scraper/test_newsroom_push_recovery.py
          t env PYTHONPATH=scraper python scraper/test_newsroom_unblock_oct2026.py
          t env PYTHONPATH=scraper python scraper/test_normalise_article_urls.py
          t env PYTHONPATH=scraper python scraper/test_planning_in_environment.py
          t env PYTHONPATH=scraper python scraper/test_production_rewrite_reports_skips.py
          t env PYTHONPATH=scraper python scraper/test_quality_gate_split.py
          t env PYTHONPATH=scraper python scraper/test_reader_growth.py
          t env PYTHONPATH=scraper python scraper/test_register_watch.py
          t env PYTHONPATH=scraper python scraper/test_reservoir_junk_oct2026.py
          t env PYTHONPATH=scraper python scraper/test_rewrite_quality.py
          t env PYTHONPATH=scraper python scraper/test_rewrite_skip_reasons.py
          t env PYTHONPATH=scraper python scraper/test_rewrite_terminal_reasons.py
          t env PYTHONPATH=scraper python scraper/test_robots_policy.py
          t env PYTHONPATH=scraper python scraper/test_seo_image_metadata.py
          t env PYTHONPATH=scraper python scraper/test_sitemap_canonical_routes.py
          t env PYTHONPATH=scraper python scraper/test_source_recovery_oct2026.py
          t env PYTHONPATH=scraper python scraper/test_theme_token_repair.py
          t env PYTHONPATH=scraper python scraper/test_trusted_editorial_sources.py
          t env PYTHONPATH=scraper python scraper/test_weekly_seo_audit.py
          t env PYTHONPATH=scraper python scraper/test_feature_never_leads.py
          t python scraper/test_every_test_runs_in_ci.py
          # Test the publishing contract (one normalise pass leaves nothing for
          # --check), not whether the last bot run has caught up with a code
          # change: on 24 Oct 2026 every rendering change failed this job until
          # the next lane rebuilt the committed pages. The lanes run this same
          # pair before they commit, so committed pages always pass it.
          t python scraper/normalise_public_theme.py
          t python scraper/normalise_public_theme.py --check
      - name: Enforce cards-only canonical article images
        run: python scraper/enforce_cards_only_images.py --articles articles.json --check
      - name: SEO feed quality gate
        run: python scraper/seo_lint.py
      - name: Banner self-service contracts
        run: python scraper/test_banner_self_service_contract.py
      - name: Banner artwork revision and race tests
        run: node --test scraper/test_banner_artwork_review.mjs
      - name: New story notification smoke tests
        run: python scraper/test_new_story_alerts.py
      - name: Reader loyalty UI/API contract smoke tests
        run: python scraper/test_reader_loyalty_contract.py
      - name: Verify scraper imports cleanly
        run: |
          cd scraper
          python -c "import scraper; print('Scraper startup import passed.')"
