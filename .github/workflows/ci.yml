name: Rochdale Daily pipeline tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "requirements.txt"
      - "articles.json"
      - "assets/img/cards/**"
      - "manual_articles.json"
      - "manual_events.json"
      - "adverts.json"
      - "ward_areas.json"
      - "story_blocklist.json"
      - "council_roster.json"
      - "council_votes.json"
      - ".github/workflows/**"
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: rd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Verify Python dependencies
        run: |
          python - <<'PY'
          import bs4
          import dateparser
          import feedparser
          import lxml
          import openai
          import requests
          from PIL import Image
          from playwright.sync_api import sync_playwright
          print("Dependency verification passed.")
          print("Pillow version:", Image.__version__)
          PY
      - name: Compile pipeline modules
        run: |
          python -m py_compile \
            scraper/locality_rules.py \
            scraper/story_identity.py \
            scraper/selection_policy.py \
            scraper/search_queries.py \
            scraper/rewrite_safety.py \
            scraper/house_style.py \
            scraper/editorial_upgrade.py \
            scraper/source_presentation.py \
            scraper/content_hygiene.py \
            scraper/live_story_updates.py \
            scraper/compact_live_updates.py \
            scraper/render_live_updates.py \
            scraper/scrub_personal_name.py \
            scraper/google_news_resolver.py \
            scraper/frontpage_source_quality.py \
            scraper/generate_pages.py \
            scraper/generate_newspaper_pages.py \
            scraper/generate_ward_pages.py \
            scraper/generate_news_sitemap.py \
            scraper/update_homepage_static_latest.py \
            scraper/update_homepage_weekly_news.py \
            scraper/sync_homepage_top_story.py \
            scraper/homepage_discovery_metadata.py \
            scraper/add_article_time_metadata.py \
            scraper/externalise_article_css.py \
            scraper/enhance_image_alt_text.py \
            scraper/consolidate_duplicate_article_signals.py \
            scraper/check_scraper_health.py \
            scraper/run_newspaper_pipeline.py \
            scraper/run_newsroom_policy.py \
            scraper/councillor_photos.py \
            scraper/food_hygiene.py \
            scraper/frontpage_pipeline.py \
            scraper/enforce_frontpage_freshness.py \
            scraper/merge_feeds.py \
            scraper/resolve_google_news_sources.py \
            scraper/ensure_article_images.py \
            scraper/enforce_cards_only_images.py \
            scraper/repair_generated_article_images.py \
            scraper/guarantee_article_images.py \
            scraper/scraper.py
      - name: Validate hand-edited data files
        run: python scraper/check_data_files.py
      - name: Run test suite
        run: |
          python scraper/test_frontpage_pipeline.py
          PYTHONPATH=scraper python scraper/test_frontpage_freshness_guard.py
          PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
          PYTHONPATH=scraper python scraper/test_check_scraper_health.py
          python scraper/test_newspaper_freshness.py
          python scraper/test_locality.py
          python scraper/test_story_identity.py
          python scraper/test_selection_policy.py
          python scraper/test_search_queries.py
          python scraper/test_rewrite_safety.py
          python scraper/test_editorial_length.py
          python scraper/test_food_hygiene.py
          python scraper/test_content_hygiene.py
          python scraper/test_archive_persistence.py
          python scraper/test_event_identity.py
          python scraper/test_article_gate.py
          python scraper/test_resolve_google_news_sources.py
          PYTHONPATH=scraper python scraper/test_google_news_resolver.py
          PYTHONPATH=scraper python scraper/test_run_newsroom_policy.py
          python scraper/test_ensure_article_images.py
          python scraper/test_councillor_photos.py
          PYTHONPATH=scraper python scraper/test_generate_news_sitemap.py
          PYTHONPATH=scraper python scraper/test_update_homepage_static_latest.py
          PYTHONPATH=scraper python scraper/test_update_homepage_weekly_news.py
          PYTHONPATH=scraper python scraper/test_sync_homepage_top_story.py
          PYTHONPATH=scraper python scraper/test_homepage_discovery_metadata.py
          PYTHONPATH=scraper python scraper/test_article_time_metadata.py
          PYTHONPATH=scraper python scraper/test_externalise_article_css.py
          PYTHONPATH=scraper python scraper/test_enhance_image_alt_text.py
          PYTHONPATH=scraper python scraper/test_consolidate_duplicate_article_signals.py
          PYTHONPATH=scraper python scraper/test_live_story_updates.py
          PYTHONPATH=scraper python scraper/test_compact_live_updates.py
          PYTHONPATH=scraper python scraper/test_scrub_personal_name.py
          python scraper/test_workflow_architecture.py
      - name: Enforce cards-only canonical article images
        run: python scraper/enforce_cards_only_images.py --articles articles.json --check
      - name: Verify scraper imports cleanly
        run: |
          cd scraper
          python -c "import scraper; print('Scraper startup import passed.')"
