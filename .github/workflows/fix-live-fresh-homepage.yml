name: Fix live and fresh homepage

on:
  push:
    paths:
      - fix_live_fresh_homepage.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Make homepage live pin persistent and stop stale featured stories leading
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          pipeline_path = Path('scraper/frontpage_pipeline.py')
          text = pipeline_path.read_text(encoding='utf-8')

          old_pin = '    pinned = article.get("featured") is True\n'
          new_pin = '''    # A normal editorial feature may lead while it is genuinely fresh.\n    # Older featured pieces can remain on the front page via frontpage_until,\n    # but must not indefinitely outrank breaking/new stories. Long-running\n    # live coverage uses force_lead explicitly.\n    pinned = (\n        article.get("featured") is True\n        and (age_hours <= 24 or article.get("force_lead") is True)\n    )\n'''
          if old_pin in text:
              text = text.replace(old_pin, new_pin, 1)

          marker = '    frontpage, coverage = select_frontpage(merged, now)\n'
          injection = '''    frontpage, coverage = select_frontpage(merged, now)\n\n    # Festival weekend editorial override. This is inserted AFTER the normal\n    # news/event selection because events ordinarily belong in What's On, but\n    # a rolling live blog is also a live news story and needs to be the homepage\n    # lead while the festival is under way. The special ../ slug deliberately\n    # resolves articles/../feel-good-live.html to the dedicated live page.\n    festival_live_until = datetime(2026, 8, 9, 0, 30, tzinfo=timezone.utc)\n    if now <= festival_live_until:\n        live_story = {\n            "id": "feel-good-festival-2026-live",\n            "slug": "../feel-good-live",\n            "story_key": "editorial:feel-good-festival-2026-live",\n            "title": "LIVE: Rochdale Feel Good Festival 2026 — updates throughout the day",\n            "excerpt": "Follow Rochdale Daily live from Feel Good Festival 2026, with Gabrielle, Ash, Starsailor, town-centre updates, timings, food and drink, travel and everything happening across Rochdale.",\n            "content_html": "<p>Follow Rochdale Daily's rolling live coverage of Feel Good Festival 2026 throughout Saturday 8 August.</p>",\n            "area": "rochdale",\n            "category": "news",\n            "types": ["news"],\n            "source_kind": "editorial",\n            "status": "published",\n            "published_at": iso_utc(now),\n            "first_published_at": "2026-08-08T07:00:00Z",\n            "last_updated_at": iso_utc(now),\n            "scraped_at": iso_utc(now),\n            "source_name": "Rochdale Daily",\n            "source_url": "https://rochdaledaily.co.uk/feel-good-live.html",\n            "source_names": ["Rochdale Daily"],\n            "source_urls": ["https://rochdaledaily.co.uk/feel-good-live.html"],\n            "image_url": "assets/img/cards/rochdale-town-hall.jpg",\n            "image_credit": "Rochdale Daily",\n            "byline": "Rochdale Daily",\n            "manual_article": True,\n            "editorial_lock": True,\n            "publication_route": "editorial-live",\n            "rewrite_quality_checked": True,\n            "featured": True,\n            "force_lead": True,\n            "is_ongoing": True,\n            "ongoing_label": "LIVE",\n            "update_count": 5,\n        }\n        frontpage = [item for item in frontpage if item.get("id") != live_story["id"]]\n        frontpage.insert(0, live_story)\n        for index, article in enumerate(frontpage):\n            article["frontpage_rank"] = index\n            article["frontpage_priority"] = max(1, 10000 - index) if index == 0 else max(1, 1000 - index)\n            article["slot"] = "lead" if index == 0 else ("secondary-1" if index == 1 else ("secondary-2" if index == 2 else ""))\n'''
          if marker in text and 'festival_live_until = datetime(2026, 8, 9' not in text:
              text = text.replace(marker, injection, 1)

          pipeline_path.write_text(text, encoding='utf-8')

          # Correct the currently published front page immediately, rather than\n          # waiting for the next scheduled scrape. Newest genuine stories follow\n          # the live blog; a days-old featured story no longer occupies the lead.\n          fp = Path('articles/frontpage.json')
          data = json.loads(fp.read_text(encoding='utf-8'))
          articles = [a for a in (data.get('articles') or []) if a.get('id') != 'feel-good-festival-2026-live']

          def dt(a):
              value = a.get('first_published_at') or a.get('published_at') or ''
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).timestamp()
              except Exception:
                  return 0

          # For the immediate repair, put today's/newest material first. The\n          # normal balanced selector takes over again on the next scraper run.\n          articles.sort(key=dt, reverse=True)
          now = datetime.now(timezone.utc).replace(microsecond=0)
          now_iso = now.isoformat().replace('+00:00', 'Z')
          live = {
              'id': 'feel-good-festival-2026-live',
              'slug': '../feel-good-live',
              'story_key': 'editorial:feel-good-festival-2026-live',
              'title': 'LIVE: Rochdale Feel Good Festival 2026 — updates throughout the day',
              'excerpt': 'Follow Rochdale Daily live from Feel Good Festival 2026, with Gabrielle, Ash, Starsailor, town-centre updates, timings, food and drink, travel and everything happening across Rochdale.',
              'content_html': '<p>Follow Rochdale Daily live throughout Feel Good Festival 2026.</p>',
              'area': 'rochdale', 'category': 'news', 'types': ['news'],
              'source_kind': 'editorial', 'status': 'published',
              'published_at': now_iso, 'first_published_at': '2026-08-08T07:00:00Z',
              'last_updated_at': now_iso, 'scraped_at': now_iso,
              'source_name': 'Rochdale Daily',
              'source_url': 'https://rochdaledaily.co.uk/feel-good-live.html',
              'source_names': ['Rochdale Daily'],
              'source_urls': ['https://rochdaledaily.co.uk/feel-good-live.html'],
              'image_url': 'assets/img/cards/rochdale-town-hall.jpg',
              'image_credit': 'Rochdale Daily', 'byline': 'Rochdale Daily',
              'manual_article': True, 'editorial_lock': True,
              'publication_route': 'editorial-live', 'rewrite_quality_checked': True,
              'featured': True, 'force_lead': True, 'is_ongoing': True,
              'ongoing_label': 'LIVE', 'update_count': 5
          }
          articles.insert(0, live)
          for i, article in enumerate(articles):
              article['frontpage_rank'] = i
              article['frontpage_priority'] = 10000 if i == 0 else max(1, 1000-i)
              article['slot'] = 'lead' if i == 0 else ('secondary-1' if i == 1 else ('secondary-2' if i == 2 else ''))
          data['articles'] = articles
          data['count'] = len(articles)
          data['generated_at'] = now_iso
          live_title = live['title']
          old_breaking = str(data.get('breaking') or '').strip()
          data['breaking'] = live_title + (('     •     BREAKING     •     ' + old_breaking) if old_breaking and live_title not in old_breaking else '')
          fp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit persistent repair
        run: |
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f fix_live_fresh_homepage.txt
          git add scraper/frontpage_pipeline.py articles/frontpage.json fix_live_fresh_homepage.txt
          git commit -m 'Keep Feel Good live coverage first and prioritise fresh stories'
          git pull --rebase origin main
          git push origin HEAD:main
