name: Deploy Rochdale Daily to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - manual_articles.json
      - 'manual_articles.d/**'
      - 'pending_manual_*.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Several workflows can push to main seconds apart. A manual-article source
# commit is intentionally ignored here: publish.yml must first turn it into the
# real articles.json/frontpage/article-page output. This prevents an incomplete
# intermediate commit being deployed. For all deployable commits, newest main
# always wins so a stale queued Pages build cannot replace a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FRONTPAGE_FRESH_HOURS: '14'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to latest main before upload
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Deploying commit $(git rev-parse HEAD)"

      # Generated-site maintenance workflows can legitimately rewrite frontpage
      # artifacts. Reassert the same newsroom freshness policy at the final
      # delivery boundary so stale fallback rows can never be uploaded to Pages
      # merely because a maintenance rebuild raced a news run.
      - name: Reassert final homepage freshness before upload
        run: |
          python3 scraper/enforce_frontpage_freshness.py
          python3 scraper/enforce_live_homepage_window.py
          python3 scraper/update_homepage_static_latest.py

      # robots.txt advertises image-sitemap.xml. Archive refreshes may defer
      # while a newsroom writer is active, so generate the sitemap again at the
      # final delivery boundary. This prevents deploying a robots-advertised 404
      # without adding another writer or modifying repository state.
      - name: Generate image sitemap for deployed snapshot
        run: python3 scraper/generate_image_sitemap.py

      # Polling/scrape timestamps are operational metadata, not proof that an
      # article changed. Repair sitemap lastmod immediately before upload so
      # crawlers only receive publication/editorial/live-update timestamps.
      - name: Audit sitemap modification dates
        run: python3 scraper/repair_sitemap_lastmod.py

      # Keep feed autodiscovery and the machine-readable Latest-news ItemList
      # aligned with the static links that crawlers can actually see, even if a
      # scheduled archive refresh was deferred by an active newsroom writer.
      - name: Refresh homepage discovery metadata
        run: python3 scraper/homepage_discovery_metadata.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
