name: Deploy Rochdale Daily to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - manual_articles.json
      - 'manual_articles.d/**'
      - 'pending_manual_*.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Several workflows can push to main seconds apart. A manual-article source
# commit is intentionally ignored here: publish.yml must first turn it into the
# real articles.json/frontpage/article-page output. This prevents an incomplete
# intermediate commit being deployed. For all deployable commits, newest main
# always wins so a stale queued Pages build cannot replace a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to latest main before upload
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Deploying commit $(git rev-parse HEAD)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
