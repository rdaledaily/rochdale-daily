name: Deploy Rochdale Daily to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy when canonical public output or shared front-end assets change.
    # Keeping the workflow file itself in this list ensures deployment-rule
    # fixes and explicit publish triggers deploy the latest complete snapshot.
    paths:
      - articles.json
      - 'articles/**'
      - index.html
      - advertise.html
      - my-rochdale.html
      - OneSignalSDKWorker.js
      - news-alerts.html
      - 'editor/news-push.html'
      - 'functions/api/news-push.js'
      - 'functions/api/onesignal-web-config.js'
      - 'functions/api/borough-data.js'
      - ward_areas.json
      - archive-index.json
      - advertising-media-pack.html
      - privacy.html
      - 'editor/advertising-enquiries.html'
      - 'functions/api/advertising-enquiries.js'
      - rss.xml
      - sitemap.xml
      - news-sitemap.xml
      - image-sitemap.xml
      - archive.html
      - search.html
      - archive-index.json
      - 'assets/img/cards/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/data/**'
      - 'wards/**'
      - 'showbiz/**'
      - weather.json
      - council_votes.json
      - councillor_photos.json
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Several workflows can push generated output to main seconds apart. Newest main
# always wins so a stale queued Pages build cannot replace a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    env:
      FRONTPAGE_FRESH_HOURS: '36'
      FRONTPAGE_TARGET_ARTICLES: '45'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to latest main before upload
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Deploying commit $(git rev-parse HEAD)"

      - name: Verify archive duplicate identity regression
        run: python3 scraper/test_archive_identity_furniture.py

      - name: Reassert final homepage freshness before upload
        run: |
          python3 scraper/enforce_frontpage_freshness.py
          python3 scraper/enforce_live_homepage_window.py
          python3 scraper/ensure_manual_frontpage.py
          python3 scraper/update_homepage_static_latest.py
          python3 scraper/update_homepage_weekly_news.py
          python3 scraper/sync_homepage_top_story.py

      - name: Regenerate ward and place pages from shared chrome
        run: python3 scraper/generate_ward_pages.py

      - name: Add visible article publication timing
        run: python3 scraper/add_article_time_metadata.py

      - name: Add descriptive alt text to news images
        run: python3 scraper/enhance_image_alt_text.py

      - name: Add Event structured data to What's On pages
        run: python3 scraper/enhance_event_structured_data.py

      - name: Generate image sitemap for deployed snapshot
        run: python3 scraper/generate_image_sitemap.py

      - name: Audit sitemap modification dates
        run: python3 scraper/repair_sitemap_lastmod.py

      - name: Consolidate duplicate article SEO signals
        run: python3 scraper/consolidate_duplicate_article_signals.py

      - name: Refresh homepage discovery metadata
        run: python3 scraper/homepage_discovery_metadata.py

      - name: Externalise shared article CSS
        run: python3 scraper/externalise_article_css.py

      - name: Build privacy-safe local postcode dashboard fallback
        run: python3 scraper/generate_my_rochdale_snapshot.py

      - name: Verify manual stories survived publication
        run: python3 scraper/verify_manual_publication.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
