name: Rochdale Daily supply watchdog

# Answers the question the newsroom health check cannot: is the borough's news
# supply itself failing? Runs outside the site-writer lane, writes nothing to
# the published site and can never block or delay an edition. When daily output
# falls under the floor this job fails, and GitHub's own workflow-failure
# notification carries the number to the editor.

on:
  workflow_dispatch:
  schedule:
    # Morning, afternoon and late edition checks (UTC).
    - cron: "45 7,15,22 * * *"

permissions:
  contents: write

concurrency:
  group: rd-supply-watchdog
  cancel-in-progress: true

jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPPLY_DAILY_TARGET: "60"
      SUPPLY_DAILY_FLOOR: "12"
      SUPPLY_ROLLING_DAYS: "7"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Measure published news supply
        id: measure
        continue-on-error: true
        run: python scraper/supply_watchdog.py
      - name: Commit supply report
        if: always()
        run: |
          mkdir -p reports
          if [ -f supply_report.json ]; then mv supply_report.json reports/supply_report.json; fi
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"
          git add reports/supply_report.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Record borough news supply measurement"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 7))
          done
          echo "::warning::supply report could not push after five attempts"
      - name: Report low supply without failing the workflow
        if: steps.measure.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/supply_report.json")
          if not report_path.exists():
              raise SystemExit("supply watchdog failed without writing reports/supply_report.json")

          payload = json.loads(report_path.read_text(encoding="utf-8"))
          if payload.get("status") != "failed":
              raise SystemExit(
                  "supply watchdog step failed for an unexpected reason; "
                  "reports/supply_report.json did not report a supply shortfall"
              )

          last_24h = payload.get("published_last_24h")
          rolling_days = payload.get("rolling_days")
          rolling_mean = payload.get("rolling_mean_per_day")
          floor = payload.get("daily_floor")
          warning = (
              f"borough news supply is below the floor "
              f"({last_24h} stories in the last 24 hours; "
              f"{rolling_days}-day average {rolling_mean}/day; floor {floor}) "
              "see reports/supply_report.json"
          )
          print(f"::warning::{warning}")

          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Supply watchdog alert\n\n")
                  handle.write(f"- Last 24 hours: {last_24h} stories\n")
                  handle.write(f"- {rolling_days}-day average: {rolling_mean}/day\n")
                  handle.write(f"- Floor: {floor}\n")
                  handle.write("- Workflow kept green because this is a monitored supply shortfall, not a site failure.\n")
          PY
