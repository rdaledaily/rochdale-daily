name: Measure FixMyStreet ward reports

# Measurement only. This runs street_reports.py on its own, prints the real
# ward and topic counts to the Actions log, and writes nothing - no commit, no
# articles.json change, no deploy. It exists so the thresholds in
# street_reports.py are set from Rochdale's actual volume rather than a guess.
#
# Run it from the Actions tab. It is never scheduled.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Comma-separated day windows to measure"
        required: false
        default: "7,14,28"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Measure ward report volume
        env:
          WINDOWS: ${{ inputs.windows }}
        run: |
          cd scraper
          python - <<'PY'
          import json, os, sys
          import requests
          from street_reports import (
              fetch_ward_counts, WARDS, TOPIC_LABELS, SUSPECTED_FEED_ITEM_CAP)

          windows = [int(w) for w in os.environ.get("WINDOWS", "7,14,28").split(",") if w.strip()]
          session = requests.Session()
          summary = []

          for days in windows:
              result = fetch_ward_counts(session.get, days=days)
              diag = result["diagnostics"]
              print(f"\n{'=' * 66}\nWINDOW: {days} days   "
                    f"(fetch took {result['elapsed_seconds']}s)\n{'=' * 66}")
              print(f"TOTAL REPORTS: {result['total']}")

              # Failures, split by cause. A ward skipped because the budget ran
              # out is a bug in our timing; a ward that errored is a problem
              # with the feed or the URL. They are not the same and must never
              # be reported as one number again.
              skipped = [w for w, d in diag.items() if d["status"] == "skipped"]
              errored = [w for w, d in diag.items() if d["status"] == "error"]
              if skipped:
                  print(f"\n!! {len(skipped)} WARD(S) NEVER TRIED - BUDGET EXHAUSTED:")
                  for w in skipped:
                      print(f"   - {w}  (at {diag[w]['elapsed_at_skip']}s)")
                  print("   This is a timing bug, not a dead feed. Raise "
                        "OVERALL_DEADLINE_SECONDS.")
              if errored:
                  print(f"\n!! {len(errored)} WARD FEED(S) ERRORED:")
                  for w in errored:
                      print(f"   - {w}\n       {diag[w]['reason']}")
              if not skipped and not errored:
                  print(f"All {len(WARDS)} ward feeds returned data.")

              if result["truncated_wards"]:
                  print(f"\n!! {len(result['truncated_wards'])} FEED(S) LOOK TRUNCATED "
                        f"(full at {SUSPECTED_FEED_ITEM_CAP} items, oldest item still "
                        f"inside the window):")
                  for w in result["truncated_wards"]:
                      print(f"   - {w}  oldest={diag[w]['feed_oldest']}")
                  print("   Counts for these wards are a FLOOR, not a total. "
                        "A shorter window would be accurate; this one is not.")

              print("\nBY TOPIC:")
              if result["topics"]:
                  for key, count in result["topics"].most_common():
                      print(f"  {count:>5}  {TOPIC_LABELS[key]}")
              else:
                  print("  (none matched)")
              matched = sum(result["topics"].values())
              if result["total"]:
                  pct = 100 * matched / result["total"]
                  print(f"  {result['total'] - matched:>5}  unmatched "
                        f"({pct:.0f}% of reports fell into a topic)")

              print("\nBY WARD (in-window / items in feed / seconds):")
              for slug, data in sorted(result["wards"].items(),
                                       key=lambda kv: (-kv[1]["count"], kv[1]["label"])):
                  d = diag[slug]
                  print(f"  {data['count']:>4} / {d['items_in_feed']:>3} / "
                        f"{d['seconds']:>5}s   {data['label']}")

              samples = [s for d in diag.values() for s in d.get("unmatched_samples", [])]
              if samples:
                  print("\nUNMATCHED REPORT WORDING (for tuning TOPIC_RULES):")
                  for text in samples[:25]:
                      print(f"   - {text}")

              summary.append((days, result["total"], len(skipped), len(errored),
                              len(result["truncated_wards"])))

          print(f"\n{'=' * 66}\nSUMMARY\n{'=' * 66}")
          for days, total, n_skip, n_err, n_trunc in summary:
              flags = []
              if n_skip: flags.append(f"{n_skip} never tried")
              if n_err: flags.append(f"{n_err} errored")
              if n_trunc: flags.append(f"{n_trunc} truncated")
              tail = ("  [" + ", ".join(flags) + "]") if flags else "  [clean]"
              print(f"  {days:>3} days: {total} reports{tail}")
          print("\nOnly a run marked [clean] can be used to set thresholds.")
          PY

      - name: Confirm nothing was written
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::This job modified the working tree. It should not."
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean - measurement only, as intended."
