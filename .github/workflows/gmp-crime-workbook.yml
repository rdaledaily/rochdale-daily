name: Inspect official GMP neighbourhood crime data

on:
  push:
    branches: [main]
    paths:
      - 'scraper/probe_gmp_neighbourhood_crime.py'
      - '.github/workflows/gmp-crime-workbook.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'  # Weekly: retry official GMP data source without spamming failed-run email

permissions:
  contents: write

concurrency:
  group: gmp-crime-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download official GMP workbook and inspect geography
        run: python3 scraper/probe_gmp_neighbourhood_crime.py
      - name: Commit public workbook schema report for editorial review
        run: |
          git config user.name 'rochdale-daily-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/gmp-neighbourhood-workbook-schema.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official GMP crime dataset structure for safe local mapping'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
