name: Fix mobile events default

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-events.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make all upcoming events the default
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '<button class="event-filter active" type="button" data-event-filter="week">Next seven days</button>',
              '<button class="event-filter" type="button" data-event-filter="week">Next seven days</button>'
          )
          text = text.replace(
              '<button class="event-filter" type="button" data-event-filter="all">All upcoming</button>',
              '<button class="event-filter active" type="button" data-event-filter="all">All upcoming</button>'
          )

          patterns = [
              (r'((?:let|const|var)\s+[A-Za-z_$][\w$]*(?:event|Event)[A-Za-z_$\w]*(?:filter|Filter)[A-Za-z_$\w]*\s*=\s*)["\']week["\']', r'\1"all"'),
              (r'((?:let|const|var)\s+[A-Za-z_$][\w$]*(?:filter|Filter)[A-Za-z_$\w]*(?:event|Event)[A-Za-z_$\w]*\s*=\s*)["\']week["\']', r'\1"all"'),
              (r'(renderEvents\s*\([^)]*,\s*)["\']week["\'](\s*\))', r'\1"all"\2'),
              (r'(filterEvents\s*\(\s*)["\']week["\'](\s*\))', r'\1"all"\2')
          ]
          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)

          if text == original:
              raise SystemExit('No matching event defaults found; index.html was not changed')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all upcoming events by default on mobile"
          git push
