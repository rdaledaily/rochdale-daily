name: Fix mobile events default

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-events.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make all upcoming events the default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = {
              '<button class="event-filter active" type="button" data-event-filter="week">Next seven days</button>':
              '<button class="event-filter" type="button" data-event-filter="week">Next seven days</button>',
              '<button class="event-filter" type="button" data-event-filter="all">All upcoming</button>':
              '<button class="event-filter active" type="button" data-event-filter="all">All upcoming</button>',
              "let activeEventFilter = 'week';": "let activeEventFilter = 'all';",
              'let activeEventFilter = "week";': 'let activeEventFilter = "all";',
              "let currentEventFilter = 'week';": "let currentEventFilter = 'all';",
              'let currentEventFilter = "week";': 'let currentEventFilter = "all";'
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if text == original:
              raise SystemExit('No matching event defaults found in index.html')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all upcoming events by default on mobile"
          git push
