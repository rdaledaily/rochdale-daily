name: Rochdale Daily editorial integrity

on:
  push:
    branches: [main]
    paths:
      - "articles.json"
      - "scraper/story_integrity_audit.py"
      - ".github/workflows/story-integrity-audit.yml"
  workflow_run:
    workflows: ["Rochdale Daily fast local news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-story-integrity
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTPAGE_PRIMARY_DAYS: "2"
      FRONTPAGE_FALLBACK_DAYS: "4"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "45"
      FRONTPAGE_FRESH_HOURS: "36"
      CSS_SOURCE_PATH: assets/css/article-inline.css

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Audit every published story and publish corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rochdale Daily Editorial Integrity"
          git config user.email "bot@rochdaledaily.co.uk"

          for attempt in 1 2 3 4; do
            echo "Editorial integrity attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scraper/story_integrity_audit.py --articles articles.json --mode final

            # If the archive and its image files are already clean, do not make
            # a timestamp-only rebuild/commit. The report remains from the last
            # run that actually corrected reader-facing material.
            if [ -z "$(git status --porcelain -- articles.json assets/img/cards)" ]; then
              echo "All published stories already pass classification and image integrity."
              exit 0
            fi

            python -m json.tool articles.json > /dev/null
            python scraper/article_gate.py articles.json

            # Rebuild every reader-facing projection from the corrected archive.
            python scraper/repair_merged_bodies.py
            python scraper/generate_ward_pages.py
            python scraper/generate_newspaper_pages.py
            python scraper/enforce_frontpage_freshness.py
            python scraper/frontpage_source_quality.py
            PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
            python scraper/enforce_live_homepage_window.py
            python scraper/generate_news_sitemap.py
            python scraper/generate_archive.py
            cp archive.html search.html
            python scraper/update_homepage_static_latest.py
            python scraper/update_homepage_weekly_news.py
            python scraper/homepage_discovery_metadata.py
            python scraper/generate_rss.py
            python scraper/generate_image_sitemap.py

            git add -A
            git commit -m "Audit story classifications and image integrity"

            if git push origin HEAD:main; then
              echo "Editorial integrity corrections published."
              exit 0
            fi

            echo "Main moved during audit; rebuilding from the new head."
            sleep 4
          done

          echo "Could not publish integrity corrections after four race-safe attempts."
          exit 1
