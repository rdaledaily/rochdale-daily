name: Rochdale Daily image backfill

on:
  workflow_dispatch:
  push:
    paths:
      - trigger_image_regeneration_20260810.txt
  schedule:
    - cron: "50 * * * *"

permissions:
  contents: write

concurrency:
  group: rd-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      USE_SOURCE_IMAGES: "true"
      USE_WIKIMEDIA_COMMONS: "true"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      COMMIT_MESSAGE: "Backfill Rochdale Daily article images"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Mark generic category cards as replaceable
        run: |
          python - <<'PY'
          import json
          path='articles.json'
          with open(path,encoding='utf-8') as f: data=json.load(f)
          rows=data if isinstance(data,list) else data.get('articles',[])
          changed=0
          for a in rows:
              img=str(a.get('image_url') or a.get('img') or '')
              if img.startswith('assets/img/cards/'):
                  a['source_image_reuse_status']='category-fallback'
                  changed += 1
          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          print(f'Marked {changed} generic category-card image(s) for source/Commons replacement.')
          PY

      - name: Ensure every published story has an image
        timeout-minutes: 20
        run: |
          python scraper/ensure_article_images.py \
            --articles articles.json \
            --retry-placeholders

      - name: Validate public article feed
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json

      - name: Rebuild front-page and archive feeds with new images
        run: |
          python scraper/frontpage_pipeline.py
          python scraper/generate_archive.py

      - name: Generate static article pages and sitemap
        timeout-minutes: 5
        run: python scraper/generate_pages.py

      - name: Commit updated feed and rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No article changes to commit."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; sleep 3; }
          done
          exit 1
