name: Rochdale Daily cards-only image enforcement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'assets/img/cards/**'
      - 'scraper/ensure_article_images.py'
      - 'scraper/guarantee_article_images.py'
      - '.github/workflows/images.yml'
  schedule:
    - cron: "50 * * * *"

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Enforce cards-only article images')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Enforce cards-only policy on every published article
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Rebuild feeds
        run: python scraper/frontpage_pipeline.py

      - name: Re-enforce cards-only policy after feed/event generation
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Validate every published image path is in assets/img/cards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('articles.json').read_text(encoding='utf-8'))
          bad=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'), image))
          if bad:
              print('\n'.join(f'{slug}: {image}' for slug,image in bad[:50]))
              raise SystemExit(f'{len(bad)} published article image(s) violate cards-only policy')
          print(f'Validated {len(rows)} records: published article images are cards-only.')
          PY

      - name: Rebuild public pages and archives
        run: |
          python scraper/generate_archive.py
          python scraper/generate_ward_pages.py
          python scraper/generate_pages.py

      - name: Commit cards-only feed and rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json image_coverage_report.json assets/img/cards articles sitemap.xml wards/ index.html
          if git diff --cached --quiet; then
            echo "Cards-only image policy already satisfied."
            exit 0
          fi
          git commit -m "Enforce cards-only article images"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
