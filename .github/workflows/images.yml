name: Rochdale Daily cards-only image enforcement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'assets/img/cards/**'
      - 'council_roster.json'
      - 'council_votes.json'
      - 'scraper/ensure_article_images.py'
      - 'scraper/guarantee_article_images.py'
      - 'scraper/councillor_photos.py'
      - 'scraper/generate_ward_pages.py'
      - '.github/workflows/images.yml'
  schedule:
    - cron: "50 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Enforce cards-only article images')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Avoid racing an active newsroom publisher
        id: newsroom_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" --status in_progress --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Rochdale Daily fast local news" or .workflowName == "Rochdale Daily immediate scraper run")] | length')"
          queued="$(gh run list --repo "${GITHUB_REPOSITORY}" --status queued --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Rochdale Daily fast local news" or .workflowName == "Rochdale Daily immediate scraper run")] | length')"
          if [ "${active}" -gt 0 ] || [ "${queued}" -gt 0 ]; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Newsroom scrape/publish is active or queued; deferring cards-only image enforcement to avoid a generated-site write race."
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Python
        if: steps.newsroom_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        if: steps.newsroom_guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Normalize canonical manual article image references
        if: steps.newsroom_guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Manual articles are authoritative and frontpage_pipeline deliberately
          # reloads them on every rebuild. If their source JSON still points at a
          # retired assets/article-images path or a remote URL, a later page build
          # can undo a repaired articles.json. Repair the canonical editor source
          # itself so every downstream rebuild inherits the cards-only invariant.
          python scraper/ensure_article_images.py --articles manual_articles.json --report /tmp/manual-image-report.json
          if [ -d manual_articles.d ]; then
            while IFS= read -r -d '' file; do
              python scraper/ensure_article_images.py --articles "$file" --report /tmp/manual-shard-image-report.json
            done < <(find manual_articles.d -type f -name '*.json' -print0)
          fi

      - name: Enforce cards-only policy on every published article
        if: steps.newsroom_guard.outputs.run == 'true'
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Rebuild feeds
        if: steps.newsroom_guard.outputs.run == 'true'
        run: python scraper/frontpage_pipeline.py

      - name: Re-enforce cards-only policy after feed/event generation
        if: steps.newsroom_guard.outputs.run == 'true'
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Validate every published image path is in assets/img/cards
        if: steps.newsroom_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('articles.json').read_text(encoding='utf-8'))
          bad=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'), image))
          if bad:
              print('\n'.join(f'{slug}: {image}' for slug,image in bad[:50]))
              raise SystemExit(f'{len(bad)} published article image(s) violate cards-only policy')
          print(f'Validated {len(rows)} records: published article images are cards-only.')
          PY

      - name: Build councillor portrait index from local cards
        if: steps.newsroom_guard.outputs.run == 'true'
        run: python scraper/councillor_photos.py

      - name: Rebuild public pages, ward democracy sections and archives
        if: steps.newsroom_guard.outputs.run == 'true'
        run: |
          python scraper/generate_archive.py
          python scraper/generate_ward_pages.py
          python scraper/generate_pages.py

      - name: Commit cards-only feed and rendered site
        if: steps.newsroom_guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          normalize_manual_sources() {
            python scraper/ensure_article_images.py --articles manual_articles.json --report /tmp/manual-image-report.json
            if [ -d manual_articles.d ]; then
              while IFS= read -r -d '' file; do
                python scraper/ensure_article_images.py --articles "$file" --report /tmp/manual-shard-image-report.json
              done < <(find manual_articles.d -type f -name '*.json' -print0)
            fi
          }

          rebuild_latest() {
            normalize_manual_sources
            python scraper/ensure_article_images.py --articles articles.json
            python scraper/frontpage_pipeline.py
            python scraper/ensure_article_images.py --articles articles.json
            python scraper/councillor_photos.py
            python scraper/generate_archive.py
            python scraper/generate_ward_pages.py
            python scraper/generate_pages.py
            python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('articles.json').read_text(encoding='utf-8'))
          bad=[]
          missing=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'), image))
              elif not Path(image).is_file():
                  missing.append((a.get('slug'), image))
          if bad or missing:
              raise SystemExit(f'Image integrity failed: {len(bad)} non-card path(s), {len(missing)} missing card file(s)')
          print(f'Validated {len(rows)} records after race-safe rebuild.')
          PY
          }

          # generate_pages runs frontpage_pipeline internally. Validate again here
          # so the committed snapshot can never silently regress after the earlier
          # cards-only check.
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('articles.json').read_text(encoding='utf-8'))
          bad=[]
          missing=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'), image))
              elif not Path(image).is_file():
                  missing.append((a.get('slug'), image))
          if bad or missing:
              raise SystemExit(f'Post-page-build image integrity failed: {len(bad)} non-card path(s), {len(missing)} missing card file(s)')
          print('Post-page-build cards-only validation passed.')
          PY

          # This is a clean ephemeral runner and every change below is produced by
          # the deterministic image/feed/page rebuild above. Stage the complete
          # generated state so Git never refuses publication because a derived
          # file was accidentally omitted from a hand-maintained path list.
          git add -A
          if git diff --cached --quiet; then
            echo "Cards-only image policy and councillor portraits already satisfied."
            exit 0
          fi
          git commit -m "Enforce cards-only article images and councillor portraits"
          if git push origin HEAD:main; then exit 0; fi

          # Never rebase one generated newspaper snapshot onto another. If main
          # moved outside the shared writer lock, discard this derived snapshot,
          # rebuild deterministically from the newest canonical main, validate it
          # again, and publish that coherent state.
          for attempt in 1 2 3; do
            echo "main moved during image enforcement; rebuilding latest state (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rebuild_latest
            git add -A
            if git diff --cached --quiet; then
              echo "Latest main already satisfies image integrity."
              exit 0
            fi
            git commit -m "Enforce cards-only article images and councillor portraits (race-safe rebuild)"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
