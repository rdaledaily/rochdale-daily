name: Publish manual article edits

on:
  push:
    paths:
      - manual_articles.json
      - 'manual_articles.d/**'
      - scraper/manual_articles.py
      - scraper/frontpage_pipeline.py
      - scraper/story_identity.py
      - scraper/generate_pages.py
      - scraper/generate_newspaper_pages.py
      - scraper/generate_news_sitemap.py
      - scraper/generate_archive.py
      - scraper/update_homepage_static_latest.py
      - scraper/generate_rss.py
      - scraper/ensure_article_images.py
      - scraper/repair_generated_article_images.py
      - scraper/repair_generated_with_commons.py
      - scraper/enforce_frontpage_freshness.py
      - scraper/enforce_live_homepage_window.py
      - assets/css/site.css
      - assets/css/article-inline.css
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-manual-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_WIKIMEDIA_COMMONS: "true"
      USE_SOURCE_IMAGES: "false"
      CSS_SOURCE_PATH: assets/css/article-inline.css
      FRONTPAGE_FRESH_HOURS: "14"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Rebuild canonical manual newsroom state
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          python scraper/frontpage_pipeline.py
          # Prefer a relevant cached/local/Commons photograph. Generate a card
          # only as the final fallback, never as the editorial objective.
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
          python scraper/ensure_article_images.py --articles articles.json
          python scraper/article_gate.py articles.json
          python scraper/generate_newspaper_pages.py
          python scraper/enforce_frontpage_freshness.py
          python scraper/enforce_live_homepage_window.py
          python scraper/generate_news_sitemap.py
          python scraper/generate_archive.py
          cp archive.html search.html
          python scraper/update_homepage_static_latest.py
          python scraper/generate_rss.py
      - name: Commit rebuilt site without generated-file rebases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_publish() {
            git add articles.json manual_articles.json manual_articles.d scraper_status.json event_dates.json \
              articles sitemap.xml news-sitemap.xml assets/img/cards image_coverage_report.json \
              image_repair_report.json commons_image_repair_report.json archive.html search.html \
              archive-index.json articles/frontpage.json index.html rss.xml 2>/dev/null || true
          }

          rebuild_from_current_main() {
            python -m json.tool articles.json > /dev/null
            python -m json.tool manual_articles.json > /dev/null
            python scraper/frontpage_pipeline.py
            python scraper/repair_generated_article_images.py --articles articles.json
            python scraper/repair_generated_with_commons.py --articles articles.json
            python scraper/ensure_article_images.py --articles articles.json
            python scraper/article_gate.py articles.json
            python scraper/generate_newspaper_pages.py
            python scraper/enforce_frontpage_freshness.py
            python scraper/enforce_live_homepage_window.py
            python scraper/generate_news_sitemap.py
            python scraper/generate_archive.py
            cp archive.html search.html
            python scraper/update_homepage_static_latest.py
            python scraper/generate_rss.py
          }

          stage_publish
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -m "Publish manual article edits"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi

          for attempt in 1 2 3; do
            echo "main moved during manual rebuild; regenerating from latest main (${attempt}/3)."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            git clean -fd
            rebuild_from_current_main
            stage_publish
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish manual article edits (race-safe rebuild)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
      - name: Deploy manual newsroom state immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
