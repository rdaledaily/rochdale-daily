name: Publish manual article edits

# Rebuilds the site whenever either article source changes so editorial updates
# go live without waiting for a scheduled scrape.
on:
  push:
    paths:
      - articles.json
      - manual_articles.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rochdale-daily-15-minute-scraper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Rebuild pages and sitemap
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json manual_articles.json scraper_status.json event_dates.json articles sitemap.xml
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -m "Publish manual article edits"
          git push
