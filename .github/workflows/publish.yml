name: Publish manual article edits

# Rebuilds the site whenever either article source changes so editorial updates
go live without waiting for a scheduled scrape.
on:
  push:
    paths:
      - articles.json
      - manual_articles.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rochdale-daily-15-minute-scraper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Rebuild pages and sitemap
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json manual_articles.json scraper_status.json event_dates.json articles sitemap.xml
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -m "Publish manual article edits"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git merge --no-edit "origin/${GITHUB_REF_NAME}"; then
              if git ls-files -u -- articles.json | grep -q .; then
                git show ":2:articles.json" > /tmp/editorial_articles.json
                git show ":3:articles.json" > /tmp/scraper_articles.json
                python scraper/merge_feeds.py /tmp/editorial_articles.json /tmp/scraper_articles.json articles.json
                git add articles.json
              fi
              conflicted=$(git diff --name-only --diff-filter=U)
              if [ -n "${conflicted}" ]; then
                echo "${conflicted}" | while read -r file; do
                  git checkout --ours -- "${file}" 2>/dev/null || git rm -q -- "${file}"
                  git add -- "${file}" 2>/dev/null || true
                done
              fi
              git commit --no-edit
            fi
          done
          exit 1
