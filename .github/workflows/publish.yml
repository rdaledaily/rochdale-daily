name: Publish canonical Rochdale Daily site

on:
  push:
    branches: [main]
    paths:
      - manual_articles.json
      - 'manual_articles.d/**'
      - council_documents.json
      - council_votes.json
      - council_roster.json
      - councillor_photos.json
      - ward_areas.json
      - scraper/manual_articles.py
      - scraper/frontpage_pipeline.py
      - scraper/frontpage_manual_publish.py
      - scraper/ensure_manual_frontpage.py
      - scraper/verify_manual_publication.py
      - scraper/story_identity.py
      - scraper/frontpage_source_quality.py
      - scraper/generate_pages.py
      - scraper/generate_newspaper_pages.py
      - scraper/generate_ward_pages.py
      - scraper/generate_news_sitemap.py
      - scraper/generate_archive.py
      - scraper/update_homepage_static_latest.py
      - scraper/update_homepage_weekly_news.py
      - scraper/sync_homepage_top_story.py
      - scraper/homepage_discovery_metadata.py
      - scraper/generate_rss.py
      - scraper/generate_image_sitemap.py
      - scraper/ensure_article_images.py
      - scraper/enforce_cards_only_images.py
      - scraper/enforce_frontpage_freshness.py
      - scraper/enforce_live_homepage_window.py
      - assets/css/site.css
      - assets/css/article-inline.css
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Editor/manual publication has its own short writer lane. It deliberately does
# not wait behind a long-running scrape: the publish step starts from latest main
# and already has bounded race-safe rebuild logic if main moves while it renders.
# This prevents a stalled scraper from holding editor-written stories off the site.
concurrency:
  group: rd-manual-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CSS_SOURCE_PATH: assets/css/article-inline.css
      FRONTPAGE_FRESH_HOURS: "36"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "45"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Rebuild canonical site from source data
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          # Manual publication keeps the canonical merge/frontpage logic but
          # skips external event refreshes and archive-wide image rescans.
          python scraper/frontpage_manual_publish.py
          python scraper/article_gate.py articles.json
          python scraper/councillor_photos.py
          python scraper/patch_democracy_portraits.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/enforce_frontpage_freshness.py
          python scraper/frontpage_source_quality.py
          PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
          python scraper/enforce_live_homepage_window.py
          python scraper/ensure_manual_frontpage.py
          python scraper/generate_news_sitemap.py
          python scraper/generate_archive.py
          cp archive.html search.html
          python scraper/update_homepage_static_latest.py
          python scraper/update_homepage_weekly_news.py
          python scraper/sync_homepage_top_story.py
          python scraper/homepage_discovery_metadata.py
          python scraper/generate_rss.py
          python scraper/generate_image_sitemap.py
          python scraper/content_hygiene.py --fix
          python scraper/content_hygiene.py
          python scraper/enforce_cards_only_images.py --articles articles.json --check
          python scraper/verify_manual_publication.py
      - name: Commit rebuilt canonical site
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_publish() {
            git add articles.json manual_articles.json manual_articles.d scraper_status.json event_dates.json \
              articles sitemap.xml news-sitemap.xml image-sitemap.xml assets/img/cards archive.html search.html archive-index.json \
              articles/frontpage.json index.html rss.xml wards/ councillor_photos.json 2>/dev/null || true
          }

          rebuild_from_current_main() {
            python -m json.tool articles.json > /dev/null
            python -m json.tool manual_articles.json > /dev/null
            python scraper/frontpage_manual_publish.py
            python scraper/article_gate.py articles.json
            python scraper/councillor_photos.py
            python scraper/patch_democracy_portraits.py
            python scraper/generate_ward_pages.py
            python scraper/generate_newspaper_pages.py
            python scraper/enforce_frontpage_freshness.py
            python scraper/frontpage_source_quality.py
            PYTHONPATH=scraper python scraper/test_frontpage_source_quality.py
            python scraper/enforce_live_homepage_window.py
            python scraper/ensure_manual_frontpage.py
            python scraper/generate_news_sitemap.py
            python scraper/generate_archive.py
            cp archive.html search.html
            python scraper/update_homepage_static_latest.py
            python scraper/update_homepage_weekly_news.py
            python scraper/sync_homepage_top_story.py
            python scraper/homepage_discovery_metadata.py
            python scraper/generate_rss.py
            python scraper/generate_image_sitemap.py
            python scraper/content_hygiene.py --fix
            python scraper/content_hygiene.py
            python scraper/enforce_cards_only_images.py --articles articles.json --check
            python scraper/verify_manual_publication.py
          }

          stage_publish
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish canonical Rochdale Daily site"
          if timeout --signal=TERM 90s git push origin HEAD:main; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Another writer can move main while this short editor build is
          # running. Rebuild from the newest head rather than force-pushing.
          for attempt in 1 2; do
            echo "main moved during canonical rebuild; regenerating from latest main (${attempt}/2)."
            timeout --signal=TERM 60s git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rebuild_from_current_main
            stage_publish
            if git diff --cached --quiet; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Publish canonical Rochdale Daily site (race-safe rebuild)"
            if timeout --signal=TERM 90s git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Deploy canonical site immediately
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
