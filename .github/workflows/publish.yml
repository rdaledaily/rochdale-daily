name: Publish manual article edits

# Rebuilds the site whenever an article source changes so editorial updates
# go live without waiting for a scheduled scrape.
on:
  push:
    paths:
      - articles.json
      - manual_articles.json
      - 'manual_articles.d/**'
  workflow_dispatch:

permissions:
  contents: write

# Manual editorial publishing has its own queue so an urgent article cannot be
# displaced by an unrelated archive/scraper writer waiting on the shared queue.
concurrency:
  group: rd-manual-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Rebuild pages and sitemap
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_newspaper_pages.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json manual_articles.json manual_articles.d scraper_status.json event_dates.json articles sitemap.xml
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -m "Publish manual article edits"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; sleep 3; }
          done
          exit 1
