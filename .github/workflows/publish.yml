name: Publish manual article edits

# Rebuilds the site whenever an article source or the publishing/rendering logic
# changes so editorial and SEO updates go live without waiting for a scrape.
on:
  push:
    paths:
      - articles.json
      - manual_articles.json
      - 'manual_articles.d/**'
      - scraper/manual_articles.py
      - scraper/frontpage_pipeline.py
      - scraper/story_identity.py
      - scraper/generate_pages.py
      - scraper/generate_newspaper_pages.py
      - scraper/generate_news_sitemap.py
      - scraper/ensure_article_images.py
      - scraper/repair_generated_with_commons.py
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

# Every workflow that can rewrite the public newspaper snapshot shares one lock.
# Manual publishing remains urgent, but must never modify main underneath a scrape.
concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_WIKIMEDIA_COMMONS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Rebuild feed, normalise images, dedupe and pages
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool manual_articles.json > /dev/null
          python scraper/frontpage_pipeline.py
          python scraper/ensure_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
          python scraper/article_gate.py articles.json
          python scraper/generate_newspaper_pages.py
          python scraper/generate_news_sitemap.py
      - name: Commit rebuilt site without generated-file rebases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_publish() {
            git add articles.json manual_articles.json manual_articles.d scraper_status.json event_dates.json \
              articles sitemap.xml news-sitemap.xml assets/img/cards image_coverage_report.json commons_image_repair_report.json
          }

          stage_publish
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -m "Publish manual article edits"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi

          # The editorial source push that triggered this workflow is already on
          # main. If main moves again, discard only this derived snapshot, start
          # from the newest canonical sources, and deterministically rebuild it.
          for attempt in 1 2 3; do
            echo "main moved during manual rebuild; regenerating from latest main (${attempt}/3)."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            git clean -fd
            python -m json.tool articles.json > /dev/null
            python -m json.tool manual_articles.json > /dev/null
            python scraper/frontpage_pipeline.py
            python scraper/ensure_article_images.py --articles articles.json
            python scraper/repair_generated_with_commons.py --articles articles.json
            python scraper/article_gate.py articles.json
            python scraper/generate_newspaper_pages.py
            python scraper/generate_news_sitemap.py
            stage_publish
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish manual article edits (race-safe rebuild)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
