name: Enrich article images

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-image-maintenance
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir 'Pillow>=10,<13'
      - name: Enrich images then enforce canonical cards cache
        env:
          USE_WIKIMEDIA_COMMONS: 'true'
          USE_SOURCE_IMAGES: 'true'
        run: |
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
          python scraper/ensure_article_images.py --articles articles.json
          python scraper/enforce_cards_only_images.py --articles articles.json
      - name: Validate feed and cards-only invariant
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/enforce_cards_only_images.py --articles articles.json --check
      - name: Commit canonical image data only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.json assets/img/cards image_repair_report.json commons_image_repair_report.json image_coverage_report.json cards_image_policy_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'No image enrichment changes.'
            exit 0
          fi
          git commit -m 'Enrich article images within cards-only policy'
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Re-render through canonical publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
