name: Enrich article images

on:
  workflow_dispatch:
  schedule:
    - cron: '25,55 * * * *'
  push:
    branches: [main]
    paths:
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'articles.json'
      - 'assets/img/cards/**'
      - 'scraper/repair_generated_article_images.py'
      - 'scraper/repair_generated_with_commons.py'
      - '.github/workflows/article-image-integrity.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: rd-image-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Avoid racing newsroom publication
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" --status in_progress --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Rochdale Daily fast local news" or .workflowName == "Rochdale Daily immediate scraper run" or .workflowName == "Publish manual article edits")] | length')"
          queued="$(gh run list --repo "${GITHUB_REPOSITORY}" --status queued --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Rochdale Daily fast local news" or .workflowName == "Rochdale Daily immediate scraper run" or .workflowName == "Publish manual article edits")] | length')"
          if [ "$active" -gt 0 ] || [ "$queued" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Newsroom publishing is active; image enrichment will use a later run.'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir 'Pillow>=10,<13'

      - name: Enrich placeholders with relevant photography
        if: steps.guard.outputs.run == 'true'
        env:
          USE_WIKIMEDIA_COMMONS: 'true'
          USE_SOURCE_IMAGES: 'false'
        run: |
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json

      - name: Validate feed
        if: steps.guard.outputs.run == 'true'
        run: python -m json.tool articles.json > /dev/null

      - name: Commit image metadata and cached assets only
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.json assets/img/cards image_repair_report.json commons_image_repair_report.json image_coverage_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No image enrichment changes.'
            exit 0
          fi
          git commit -m 'Enrich article images without rebuilding newsroom state'
          git push origin HEAD:main
