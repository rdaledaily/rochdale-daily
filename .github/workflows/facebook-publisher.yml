name: Post Rochdale Daily Facebook news roundups

# Scheduled Page posting runs in GitHub Actions so the repository's saved
# secrets can be used without exposing them locally.
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Self-dispatch depth (leave at 0 for manual starts)"
        required: false
        default: "0"
  schedule:
    # Hourly recovery seed. A 10-minute continuation chain checks for the four
    # UK-local roundup windows, but publishes at most once per window.
    - cron: "27 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/facebook-publisher.yml"

permissions:
  contents: write
  actions: write

# Official Page publishing only: no likes, comments, follows, messages or
# human-behaviour simulation. Newer runs supersede stale queued checks.
concurrency:
  group: facebook-page-publisher
  cancel-in-progress: false

jobs:
  publish-one:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[facebook-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record publisher cycle start
        run: date +%s > "$RUNNER_TEMP/facebook_cycle_start"

      - name: Check out current newspaper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load Facebook posting history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin facebook-state
          if git show origin/facebook-state:facebook/facebook_posted.json > /tmp/facebook_posted.json 2>/dev/null; then
            echo "Loaded existing Facebook posting history."
          else
            printf '{\n  "posted": {}\n}\n' > /tmp/facebook_posted.json
          fi

      - name: Publish a grouped news roundup when a local posting window opens
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          # Page Graph API ID is resolved from the authenticated Page token.
          FACEBOOK_GRAPH_VERSION: v26.0
          FACEBOOK_STATE_PATH: /tmp/facebook_posted.json
          FACEBOOK_RESULT_PATH: /tmp/facebook_last_result.json
          FACEBOOK_MAX_ARTICLE_AGE_HOURS: "48"
          FACEBOOK_MIN_POST_INTERVAL_MINUTES: "120"
          # Daily four-window cap is enforced in the Python publisher.
          FACEBOOK_MAX_POSTS_24H: "0"
          FACEBOOK_MIN_ARTICLES_PER_ROUNDUP: "2"
          FACEBOOK_MAX_ARTICLES_PER_ROUNDUP: "5"
        run: python scraper/post_facebook_article.py

      - name: Save successful Facebook post to state branch
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/facebook_last_result.json')
          print(json.loads(p.read_text()).get('status', '') if p.exists() else '')
          PY
          )"

          if [ "$status" != "posted" ]; then
            echo "Nothing was posted; state branch does not need updating."
            exit 0
          fi

          rm -rf /tmp/facebook-state-worktree
          git worktree add --detach /tmp/facebook-state-worktree origin/facebook-state
          mkdir -p /tmp/facebook-state-worktree/facebook
          cp /tmp/facebook_posted.json /tmp/facebook-state-worktree/facebook/facebook_posted.json
          cp /tmp/facebook_last_result.json /tmp/facebook-state-worktree/facebook/facebook_last_result.json

          cd /tmp/facebook-state-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facebook/facebook_posted.json facebook/facebook_last_result.json
          if git diff --cached --quiet; then
            echo "Facebook state already current."
            exit 0
          fi
          git commit -m "Record Facebook article post"
          git push origin HEAD:facebook-state

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/facebook_last_result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/facebook_last_result.json').read_text())
          print('Facebook publisher status:', d.get('status'))
          if d.get('reason'):
              print('Reason:', d.get('reason'))
          if d.get('slot'):
              print('Roundup window:', d.get('slot'))
          if d.get('article_count'):
              print('Stories grouped:', d.get('article_count'))
          for title in d.get('titles') or []:
              print('Story:', title)
          if d.get('url'):
              print('Roundup destination:', d.get('url'))
          if d.get('facebook_post_id'):
              print('Facebook post ID:', d.get('facebook_post_id'))
          if 'remaining_unposted' in d:
              print('Remaining queue:', d.get('remaining_unposted'))
          PY
          fi
  
      # GitHub's cron scheduler can delay or silently omit scheduled checks.
      # Keep a 10-minute recovery chain, but never publish outside the four
      # daily UK-time windows. This is checking frequency, not posting frequency.
      # The existing state branch, cooldown and queue filter prevent duplicates
      # when cron and a self-dispatched run overlap.
      - name: Schedule the next Facebook check
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ github.event.inputs.chain || '0' }}
          RUN_ID: ${{ github.run_id }}
          MIN_CYCLE_SECONDS: "600"
        run: |
          set -euo pipefail
          depth="${CHAIN_DEPTH:-0}"
          case "$depth" in ''|*[!0-9]*) depth=0 ;; esac
          if [ "$depth" -ge 10000 ]; then
            echo "Self-dispatch depth cap reached; the cron recovery seed will restart the publisher."
            exit 0
          fi

          started="$(cat "$RUNNER_TEMP/facebook_cycle_start" 2>/dev/null || date +%s)"
          now="$(date +%s)"
          elapsed=$(( now - started ))
          if [ "$elapsed" -lt "$MIN_CYCLE_SECONDS" ]; then
            echo "Waiting $(( MIN_CYCLE_SECONDS - elapsed )) seconds until next 10-minute check."
            sleep "$(( MIN_CYCLE_SECONDS - elapsed ))"
          fi

          # Do not queue unnecessary successors if cron/manual dispatch already
          # queued one. One publisher at a time also serialises state writes.
          active="$(gh run list --workflow facebook-publisher.yml --limit 30 \
            --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\") | select(.databaseId != $RUN_ID)] | length" \
            || echo 0)"
          if [ "${active:-0}" -gt 0 ]; then
            echo "Another Facebook publisher is pending or running; yielding this chain."
            exit 0
          fi

          gh workflow run facebook-publisher.yml --ref main -f chain="$((depth + 1))"
          echo "Dispatched next Facebook check."

