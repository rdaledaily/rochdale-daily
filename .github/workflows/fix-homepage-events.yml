name: Repair homepage event filters

on:
  workflow_dispatch:
  push:
    paths:
      - scraper/fix_homepage_event_filters.py

permissions:
  contents: write

concurrency:
  group: repair-homepage-event-filters
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply date-window repair
        run: python scraper/fix_homepage_event_filters.py
      - name: Commit corrected homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Homepage already fixed."; exit 0; fi
          git commit -m "Fix homepage event date filters"
          git push
