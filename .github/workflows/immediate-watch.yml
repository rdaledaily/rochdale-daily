name: Immediate-news monitor

# Watches the Rochdale Times, Roch Valley Radio and the MEN every two minutes
# for immediate news (missing people, power and water cuts, school closures,
# traffic incidents, public warnings, live incidents) and starts the fast lane
# the moment one appears that Rochdale Daily has not covered (editor,
# 17 Nov 2026). It writes nothing to the site and commits nothing: every
# commit to main is a Cloudflare deployment. State lives in the Actions cache;
# the measurements are in each run's summary and artifact.
#
# Like the fast lane it chains itself: each run polls for ~20 minutes and then
# starts its successor, because GitHub drops scheduled ticks under load. The
# 20-minute cron only re-seeds the chain if it ever dies.

on:
  workflow_dispatch:
  # A change to the monitor starts it at once, so new code is live without
  # waiting for the cron (which GitHub can take an hour to register).
  push:
    branches: [main]
    paths:
      - .github/workflows/immediate-watch.yml
      - scraper/immediate_watch.py
      - scraper/immediate_news.py
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: rd-immediate-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scraper
            requirements.txt
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --no-cache-dir feedparser requests python-dateutil

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .immediate-watch
          key: immediate-watch-${{ github.run_id }}
          restore-keys: immediate-watch-

      - name: Poll the three outlets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scraper
        run: python scraper/immediate_watch.py --minutes 20 --interval 120

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .immediate-watch
          key: immediate-watch-${{ github.run_id }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immediate-watch-report
          path: reports/immediate_watch.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Start the next watch
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scraper/gh_dispatch.sh immediate-watch.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::Could not start the next watch; the 20-minute cron re-seeds it."
