name: Rochdale Daily main scrape

# The main pipeline run, without a browser. Paired with scrape-events.yml so
# that exactly one full pipeline runs per half hour and the two never overlap:
# events at :05, main at :35. The previous design scheduled a 20-minute
# pipeline every 15 minutes, so runs queued behind each other, GitHub dropped
# the surplus, and the feed saw 6-20 productive runs a day instead of 96.
# Cadence sets how quickly a story reaches the page; it does not create
# stories. Daily volume is bounded by supply and MAX_AI_ARTICLES_PER_RUN.

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: rd-scrape-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The pipeline is measured at roughly 20 minutes. This ceiling leaves it
    # real headroom while still finishing well before the next scheduled run
    # 30 minutes later, so the queue can never build and no slot is dropped.
    timeout-minutes: 28

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      FACEBOOK_EVENTS_DISCOVERY_URL: "https://www.facebook.com/events/?date_filter_option=ANY_DATE&discover_tab=CUSTOM&location_id=108023932551149"
      FACEBOOK_EVENTS_MAX: "18"
      FACEBOOK_EVENT_IMAGE_REUSE: "false"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "false"
      MAX_NEWS_AGE_HOURS: "168"
      ARTICLE_RETENTION_DAYS: "14"
      SAME_DAY_ONLY: "false"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "3"
      FRONTPAGE_MIN_ARTICLES: "50"
      FRONTPAGE_TARGET_ARTICLES: "80"
      MAX_PUBLISHED_ARTICLES: "900"
      MAX_AI_ARTICLES_PER_RUN: "50"
      MAX_AI_ARTICLES_INITIAL: "100"
      RESPECT_ROBOTS: "true"
      REQUEST_TIMEOUT: "10"
      # Two strikes, not three, and remembered across runs in
      # slow_domains.json so a dead host costs one attempt a day
      # rather than three every hour.
      SLOW_DOMAIN_FAILURE_THRESHOLD: "2"
      SLOW_DOMAIN_BENCH_HOURS: "24"
      USE_SOURCE_IMAGES: "true"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      DISCOVERY_LINKS_PER_SOURCE: "40"
      RSS_ITEMS_PER_SOURCE: "100"
      GOOGLE_SEARCH_QUERY_LIMIT: "128"
      DISCOVERY_PAGE_LIMIT: "3"
      DISCOVERY_WORKERS: "12"
      DISCOVERY_LINK_WORKERS: "12"
      AI_WORKERS: "6"
      MIN_BALANCED_SELECTION_LIMIT: "40"
      MAX_SELECTED_PER_SOURCE: "12"
      MAX_SELECTED_PER_CATEGORY: "20"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      MIN_LIVE_STORIES: "40"
      # Chromium is installed in this workflow so the Google News resolver can
      # turn wrapper URLs into real articles (recovering text and per-ward /
      # per-category coverage). Facebook event discovery is still left to
      # scrape-events.yml — only the lighter news resolver runs here.
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      # Bound the per-run browser work so resolution can never eat the whole
      # 15-minute cadence. The resolver caches successes for 45 days, so a
      # backlog is cleared across several runs rather than in one long run.
      GOOGLE_NEWS_BROWSER_RESOLUTION: "true"
      # Count cap set high; the real limiter is the time budget below. This lets
      # resolution drain the wrapper backlog (often 200+) as fast as a safe time
      # window allows, rather than being throttled to a tiny fixed count while
      # most discovered stories go unopened. 8 minutes leaves ample room under
      # the 24-minute pipeline step.
      GOOGLE_NEWS_RESOLVE_MAX: "200"
      GOOGLE_NEWS_RESOLVE_BUDGET_SECONDS: "480"
      COMMIT_MESSAGE: "Update Rochdale Daily news feed (main)"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Restore cached Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium operating-system dependencies
        timeout-minutes: 10
        run: python -m playwright install-deps chromium

      - name: Install Chromium browser
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        run: python -m playwright install chromium

      - name: Repair contaminated event records
        run: python scraper/repair_event_records.py

      - name: Run Rochdale Daily pipeline
        timeout-minutes: 24
        run: python scraper/scraper.py

      - name: Ensure consistent story cards
        timeout-minutes: 6
        # Rebuilds a composed area/category card for every story that has no
        # real photograph, replacing the old static stock_*.jpg fallbacks so all
        # cardless stories share one design. Card rendering is local and cheap;
        # --limit bounds only the source-image network hunts so this cannot eat
        # the run's time budget. Runs before page generation so the fresh cards
        # are baked into the HTML and committed in the same run.
        run: python scraper/ensure_article_images.py --limit 40

      - name: Validate public article feed
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json

      - name: Generate static article pages and sitemap
        timeout-minutes: 4
        run: python scraper/generate_pages.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            articles.json \
            slow_domains.json \
            scraper_status.json \
            event_dates.json \
            google_news_resolution_report.json \
            google_news_resolutions.json \
            image_coverage_report.json \
            assets/img/generated \
            assets/article-images \
            articles \
            sitemap.xml \
            index.html

          if git diff --cached --quiet; then
            echo "No article changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); merging origin/${GITHUB_REF_NAME}."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git merge --no-edit "origin/${GITHUB_REF_NAME}"; then
              if git ls-files -u -- articles.json | grep -q .; then
                git show ":3:articles.json" > /tmp/remote_articles.json
                git show ":2:articles.json" > /tmp/local_articles.json
                python scraper/merge_feeds.py \
                  /tmp/remote_articles.json \
                  /tmp/local_articles.json \
                  articles.json
                git add articles.json
              fi

              conflicted=$(git diff --name-only --diff-filter=U)
              if [ -n "${conflicted}" ]; then
                echo "${conflicted}" | while read -r file; do
                  git checkout --ours -- "${file}" 2>/dev/null || git rm -q -- "${file}"
                  git add -- "${file}" 2>/dev/null || true
                done
              fi
              git commit --no-edit
            fi
          done

          echo "Failed to push after 5 attempts."
          exit 1
