name: Complete editorial image update

on:
  push:
    paths:
      - '.github/workflows/complete-editorial-image.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image and update article source
        run: |
          mkdir -p assets/img/articles
          curl -L --fail --retry 3 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rochdale_Police_Station_%282%29.JPG' \
            -o assets/img/articles/rochdale-police-station-justice-editorial.jpg

          python - <<'PY'
          import json
          from pathlib import Path

          slug = 'editorial-justice-remains-unfinished-rochdale'
          local_image = 'assets/img/articles/rochdale-police-station-justice-editorial.jpg'
          credit = 'Rept0n1x / Wikimedia Commons'
          credit_url = 'https://commons.wikimedia.org/wiki/File:Rochdale_Police_Station_%282%29.JPG'

          source = Path('manual_articles.json')
          data = json.loads(source.read_text(encoding='utf-8'))
          found = False
          for article in data:
              if article.get('slug') == slug:
                  article['image_url'] = local_image
                  article['image_credit'] = credit
                  article['image_credit_url'] = credit_url
                  found = True
                  break
          if not found:
              raise SystemExit('Target article not found in manual_articles.json')
          source.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate published pages and feeds
        run: |
          python scraper/frontpage_pipeline.py

      - name: Verify generated article uses local image
        run: |
          grep -q 'assets/img/articles/rochdale-police-station-justice-editorial.jpg' \
            articles/editorial-justice-remains-unfinished-rochdale.html

      - name: Commit completed image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_articles.json assets/img/articles/rochdale-police-station-justice-editorial.jpg articles index.html sitemap.xml image_coverage_report.json 2>/dev/null || true
          git rm .github/workflows/complete-editorial-image.yml
          git commit -m "Publish Rochdale Police Station image on justice editorial"
          git push
