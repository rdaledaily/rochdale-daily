name: Fix sensory walks photograph

on:
  push:
    paths:
      - '.github/workflows/fix-sensory-walks-photo.yml'

permissions:
  contents: write

jobs:
  fix-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download licensed Queen's Park photograph
        run: |
          mkdir -p assets/article-images
          curl --fail --location --retry 3 \
            "https://upload.wikimedia.org/wikipedia/commons/9/92/Queen%27s_Park%2C_Heywood_-_geograph.org.uk_-_6546462.jpg" \
            --output "assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg"

      - name: Update image metadata and article page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          slug = "sensory-walks-celebrate-love-parks-week-at-queens-park"
          image_path = "assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg"
          credit = "David Dixon / Wikimedia Commons (CC BY-SA 2.0)"
          credit_url = "https://commons.wikimedia.org/wiki/File:Queen%27s_Park,_Heywood_-_geograph.org.uk_-_6546462.jpg"

          def update_node(node):
              changed = False
              if isinstance(node, dict):
                  if node.get("slug") == slug:
                      node["image_url"] = image_path
                      node["image_credit"] = credit
                      node["image_credit_url"] = credit_url
                      node["source_image_candidate_url"] = credit_url
                      node["source_image_reuse_status"] = "wikimedia-commons-licensed"
                      node["image_status"] = "verified-photograph"
                      node["image_placeholder_reason"] = ""
                      changed = True
                  for value in node.values():
                      changed = update_node(value) or changed
              elif isinstance(node, list):
                  for value in node:
                      changed = update_node(value) or changed
              return changed

          for path in Path('.').rglob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if update_node(data):
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          article = Path(f"articles/{slug}.html")
          text = article.read_text(encoding='utf-8')
          hero = (
              '          <figure class="article-hero" style="margin:20px 0 24px">'
              '<img src="/assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg" '
              'alt="Queen’s Park in Heywood, where sensory walks are taking place for Love Parks Week" '
              'width="1024" height="768" loading="eager">'
              '<figcaption style="font-size:13px;color:#666;margin-top:7px">'
              'Queen’s Park, Heywood. Photograph: '
              '<a href="https://commons.wikimedia.org/wiki/File:Queen%27s_Park,_Heywood_-_geograph.org.uk_-_6546462.jpg" '
              'target="_blank" rel="noopener noreferrer">David Dixon / Wikimedia Commons</a> '
              '(CC BY-SA 2.0).</figcaption></figure>\n'
          )
          marker = '          <div class="article-share" aria-label="Share this article">'
          if 'class="article-hero"' not in text:
              text = text.replace(marker, hero + marker, 1)
          text = text.replace(
              'https://rochdaledaily.co.uk/assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg',
              'https://rochdaledaily.co.uk/assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg'
          )
          article.write_text(text, encoding='utf-8')
          PY

      - name: Commit photograph and metadata
        run: |
          git config user.name "Rochdale Daily automation"
          git config user.email "news@rochdaledaily.co.uk"
          git add assets/article-images/sensory-walks-celebrate-love-parks-week-at-queens-park-area-category-card.jpg articles/sensory-walks-celebrate-love-parks-week-at-queens-park.html '*.json' articles || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add licensed photograph to sensory walks story"
            git push
          fi
