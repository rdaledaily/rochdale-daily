name: Remove Christine article images

on:
  push:
    paths:
      - remove_christine_images_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove article-specific images and metadata
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          article_id = 'christine-found-newhey-community-search-2026'
          slugs = {
              'elderly-lady-found-after-incredible-community-effort-newhey',
              'christine-found-safe-after-newhey-community-search',
              'christine-found-safe-newhey-community-effort',
          }

          # Remove image fields from JSON records so the site uses its normal fallback.
          json_paths = [Path('manual_articles.json'), Path('articles.json')]
          json_paths.extend(Path('articles').rglob('*.json'))
          for path in json_paths:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              changed = [False]

              def patch(item):
                  if not isinstance(item, dict):
                      return
                  if item.get('id') == article_id or item.get('slug') in slugs:
                      for key in (
                          'img', 'image_url', 'image_credit', 'image_credit_url',
                          'source_image_candidate_url', 'source_image_reuse_status',
                          'image_status', 'image_placeholder_reason'
                      ):
                          if key in item:
                              item.pop(key, None)
                              changed[0] = True

              if isinstance(data, list):
                  for item in data:
                      patch(item)
              elif isinstance(data, dict):
                  patch(data)
                  for key in ('articles', 'items', 'stories'):
                      if isinstance(data.get(key), list):
                          for item in data[key]:
                              patch(item)

              if changed[0]:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove hero figures and all article-specific social image metadata.
          pages = [
              Path('articles/elderly-lady-found-after-incredible-community-effort-newhey.html'),
              Path('articles/christine-found-safe-after-newhey-community-search.html'),
              Path('articles/christine-found-safe-newhey-community-effort.html'),
          ]
          for page in pages:
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'\s*<meta property="og:image"[^>]*>\s*', '\n', text)
              text = re.sub(r'\s*<meta name="twitter:image"[^>]*>\s*', '\n', text)
              text = re.sub(r',?\s*"image"\s*:\s*\[[^\]]*\]', '', text, count=1)
              text = re.sub(r'\s*<figure class="hero">.*?</figure>\s*', '\n', text, flags=re.S)
              page.write_text(text, encoding='utf-8')

          # Remove all generated/corrupted Christine image files.
          assets = Path('assets/img/cards')
          for pattern in (
              'christine-found-newhey-community-search-2026*',
              'christine-newhey-found-safe-*',
          ):
              for file in assets.glob(pattern):
                  if file.is_file():
                      file.unlink()

          Path('remove_christine_images_trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/remove-christine-images.yml').unlink()
          PY

      - name: Validate and publish
        run: |
          python -m json.tool manual_articles.json > /dev/null
          python -m json.tool articles.json > /dev/null
          for page in \
            articles/elderly-lady-found-after-incredible-community-effort-newhey.html \
            articles/christine-found-safe-after-newhey-community-search.html \
            articles/christine-found-safe-newhey-community-effort.html; do
            if [ -f "$page" ]; then
              ! grep -q 'og:image' "$page"
              ! grep -q 'twitter:image' "$page"
              ! grep -q '<figure class="hero">' "$page"
            fi
          done
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove Christine article images and use site fallback"
          git push origin "HEAD:${GITHUB_REF_NAME}"
