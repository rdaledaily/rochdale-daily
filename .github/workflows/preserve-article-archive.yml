name: Preserve permanent article archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-archive-ledger
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve permanent article archive
        run: |
          python scraper/preserve_article_archive.py
      - name: Commit archive ledger if changed
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"
          git add .
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Preserve permanent article archive"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
