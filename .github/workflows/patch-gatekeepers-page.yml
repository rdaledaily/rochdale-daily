name: Patch gatekeepers page

on:
  push:
    paths:
      - gatekeepers_patch_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generated article HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('articles/should-gatekeepers-decide-which-local-news-you-get-to-see.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'Should Gatekeepers Decide Which Local News You Get to See?': 'Are Facebook Groups Becoming the Gatekeepers of Local News?',
            'Recent Rochdale Daily posts have remained pending approval in a major local Facebook group, prompting questions about moderation, free expression and the role of independent local journalism.': 'Large community Facebook groups now play a major role in determining which local stories residents see, raising questions about moderation, access to information and the influence of digital gatekeepers.',
            'Recent Rochdale Daily posts have remained pending approval in a major local Facebook group, prompting questions about moderation, free expression and...': 'Large community Facebook groups now play a major role in determining which local stories residents see, raising questions about moderation, access to information and the influence of digital gatekeepers.',
            'Recent posts from Rochdale Daily submitted to the Rochdale Noticeboard Facebook group have remained pending approval rather than appearing publicly. The group is administered by several individuals, including Labour and Conservative councillors alongside other prominent local community figures.': 'Recent posts from independent local news publishers have, at times, remained pending approval or failed to appear in large community Facebook groups.',
            'Whether recent moderation decisions affecting Rochdale Daily are connected to editorial policy, administrative workload or something else entirely is ultimately a matter for the group\'s administrators to explain. We make no allegation as to their motivation.': 'The reasons for moderation decisions are not always clear and may range from routine administration to editorial choices made by group administrators.',
            'Rochdale Noticeboard': 'a local Facebook group',
            'Labour and Conservative councillors': 'local administrators',
            'prominent local community figures': 'other community administrators'
          }

          for old, new in replacements.items():
            text = text.replace(old, new)

          banned = ['Rochdale Noticeboard', 'Labour and Conservative councillors', 'prominent local community figures']
          for phrase in banned:
            if phrase in text:
              raise SystemExit(f'Banned phrase remains: {phrase}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/should-gatekeepers-decide-which-local-news-you-get-to-see.html
          if git diff --cached --quiet; then echo "No changes found"; exit 1; fi
          git commit -m "Patch published Facebook gatekeepers article"
          git push
