name: Backfill cards-only article images

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  backfill-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Enforce cards-only images
        run: python scraper/ensure_article_images.py --articles articles.json
      - name: Rebuild feeds then re-enforce image policy
        run: |
          python scraper/frontpage_pipeline.py
          python scraper/ensure_article_images.py --articles articles.json
      - name: Validate feed and regenerate static pages
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
          python scraper/generate_archive.py
      - name: Commit cards-only image backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json image_coverage_report.json assets/img/cards articles sitemap.xml index.html
          if git diff --cached --quiet; then echo "Cards-only image policy already satisfied."; exit 0; fi
          git commit -m "Enforce cards-only article images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
