name: Backfill article images

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  backfill-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Backfill missing article images
        env:
          USE_SOURCE_IMAGES: "true"
          USE_WIKIMEDIA_COMMONS: "true"
          REQUEST_TIMEOUT: "20"
        run: python scraper/backfill_images.py
      - name: Validate feed and regenerate static pages
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/frontpage_pipeline.py
          python scraper/generate_pages.py
          python scraper/generate_archive.py
      - name: Commit backfilled images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No images needed backfilling this run."; exit 0; fi
          git commit -m "Backfill missing article images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
