name: One-time Evening Wrap-Up cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-evening-wrapups-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-evening-wrapup-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply and commit permanent cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"

          scrub_manual_source() {
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('manual_articles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          before = len(data)
          data = [
              item for item in data
              if not (
                  isinstance(item, dict)
                  and (
                      'evening wrap-up' in str(item.get('title') or '').lower()
                      or str(item.get('briefing_slot') or '').lower() == 'evening'
                      or str(item.get('slug') or '').lower().startswith('evening-wrap-up-')
                  )
              )
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'manual_articles.json: {before} -> {len(data)} records')
          PY
          }

          apply_cleanup() {
            scrub_manual_source
            python scraper/remove_story.py --title-patterns "evening wrap-up"
          }

          stage_cleanup() {
            git add story_blocklist.json manual_articles.json articles.json event_dates.json articles sitemap.xml news-sitemap.xml index.html 2>/dev/null || true
          }

          apply_cleanup
          stage_cleanup
          if ! git diff --cached --quiet; then
            git commit -m "Permanently remove Evening Wrap-Ups"
            if ! git push origin HEAD:main; then
              for attempt in 1 2 3 4 5; do
                echo "main moved; reapplying cleanup on newest state (${attempt}/5)."
                git fetch origin main
                git reset --hard origin/main
                git clean -fd
                apply_cleanup
                stage_cleanup
                if git diff --cached --quiet; then
                  break
                fi
                git commit -m "Reapply permanent Evening Wrap-Up cleanup"
                if git push origin HEAD:main; then
                  break
                fi
                sleep $((attempt * 6))
              done
            fi
          fi

          # Verify the canonical branch, not just our workspace. Both the manual
          # source and generated feed must be clean or a later rebuild can revive it.
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          if grep -qi 'Evening Wrap-Up' manual_articles.json || grep -qi 'Evening Wrap-Up' articles.json; then
            echo "Evening Wrap-Up was reintroduced; applying final canonical cleanup."
            apply_cleanup
            stage_cleanup
            git commit -m "Final permanent removal of Evening Wrap-Up"
            git push origin HEAD:main
          fi

      - name: Deploy cleaned site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
