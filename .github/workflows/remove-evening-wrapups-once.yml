name: One-time Evening Wrap-Up cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-evening-wrapups-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-evening-wrapup-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove every Evening Wrap-Up
        run: python scraper/remove_story.py --title-patterns "evening wrap-up"

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"
          git add story_blocklist.json articles.json event_dates.json articles sitemap.xml news-sitemap.xml index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No matching live Evening Wrap-Up remained to commit."
            exit 0
          fi
          git commit -m "Remove published Evening Wrap-Ups"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 6))
          done
          exit 1

      - name: Deploy cleaned site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
