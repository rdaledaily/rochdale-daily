name: Repair events
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-events.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair event feed
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          blocked = ('ellie sax', 'monsters of rock', 'oktoberfest', 'pure 80s festival')
          def reject(item):
              if not isinstance(item, dict): return False
              text = ' '.join(str(item.get(k,'')) for k in ('title','slug','id')).lower()
              return any(x in text for x in blocked)
          for filename in ('articles.json','event_dates.json','articles/whats-on.json','articles/frontpage.json'):
              p=Path(filename)
              if not p.exists(): continue
              try: data=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              changed=False
              if isinstance(data,list):
                  new=[x for x in data if not reject(x)]
                  changed=len(new)!=len(data); data=new
              elif isinstance(data,dict):
                  for key in ('articles','events','items'):
                      if isinstance(data.get(key),list):
                          new=[x for x in data[key] if not reject(x)]
                          if len(new)!=len(data[key]): data[key]=new; changed=True
                  if changed and isinstance(data.get('count'),int):
                      for key in ('articles','events','items'):
                          if isinstance(data.get(key),list): data['count']=len(data[key]); break
              if changed: p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('let currentEventFilter = "week";','let currentEventFilter = "all";')
          text=text.replace("let currentEventFilter = 'week';","let currentEventFilter = 'all';")
          text=text.replace('class="event-filter active" data-event-filter="week"','class="event-filter" data-event-filter="week"')
          text=text.replace('class="event-filter" data-event-filter="all"','class="event-filter active" data-event-filter="all"')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Rebuild
        run: python scraper/generate_pages.py
      - name: Commit
        run: |
          rm .github/workflows/repair-events.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Fix upcoming events and remove four listings'
          git push
