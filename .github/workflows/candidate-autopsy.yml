name: Rochdale Daily candidate autopsy

# Replays the retained candidate reservoir through the newsroom's own gate
# functions and records which gate stops each candidate first. Read-only: it
# publishes nothing, holds no site-writer lock, and changes no pipeline
# behaviour. Its output is a report committed under reports/.

on:
  workflow_dispatch:
  schedule:
    - cron: "42 6 * * *"

permissions:
  contents: write

concurrency:
  group: rd-candidate-autopsy
  cancel-in-progress: true

jobs:
  autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Must match the live publish gate, or the report describes a pipeline
      # that is not the one running.
      PUBLISH_MAX_NEWS_AGE_HOURS: "48"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Test the autopsy
        run: PYTHONPATH=scraper python scraper/test_candidate_autopsy.py
      - name: Examine the candidate reservoir
        run: PYTHONPATH=scraper python scraper/candidate_autopsy.py
      - name: Commit autopsy report
        if: always()
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"
          git add reports/candidate_autopsy.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Record candidate autopsy"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 7))
          done
          echo "::warning::candidate autopsy report could not push after five attempts"
