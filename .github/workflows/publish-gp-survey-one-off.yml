name: Localise GP survey article image

on:
  push:
    paths:
      - gp_image_trigger.txt
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gp-survey-image-localiser
  cancel-in-progress: true

jobs:
  localise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download licensed photograph and update article files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          article_id = "rochdale-gp-patient-survey-ranking-2026"
          remote_image = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Nye_Bevan_House%2C_Rochdale.JPG/1280px-Nye_Bevan_House%2C_Rochdale.JPG"
          local_image = "assets/img/cards/nye-bevan-house-rochdale-gp-survey-2026.jpg"
          image_path = Path(local_image)
          image_path.parent.mkdir(parents=True, exist_ok=True)

          request = Request(remote_image, headers={
              "User-Agent": "RochdaleDaily/1.0 (news@rochdaledaily.co.uk)"
          })
          with urlopen(request, timeout=60) as response:
              image_bytes = response.read()
          if len(image_bytes) < 10000 or not image_bytes.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Downloaded Commons file is not a valid JPEG")
          image_path.write_bytes(image_bytes)

          for json_name in [
              "manual_articles.json",
              "articles.json",
              "articles/frontpage.json",
              "articles/categories/health.json",
              "articles/areas/rochdale.json",
          ]:
              path = Path(json_name)
              if not path.is_file():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              items = data if isinstance(data, list) else data.get("articles", [])
              for item in items:
                  if not isinstance(item, dict) or item.get("id") != article_id:
                      continue
                  item["image_url"] = local_image
                  if path.name == "manual_articles.json":
                      item["img"] = local_image
                      item.pop("publication_trigger", None)
                  item["image_credit"] = "Rept0n1x / Wikimedia Commons, CC BY-SA 3.0"
                  item["image_credit_url"] = "https://commons.wikimedia.org/wiki/File:Nye_Bevan_House,_Rochdale.JPG"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          article_page = Path("articles/every-gp-practice-rochdale-ranked-2026-patient-survey.html")
          if article_page.is_file():
              text = article_page.read_text(encoding="utf-8")
              article_page.write_text(text.replace(remote_image, local_image), encoding="utf-8")

          index_page = Path("index.html")
          if index_page.is_file():
              text = index_page.read_text(encoding="utf-8")
              index_page.write_text(text.replace(remote_image, local_image), encoding="utf-8")

          Path("gp_image_trigger.txt").unlink(missing_ok=True)
          PY

      - name: Validate and commit local image
        run: |
          python3 -m json.tool manual_articles.json > /dev/null
          python3 -m json.tool articles.json > /dev/null
          test -s assets/img/cards/nye-bevan-house-rochdale-gp-survey-2026.jpg
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            manual_articles.json \
            articles.json \
            articles/frontpage.json \
            articles/categories/health.json \
            articles/areas/rochdale.json \
            articles/every-gp-practice-rochdale-ranked-2026-patient-survey.html \
            index.html \
            assets/img/cards/nye-bevan-house-rochdale-gp-survey-2026.jpg \
            gp_image_trigger.txt
          git commit -m "Upload local image for Rochdale GP survey article"
          git push origin "HEAD:${GITHUB_REF_NAME}"
