name: Switch Rhiannon image to cache-busted file

on:
  push:
    paths:
      - switch_rhiannon_image_v2_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switch-rhiannon-image-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old Rhiannon image references
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'assets/img/cards/rhiannon-thompson-rewind-debut.jpeg'
          new = 'assets/img/cards/rhiannon-thompson-rewind-debut-2026.jpeg'
          old_abs = 'https://rochdaledaily.co.uk/' + old
          new_abs = 'https://rochdaledaily.co.uk/' + new

          candidates = [Path('manual_articles.json'), Path('articles.json'), Path('index.html')]
          candidates += list(Path('articles').rglob('*.json'))
          candidates += list(Path('articles').rglob('*.html'))

          for path in candidates:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = text.replace(old_abs, new_abs).replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          trigger = Path('switch_rhiannon_image_v2_trigger.txt')
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Commit image switch
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A manual_articles.json articles.json index.html articles switch_rhiannon_image_v2_trigger.txt
          if git diff --cached --quiet; then
            echo "No image references changed"
            exit 1
          fi
          git commit -m "Use cache-busted Rhiannon Thompson artwork"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              sleep 2
            }
          done
          exit 1
