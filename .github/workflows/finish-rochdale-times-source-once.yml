name: Finish Rochdale Times source integration once

on:
  push:
    paths:
      - '.github/workflows/finish-rochdale-times-source-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate Rochdale Times as a newsroom source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scraper = Path('scraper/scraper.py')
          text = scraper.read_text(encoding='utf-8')

          old_exclusions = "exclusions = ' when:1d -site:rochdaleonline.co.uk -site:rochdaletimes.co.uk -vacancy -vacancies -careers -recruitment -hiring -apprenticeship -internship'"
          new_exclusions = "exclusions = ' when:1d -site:rochdaleonline.co.uk -vacancy -vacancies -careers -recruitment -hiring -apprenticeship -internship'"
          if old_exclusions not in text:
              raise SystemExit('Expected Google News Rochdale Times exclusion not found')
          text = text.replace(old_exclusions, new_exclusions, 1)

          old_status = "'prohibited_sources': ['rochdaletimes.co.uk', 'rochdaleonline.co.uk']"
          new_status = "'prohibited_sources': ['rochdaleonline.co.uk']"
          if old_status not in text:
              raise SystemExit('Expected stale prohibited_sources status entry not found')
          text = text.replace(old_status, new_status, 1)

          source_entry = "    {'name': 'Rochdale Times', 'url': 'https://www.rochdaletimes.co.uk/', 'default_area': 'rochdale', 'default_category': 'news', 'link_pattern': '/'},\n"
          marker = 'DISCOVERY_PAGES = [\n'
          if source_entry not in text:
              if marker not in text:
                  raise SystemExit('DISCOVERY_PAGES marker not found')
              text = text.replace(marker, marker + source_entry, 1)

          scraper.write_text(text, encoding='utf-8')

          locality = Path('scraper/locality_rules.py')
          loc = locality.read_text(encoding='utf-8')
          prefix_marker = 'KNOWN_GM_PUBLISHER_NAME_PREFIXES = (\n'
          prefix_entry = '    "Rochdale Times",\n'
          if prefix_entry not in loc:
              if prefix_marker not in loc:
                  raise SystemExit('Known-GM publisher prefix marker not found')
              loc = loc.replace(prefix_marker, prefix_marker + prefix_entry, 1)
          locality.write_text(loc, encoding='utf-8')

          # Regression assertions: Times is discoverable, not excluded/denied,
          # and remains protected by the separate public-copy publisher leak gate.
          updated = scraper.read_text(encoding='utf-8')
          assert "'name': 'Rochdale Times', 'url': 'https://www.rochdaletimes.co.uk/'" in updated
          assert '-site:rochdaletimes.co.uk' not in updated
          start = updated.index("def source_is_denied(source_name: str='', source_url: str='') -> bool:", updated.index('from rewrite_safety import'))
          end = updated.index('ROCHDALE_TRAFFIC_AREA_PATTERNS', start)
          deny_segment = updated[start:end].lower()
          assert 'rochdaletimes.co.uk' not in deny_segment
          assert "'rochdale times'" not in deny_segment
          assert "'prohibited_sources': ['rochdaleonline.co.uk']" in updated
          assert '"Rochdale Times",' in locality.read_text(encoding='utf-8')

          leak_gate = Path('scraper/reject_publisher_leaks.py').read_text(encoding='utf-8')
          assert '"Rochdale Times"' in leak_gate
          print('Rochdale Times direct + indexed discovery enabled; public-copy leak safeguard retained.')
          PY

          python -m py_compile scraper/scraper.py scraper/locality_rules.py scraper/reject_publisher_leaks.py

      - name: Commit integration and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finish-rochdale-times-source-once.yml
          git add scraper/scraper.py scraper/locality_rules.py
          git commit -m 'Enable Rochdale Times newsroom discovery'
          git pull --rebase origin main
          git push origin HEAD:main
