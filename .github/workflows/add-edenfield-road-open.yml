name: Flush pending manual articles now
on:
  push:
    paths:
      - add_edenfield_road_open.txt
permissions:
  contents: write
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge every pending manual article
        run: |
          python - <<'PY'
          import glob, json, os
          from pathlib import Path

          target = Path('manual_articles.json')
          existing = json.loads(target.read_text(encoding='utf-8'))
          pending_files = sorted(glob.glob('pending_manual_*.json'))
          pending = []

          for filename in pending_files:
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if isinstance(data, list):
                  pending.extend(data)
              elif isinstance(data, dict):
                  pending.append(data)

          if pending:
              ids = {a.get('id') for a in pending if a.get('id')}
              slugs = {a.get('slug') for a in pending if a.get('slug')}
              existing = [a for a in existing if a.get('id') not in ids and a.get('slug') not in slugs]
              pending.sort(key=lambda a: a.get('published_at') or a.get('last_updated_at') or '', reverse=True)
              target.write_text(json.dumps(pending + existing, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              for filename in pending_files:
                  os.remove(filename)
              print(f'Flushed {len(pending)} pending manual articles from {len(pending_files)} files.')
          else:
              print('No pending manual articles found.')
          PY
      - name: Validate and rebuild site
        run: |
          python -m json.tool manual_articles.json > /dev/null
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
      - name: Commit flushed articles and pages
        run: |
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f add_edenfield_road_open.txt
          git add -A manual_articles.json pending_manual_*.json add_edenfield_road_open.txt articles sitemap.xml scraper_status.json event_dates.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Flush pending manual articles now'
          git pull --rebase origin main
          git push origin HEAD:main
