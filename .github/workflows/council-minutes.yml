name: Rochdale council minutes discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-4o-mini"
      COUNCIL_MAX_NEW_STORIES: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --no-cache-dir requests feedparser beautifulsoup4 pypdf openai
      - name: Find and verify councillor portraits
        run: python scraper/councillor_photos.py
      - name: Discover indexed council meeting documents
        run: python scraper/council_minutes_collector.py
      - name: Extract decisions, recorded votes and sourced news stories
        run: python scraper/publish_council_minutes_stories.py
      - name: Validate council source data
        run: |
          python -m json.tool council_documents.json > /dev/null
          python -m json.tool council_votes.json > /dev/null
          python -m json.tool councillor_photos.json > /dev/null
      - name: Commit council source data only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          stage_council_state() {
            git add council_documents.json council_votes.json councillor_photos.json manual_articles.d 2>/dev/null || true
            if [ -f council_story_sources.json ]; then
              git add council_story_sources.json
            fi
          }

          rebuild_council_state() {
            python scraper/councillor_photos.py
            python scraper/council_minutes_collector.py
            python scraper/publish_council_minutes_stories.py
            python -m json.tool council_documents.json > /dev/null
            python -m json.tool council_votes.json > /dev/null
            python -m json.tool councillor_photos.json > /dev/null
          }

          stage_council_state
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'No council source changes.'
            exit 0
          fi
          git commit -m 'Update Rochdale council source records'
          if git push origin HEAD:main; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "main moved during council collection; rebuilding source state (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rebuild_council_state
            stage_council_state
            if git diff --cached --quiet; then
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Update Rochdale council source records (race-safe rebuild)'
            if git push origin HEAD:main; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Hand council changes to canonical publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
