name: Rochdale council minutes discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: council-minutes-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector dependencies
        run: python -m pip install --no-cache-dir requests feedparser

      - name: Discover indexed council meeting documents
        run: python scraper/council_minutes_collector.py

      - name: Validate document index
        run: python -m json.tool council_documents.json > /dev/null

      - name: Commit updated council document index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add council_documents.json
          if git diff --cached --quiet; then
            echo 'No new council documents.'
            exit 0
          fi
          git commit -m 'Update Rochdale council meeting document index'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 3; }
          done
          exit 1
