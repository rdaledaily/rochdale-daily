name: Rochdale council minutes discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: council-minutes-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-4o-mini"
      COUNCIL_MAX_NEW_STORIES: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --no-cache-dir requests feedparser beautifulsoup4 pypdf openai
      - name: Find and verify councillor portraits
        run: python scraper/councillor_photos.py
      - name: Discover indexed council meeting documents
        run: python scraper/council_minutes_collector.py
      - name: Extract decisions, recorded votes and sourced news stories
        run: python scraper/publish_council_minutes_stories.py
      - name: Validate democracy data
        run: |
          python -m json.tool council_documents.json > /dev/null
          python -m json.tool council_votes.json > /dev/null
          python -m json.tool councillor_photos.json > /dev/null
      - name: Regenerate every ward democracy page
        run: python scraper/generate_ward_pages.py
      - name: Commit council data, portraits, pages and stories
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add council_documents.json council_story_sources.json council_votes.json councillor_photos.json manual_articles.d/ wards/ index.html
          if git diff --cached --quiet; then
            echo 'No council changes.'
            exit 0
          fi
          git commit -m 'Update Rochdale council democracy records and portraits'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 3; }
          done
          exit 1
