name: Audit canonical article image policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --no-cache-dir 'Pillow>=10,<13'
      - name: Validate cards-only image behaviour
        env:
          PYTHONPATH: scraper
        run: |
          python -m py_compile scraper/ensure_article_images.py scraper/test_ensure_article_images.py
          python scraper/test_ensure_article_images.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          articles = json.loads(Path('articles.json').read_text(encoding='utf-8'))
          failures = []
          for article in articles:
              if not isinstance(article, dict) or str(article.get('status') or 'published').lower() != 'published':
                  continue
              image = str(article.get('image_url') or article.get('img') or '').lstrip('/')
              slug = str(article.get('slug') or article.get('id') or '<unknown>')
              if not image.startswith('assets/img/cards/'):
                  failures.append(f'{slug}: non-canonical image path {image!r}')
                  continue
              if not (root / image).is_file():
                  failures.append(f'{slug}: missing canonical image file {image!r}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Cards-only canonical image audit passed.')
          PY
