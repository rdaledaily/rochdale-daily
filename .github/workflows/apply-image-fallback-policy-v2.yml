name: Apply safe image fallback migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-image-fallback-policy-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --no-cache-dir 'Pillow>=10,<13'
      - name: Apply image policy migration
        run: python scraper/_migrate_image_policy.py
      - name: Validate image fallback behaviour
        env:
          PYTHONPATH: scraper
        run: |
          python -m py_compile scraper/ensure_article_images.py scraper/test_ensure_article_images.py
          python scraper/test_ensure_article_images.py
      - name: Commit validated policy
        run: |
          rm scraper/_migrate_image_policy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper/ensure_article_images.py scraper/test_ensure_article_images.py
          git rm --cached scraper/_migrate_image_policy.py 2>/dev/null || true
          git add -u scraper/_migrate_image_policy.py
          git commit -m 'Preserve relevant article photography before fallback cards'
          git push origin HEAD:main
