name: Apply urgent homepage feed repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-homepage-feed-api.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index.html through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            if (Array.isArray(current.data) || !current.data.content) {
              core.setFailed('Could not read index.html');
              return;
            }
            let text = Buffer.from(current.data.content, 'base64').toString('utf8');

            text = text.replace(
              /const\s+ARTICLE_SOURCES\s*=\s*\[[^\]]*\];/,
              'const ARTICLE_SOURCES = ["/articles/frontpage.json", "/articles.json", "/articles/latest.json"];'
            );

            const marker = 'data-rd-homepage-feed-bootstrap="true"';
            if (!text.includes(marker)) {
              const bootstrap = `\n<script data-rd-homepage-feed-bootstrap="true">\n(function () {\n  function startRochdaleDailyFeed() {\n    if (window.ROCHDALE_DAILY && typeof window.ROCHDALE_DAILY.refreshArticles === "function") {\n      window.ROCHDALE_DAILY.refreshArticles();\n    }\n  }\n  if (document.readyState === "loading") {\n    document.addEventListener("DOMContentLoaded", startRochdaleDailyFeed, { once: true });\n  } else {\n    startRochdaleDailyFeed();\n  }\n})();\n</script>\n`;
              if (!text.includes('</body>')) {
                core.setFailed('index.html has no closing body tag');
                return;
              }
              text = text.replace('</body>', bootstrap + '</body>');
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              sha: current.data.sha,
              message: 'Repair homepage article feed loading',
              content: Buffer.from(text, 'utf8').toString('base64')
            });
