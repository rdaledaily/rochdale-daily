name: Emergency remove outdated May 2026 licensing story

on:
  push:
    paths:
      - .github/workflows/emergency-remove-licensing-may-2026.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-commit
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Remove story and rebuild site
        run: |
          python scraper/remove_story.py --slugs "rochdale-borough-council-licensing-sub-committee-meeting-scheduled-for-may-2026"
      - name: Commit takedown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_blocklist.json articles.json event_dates.json articles sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Remove outdated May 2026 licensing story from live feeds"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
