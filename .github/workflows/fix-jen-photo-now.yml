name: Fix Jen photo now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jen-photo-now.yml'

permissions:
  contents: write

jobs:
  replace-jen-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch staged supplied photo data
        run: git fetch origin jen-photo-real:refs/remotes/origin/jen-photo-real

      - name: Decode Jen's supplied photograph
        shell: bash
        run: |
          set -euo pipefail
          git show origin/jen-photo-real:assets/img/cards/jen-daker-supplied-photo-live.b64 | base64 -d > assets/img/cards/jen-daker-rochdale-personal-trainer-hybrid-hut-fitness-generated-card.jpg
          cp assets/img/cards/jen-daker-rochdale-personal-trainer-hybrid-hut-fitness-generated-card.jpg assets/img/cards/jen-daker-supplied-photo.jpg

      - name: Make supplied photo the canonical manual-article image
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('manual_articles.d/jen-daker-rochdale-personal-trainer-20260831.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['image_url'] = 'assets/img/cards/jen-daker-supplied-photo.jpg'
          data['image_credit'] = 'Photo supplied by Jen Daker'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit exact supplied photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Rochdale Daily Publisher'
          git config user.email 'news@rochdaledaily.co.uk'
          git add assets/img/cards/jen-daker-rochdale-personal-trainer-hybrid-hut-fitness-generated-card.jpg assets/img/cards/jen-daker-supplied-photo.jpg manual_articles.d/jen-daker-rochdale-personal-trainer-20260831.json
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Use Jen Daker supplied photograph everywhere'
          git push origin HEAD:main
