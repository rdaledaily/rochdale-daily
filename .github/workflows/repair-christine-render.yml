name: Repair Christine rendering
on:
  push:
    paths: [repair_christine_render_trigger.txt]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --no-cache-dir "Pillow>=10,<13"
      - run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageOps
          old='elderly-lady-found-after-incredible-community-effort-newhey'
          new='christine-found-safe-after-newhey-community-search'
          old_page=Path(f'articles/{old}.html')
          new_page=Path(f'articles/{new}.html')
          src=next(p for p in [Path('assets/img/cards/christine-found-newhey-community-search-2026-og-v2.jpg'),Path('assets/img/cards/christine-found-newhey-community-search-2026-hero-v2.jpg'),Path('assets/img/cards/christine-found-newhey-community-search-2026.jpeg')] if p.exists())
          with Image.open(src) as im:
              im=ImageOps.exif_transpose(im).convert('RGB'); im.load()
          def fit(img,w,h):
              r=w/h; cr=img.width/img.height
              if cr>r:
                  cw=round(img.height*r); l=(img.width-cw)//2; img=img.crop((l,0,l+cw,img.height))
              else:
                  ch=round(img.width/r); t=(img.height-ch)//2; img=img.crop((0,t,img.width,t+ch))
              return img.resize((w,h),Image.Resampling.LANCZOS)
          hero='assets/img/cards/christine-found-newhey-community-search-2026-hero-v3.jpg'
          social='assets/img/cards/christine-found-newhey-community-search-2026-social-v3.png'
          fit(im.copy(),1280,720).save(hero,'JPEG',quality=88,progressive=False,optimize=False,subsampling=2,exif=b'')
          fit(im.copy(),1200,630).save(social,'PNG',optimize=True)
          with Image.open(hero) as x: x.load(); assert x.size==(1280,720)
          with Image.open(social) as x: x.load(); assert x.size==(1200,630)
          social_abs='https://rochdaledaily.co.uk/'+social
          html=old_page.read_text(encoding='utf-8')
          html=re.sub(r'(<meta property="og:image" content=")[^"]+("\s*/?>)',lambda m:m.group(1)+social_abs+m.group(2),html)
          html=re.sub(r'(<meta name="twitter:image" content=")[^"]+("\s*/?>)',lambda m:m.group(1)+social_abs+m.group(2),html)
          html=re.sub(r'("image":\[?")[^"]+("\]?)',lambda m:m.group(1)+social_abs+m.group(2),html,count=1)
          html=re.sub(r'(<figure class="hero">\s*<img src=")[^"]+("[^>]*>)',lambda m:m.group(1)+'../'+hero+m.group(2),html,count=1)
          old_page.write_text(html,encoding='utf-8')
          old_url='https://rochdaledaily.co.uk/articles/'+old
          new_url='https://rochdaledaily.co.uk/articles/'+new
          new_page.write_text(html.replace(old_url,new_url),encoding='utf-8')
          Path('repair_christine_render_trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/repair-christine-render.yml').unlink()
          PY
      - run: |
          test -s assets/img/cards/christine-found-newhey-community-search-2026-hero-v3.jpg
          test -s assets/img/cards/christine-found-newhey-community-search-2026-social-v3.png
          test -s articles/christine-found-safe-after-newhey-community-search.html
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair Christine image rendering and fresh share URL"
          git push
