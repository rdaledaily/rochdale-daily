name: Scrub private personal name

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Privacy checks should run promptly after every main update, but they should
# not occupy the shared generated-site writer lane when there is nothing to
# scrub. A newer push supersedes an older check; if a scrub does need to write,
# the existing fetch/rebase/push retry loop below resolves a concurrent main
# update safely.
concurrency:
  group: rd-privacy-scrub
  cancel-in-progress: true

jobs:
  scrub:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Scrub private personal name')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove personal name from live repository files
        run: python scraper/scrub_personal_name.py

      - name: Commit scrubbed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Personal name is absent from live repository files."
            exit 0
          fi
          git commit -m "Scrub private personal name"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
