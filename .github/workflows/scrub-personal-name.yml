name: Scrub private byline metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'scraper/scrub_personal_name.py'
      - '.github/workflows/scrub-personal-name.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove private name from byline/author metadata only
        run: python scraper/scrub_personal_name.py
      - name: Commit source metadata repairs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json manual_articles.json manual_articles.d
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Private byline metadata is already clear.'
            exit 0
          fi
          git commit -m "Scrub private byline metadata"
          if git push origin HEAD:main; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python scraper/scrub_personal_name.py
            git add articles.json manual_articles.json manual_articles.d
            if git diff --cached --quiet; then
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Scrub private byline metadata (race-safe rebuild)"
            if git push origin HEAD:main; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Re-render through canonical publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
