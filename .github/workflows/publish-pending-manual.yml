name: Publish pending manual articles

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'pending_manual_*.json'
      - 'manual_publish_trigger.txt'
      - '.github/workflows/publish-pending-manual.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-manual-queue
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Check for pending work
        id: pending
        shell: bash
        run: |
          if compgen -G 'pending_manual_*.json' > /dev/null || [ -f manual_publish_trigger.txt ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No pending manual articles.'
          fi

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Merge pending records into canonical manual source
        if: steps.pending.outputs.run == 'true'
        run: |
          python - <<'PY'
          import glob, json, os
          from pathlib import Path

          target = Path('manual_articles.json')
          existing = json.loads(target.read_text(encoding='utf-8'))
          pending_files = sorted(glob.glob('pending_manual_*.json'))
          incoming = []
          for filename in pending_files:
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if isinstance(data, list):
                  incoming.extend(data)
              elif isinstance(data, dict):
                  incoming.append(data)
              else:
                  raise SystemExit(f'Unsupported JSON shape in {filename}')

          if incoming:
              ids = {str(a.get('id')) for a in incoming if a.get('id')}
              slugs = {str(a.get('slug')) for a in incoming if a.get('slug')}
              existing = [
                  a for a in existing
                  if str(a.get('id') or '') not in ids
                  and str(a.get('slug') or '') not in slugs
              ]
              incoming.sort(
                  key=lambda a: a.get('published_at') or a.get('last_updated_at') or '',
                  reverse=True,
              )
              target.write_text(
                  json.dumps(incoming + existing, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              for filename in pending_files:
                  os.remove(filename)
              print(f'Merged {len(incoming)} pending manual article(s).')
          if os.path.exists('manual_publish_trigger.txt'):
              os.remove('manual_publish_trigger.txt')
          PY
          python -m json.tool manual_articles.json > /dev/null

      - name: Commit canonical manual source only
        if: steps.pending.outputs.run == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_articles.json manual_publish_trigger.txt 2>/dev/null || true
          git add -u -- 'pending_manual_*.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Merge pending manual articles into canonical source'
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Hand off rendering to canonical manual publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
