name: Publish pending manual articles

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'pending_manual_*.json'
      - 'manual_articles.d/**'
      - 'manual_publish_trigger.txt'
      - '.github/workflows/publish-pending-manual.yml'
      - 'scraper/ensure_article_images.py'
      - 'scraper/guarantee_article_images.py'
      - 'assets/img/cards/**'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge pending manual articles
        run: |
          python - <<'PY'
          import glob, json, os
          target = 'manual_articles.json'
          with open(target, encoding='utf-8') as f:
              existing = json.load(f)
          pending_files = sorted(glob.glob('pending_manual_*.json'))
          pending = []
          for path in pending_files:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              if isinstance(data, list): pending.extend(data)
              elif isinstance(data, dict): pending.append(data)
              else: raise ValueError(f'Unsupported JSON in {path}')
          if pending:
              ids = {x.get('id') for x in pending if x.get('id')}
              slugs = {x.get('slug') for x in pending if x.get('slug')}
              existing = [x for x in existing if x.get('id') not in ids and x.get('slug') not in slugs]
              pending.sort(key=lambda x: x.get('published_at') or x.get('last_updated_at') or '', reverse=True)
              with open(target, 'w', encoding='utf-8') as f:
                  json.dump(pending + existing, f, ensure_ascii=False, indent=2); f.write('\n')
              for path in pending_files: os.remove(path)
              print(f'Published {len(pending)} pending manual article(s).')
          else:
              print('No pending manual articles found.')
          if os.path.exists('manual_publish_trigger.txt'): os.remove('manual_publish_trigger.txt')
          PY

      - name: Validate JSON
        run: python -m json.tool manual_articles.json > /dev/null

      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Normalize canonical manual article image references
        shell: bash
        run: |
          set -euo pipefail
          # The front-page builder reloads manual articles verbatim on each pass,
          # including the implicit pass inside generate_pages. Normalize the
          # authoritative manual sources first so page generation cannot restore
          # a legacy/remote image after the public feed has already been checked.
          python scraper/ensure_article_images.py --articles manual_articles.json --report /tmp/manual-image-report.json
          if [ -d manual_articles.d ]; then
            while IFS= read -r -d '' file; do
              python scraper/ensure_article_images.py --articles "$file" --report /tmp/manual-shard-image-report.json
            done < <(find manual_articles.d -type f -name '*.json' -print0)
          fi

      - name: Rebuild article dataset without remote photography
        env:
          USE_SOURCE_IMAGES: 'false'
          USE_WIKIMEDIA_COMMONS: 'false'
        run: python scraper/run_fast_local_pipeline.py --manual-only || python scraper/article_gate.py articles.json

      - name: Enforce cards-only article images
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Rebuild front-page feed
        run: python scraper/frontpage_pipeline.py

      - name: Re-enforce cards-only policy after event/feed generation
        run: python scraper/ensure_article_images.py --articles articles.json

      - name: Validate public article feed and cards-only image paths
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open('articles.json',encoding='utf-8'))
          bad=[]
          missing=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'),image))
              elif not Path(image).is_file():
                  missing.append((a.get('slug'),image))
          if bad or missing:
              raise SystemExit(f'Cards-only image policy failed: {len(bad)} non-card path(s), {len(missing)} missing card file(s)')
          PY

      - name: Rebuild article pages, archive and sitemap
        run: |
          python scraper/generate_pages.py
          python scraper/generate_archive.py

      - name: Verify page rebuild preserved cards-only feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open('articles.json',encoding='utf-8'))
          bad=[]
          missing=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'),image))
              elif not Path(image).is_file():
                  missing.append((a.get('slug'),image))
          if bad or missing:
              raise SystemExit(f'Page generation regressed image policy: {len(bad)} non-card path(s), {len(missing)} missing card file(s)')
          print('Post-page-build cards-only validation passed.')
          PY

      - name: Commit published articles and rebuilt pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Publish manual articles with cards-only images'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo 'Remote main changed generated files too; resolving generated state safely.'
              if git ls-files -u -- articles.json | grep -q .; then
                git show ':2:articles.json' > /tmp/local_articles.json
                git show ':3:articles.json' > /tmp/remote_articles.json
                python scraper/merge_feeds.py /tmp/remote_articles.json /tmp/local_articles.json articles.json
                python scraper/ensure_article_images.py --articles articles.json
                git add articles.json assets/img/cards image_coverage_report.json
              fi
              conflicted=$(git diff --name-only --diff-filter=U)
              if [ -n "${conflicted}" ]; then
                echo "${conflicted}" | while read -r file; do
                  case "$file" in
                    manual_articles.d/*|pending_manual_*.json)
                      git checkout --theirs -- "$file" 2>/dev/null || true
                      git add -- "$file" 2>/dev/null || true
                      ;;
                    *)
                      git checkout --ours -- "$file" 2>/dev/null || git rm -q -- "$file"
                      git add -- "$file" 2>/dev/null || true
                      ;;
                  esac
                done
              fi
              git commit --no-edit || true
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
