name: Publish pending manual articles

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'pending_manual_*.json'
      - 'manual_articles.d/**'
      - 'manual_publish_trigger.txt'
      - '.github/workflows/publish-pending-manual.yml'
      - 'scraper/guarantee_article_images.py'
      - 'scraper/related_commons_images.py'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge pending manual articles
        run: |
          python - <<'PY'
          import glob, json, os
          target = 'manual_articles.json'
          with open(target, encoding='utf-8') as f:
              existing = json.load(f)
          pending_files = sorted(glob.glob('pending_manual_*.json'))
          pending = []
          for path in pending_files:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              if isinstance(data, list): pending.extend(data)
              elif isinstance(data, dict): pending.append(data)
              else: raise ValueError(f'Unsupported JSON in {path}')
          if pending:
              ids = {x.get('id') for x in pending if x.get('id')}
              slugs = {x.get('slug') for x in pending if x.get('slug')}
              existing = [x for x in existing if x.get('id') not in ids and x.get('slug') not in slugs]
              pending.sort(key=lambda x: x.get('published_at') or x.get('last_updated_at') or '', reverse=True)
              with open(target, 'w', encoding='utf-8') as f:
                  json.dump(pending + existing, f, ensure_ascii=False, indent=2); f.write('\n')
              for path in pending_files: os.remove(path)
              print(f'Published {len(pending)} pending manual article(s).')
          else:
              print('No pending manual articles found.')
          if os.path.exists('manual_publish_trigger.txt'): os.remove('manual_publish_trigger.txt')
          PY

      - name: Validate JSON
        run: python -m json.tool manual_articles.json > /dev/null

      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Rebuild article dataset
        run: python scraper/run_fast_local_pipeline.py --manual-only || python scraper/article_gate.py articles.json

      - name: Mark generic cards as replaceable
        run: |
          python - <<'PY'
          import json
          path='articles.json'
          with open(path,encoding='utf-8') as f: data=json.load(f)
          rows=data if isinstance(data,list) else data.get('articles',[])
          changed=0
          for a in rows:
              img=str(a.get('image_url') or a.get('img') or '')
              if ('area-category-card' in img or 'placeholder' in img or
                  img.startswith('assets/img/cards/')):
                  a['source_image_reuse_status']='category-fallback'
                  changed+=1
          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          print(f'Marked {changed} fallback image(s) as replaceable.')
          PY

      - name: Resolve real images for every story
        env:
          USE_SOURCE_IMAGES: 'true'
          USE_WIKIMEDIA_COMMONS: 'true'
        run: |
          python scraper/ensure_article_images.py --articles articles.json --retry-placeholders
          python scraper/related_commons_images.py --articles articles.json
          python scraper/repair_placeholder_images.py --articles articles.json || true
          python scraper/guarantee_article_images.py articles.json

      - name: Rebuild front-page feed with resolved images
        run: python scraper/frontpage_pipeline.py

      - name: Rebuild article pages, archive and sitemap
        run: |
          python scraper/generate_pages.py
          python scraper/generate_archive.py

      - name: Commit published articles and rebuilt pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Publish manual articles with guaranteed real images'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo 'Remote main changed generated files too; resolving generated state safely.'
              if git ls-files -u -- articles.json | grep -q .; then
                git show ':2:articles.json' > /tmp/local_articles.json
                git show ':3:articles.json' > /tmp/remote_articles.json
                python scraper/merge_feeds.py /tmp/remote_articles.json /tmp/local_articles.json articles.json
                git add articles.json
              fi
              conflicted=$(git diff --name-only --diff-filter=U)
              if [ -n "${conflicted}" ]; then
                echo "${conflicted}" | while read -r file; do
                  case "$file" in
                    manual_articles.d/*|pending_manual_*.json)
                      git checkout --theirs -- "$file" 2>/dev/null || true
                      git add -- "$file" 2>/dev/null || true
                      ;;
                    *)
                      git checkout --ours -- "$file" 2>/dev/null || git rm -q -- "$file"
                      git add -- "$file" 2>/dev/null || true
                      ;;
                  esac
                done
              fi
              git commit --no-edit || true
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
