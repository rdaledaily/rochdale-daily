name: Apply corrected newsroom code alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-code-alignment-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-code-alignment
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir 'Pillow>=10,<13'
      - name: Align newsroom code and regression policies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rd(path): return Path(path).read_text(encoding='utf-8')
          def wr(path, text): Path(path).write_text(text, encoding='utf-8')
          def one(path, old, new):
              text=rd(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact match for {old[:80]!r}, got {text.count(old)}')
              wr(path, text.replace(old,new,1))

          # Archive permanence and fresh discovery are separate concerns.
          one('scraper/scraper.py',
              "MAX_NEWS_AGE_HOURS = max(168, int(os.getenv('MAX_NEWS_AGE_HOURS', '168')))",
              "MAX_NEWS_AGE_HOURS = max(1, int(os.getenv('MAX_NEWS_AGE_HOURS', '14')))")

          # Local publishers may provide discovery/corroboration leads. Copyright,
          # overlap, attribution and original-rewrite safeguards remain downstream.
          s=rd('scraper/scraper.py')
          old="SOURCE_DENY_DOMAINS = {'rochdaletimes.co.uk', 'rochdaleonline.co.uk', 'pressreader.com', 'rochdaleobserver.co.uk'}\nSOURCE_DENY_NAMES = {'rochdale times', 'rochdale times paper', 'rochdale online', 'rochdale observer', 'pressreader'}"
          new="SOURCE_DENY_DOMAINS = {'pressreader.com'}\nSOURCE_DENY_NAMES = {'pressreader'}"
          if old not in s: raise SystemExit('scraper source deny policy block not found')
          wr('scraper/scraper.py',s.replace(old,new,1))

          loc=rd('scraper/locality_rules.py')
          for line in ('    "rochdaletimes.co.uk",\n','    "rochdaleonline.co.uk",\n'):
              if line not in loc: raise SystemExit(f'locality deny entry missing: {line!r}')
              loc=loc.replace(line,'',1)
          old_names='SOURCE_DENY_NAMES = {"rochdale times", "rochdale times paper", "rochdale online"}'
          if old_names not in loc: raise SystemExit('locality deny-name block not found')
          loc=loc.replace(old_names,'SOURCE_DENY_NAMES = set()',1)
          marker='KNOWN_GM_PUBLISHER_DOMAINS = {'
          if marker not in loc: raise SystemExit('known GM publisher block missing')
          loc=loc.replace(marker,marker+'\n    "rochdaletimes.co.uk",\n    "rochdaleonline.co.uk",',1)
          wr('scraper/locality_rules.py',loc)

          lt=rd('scraper/test_locality.py')
          old_case='''        False,\n        "Local council update",\n        "Rochdale Times",\n        "https://www.rochdaletimes.co.uk/example",\n        "Explicitly denied source",'''
          new_case='''        True,\n        "Rochdale council update",\n        "Rochdale Times",\n        "https://www.rochdaletimes.co.uk/example",\n        "Local publisher may contribute a geographically anchored discovery/corroboration lead",'''
          if old_case not in lt: raise SystemExit('Rochdale Times locality regression case not found')
          wr('scraper/test_locality.py',lt.replace(old_case,new_case,1))

          # Tests/comments must reflect the production four-shard schedule.
          sq=rd('scraper/search_queries.py')
          sq=sq.replace('# Scheduled runs at :07, :22, :37 and :52 map to shards 0, 1, 2 and 3.', '# Scheduled fast runs at :05, :20, :35 and :50 map to shards 0, 1, 2 and 3.')
          wr('scraper/search_queries.py',sq)
          tq=rd('scraper/test_search_queries.py')
          replacements=(('16, 7','16, 5'),('16, 22','16, 20'),('16, 37','16, 35'),('16, 52','16, 50'))
          for a,b in replacements: tq=tq.replace(a,b)
          tq=tq.replace('across the four scheduled runs per hour','across the four production fast runs per hour')
          wr('scraper/test_search_queries.py',tq)

          # A runtime health check sees one shard. CI verifies the cumulative
          # four-shard borough matrix, so do not require all wards in one run.
          h=rd('scraper/check_scraper_health.py')
          old='''    if missing_categories:\n        failures.append(\n            "borough discovery plan is missing configured categories: "\n            + ", ".join(missing_categories)\n        )\n    if missing_wards:\n        failures.append(\n            "borough discovery plan is missing official wards: "\n            + ", ".join(missing_wards)\n        )\n'''
          new='''    if raw_candidates > 0 and not search_records:\n        failures.append("discovery produced candidates but recorded no search-query execution plan")\n'''
          if old not in h: raise SystemExit('per-run health coverage block not found')
          wr('scraper/check_scraper_health.py',h.replace(old,new,1))

          # Evidence-proportional editorial length is authoritative. Remove the
          # second arbitrary 60/75-word page-layer gate.
          g=rd('scraper/generate_newspaper_pages.py')
          g,n=re.subn(r'\nCATEGORY_MIN_WORDS = \{.*?\n\}\nDEFAULT_MIN_WORDS = 75\n','\n',g,count=1,flags=re.S)
          if n != 1: raise SystemExit('category word thresholds not found')
          old='''\ndef _minimum_words(article) -> int:\n    return CATEGORY_MIN_WORDS.get(fp.article_category(article), DEFAULT_MIN_WORDS)\n\n\ndef _newsroom_eligible(article) -> bool:\n    if fp.is_event(article):\n        return False\n    if article.get("manual_article") or article.get("editorial_lock"):\n        return bool(fp.article_text(article).strip())\n    return fp.editorial_word_count(article) >= _minimum_words(article)\n'''
          new='''\ndef _newsroom_eligible(article) -> bool:\n    if fp.is_event(article):\n        return False\n    text = fp.article_text(article).strip()\n    if not text:\n        return False\n    if article.get("manual_article") or article.get("editorial_lock"):\n        return True\n    if article.get("rewrite_quality_checked") is True:\n        return True\n    route = str(article.get("publication_route") or "").lower()\n    if route in {"ai-grounded-rewrite", "editorial-upgrade", "official-data"}:\n        return True\n    return fp.editorial_word_count(article) >= 40\n'''
          if old not in g: raise SystemExit('page-layer article word gate not found')
          wr('scraper/generate_newspaper_pages.py',g.replace(old,new,1))

          nft=rd('scraper/test_newspaper_freshness.py')
          old='''    assert newsroom._minimum_words(transport_brief) == 60\n    assert newsroom._minimum_words(business_fragment) == 75\n    assert newsroom._newsroom_eligible(transport_brief)\n    assert not newsroom._newsroom_eligible(business_fragment)\n'''
          new='''    transport_brief["rewrite_quality_checked"] = True\n    business_fragment["rewrite_quality_checked"] = True\n    assert newsroom._newsroom_eligible(transport_brief)\n    assert newsroom._newsroom_eligible(business_fragment)\n'''
          if old not in nft: raise SystemExit('newspaper freshness length assertions not found')
          wr('scraper/test_newspaper_freshness.py',nft.replace(old,new,1))

          # A 30-card selector test may only demand 30 when 30 fresh rows exist.
          fpt=rd('scraper/test_frontpage_pipeline.py')
          if 'timedelta(hours=index % 72)' not in fpt: raise SystemExit('stale frontpage fixture not found')
          wr('scraper/test_frontpage_pipeline.py',fpt.replace('timedelta(hours=index % 72)','timedelta(hours=index % 14)',1))

          # Editorial lock prevents churn from identical material, but new verified
          # source URLs can update the canonical story instead of becoming a duplicate.
          s=rd('scraper/scraper.py')
          old="""    if existing_article.get('editorial_lock'):\n        # Hand-edited by the editor: the pipeline never rewrites it.\n        return False\n"""
          new="""    if existing_article.get('editorial_lock'):\n        known_urls = {canonicalise_url(url) for url in existing_article.get('source_urls', []) if url}\n        if existing_article.get('source_url'):\n            known_urls.add(canonicalise_url(existing_article.get('source_url')))\n        candidate_url = canonicalise_url(candidate.source_url)\n        return bool(candidate_url and candidate_url not in known_urls)\n"""
          if old not in s: raise SystemExit('editorial-lock eligibility block not found')
          wr('scraper/scraper.py',s.replace(old,new,1))
          at=rd('scraper/test_archive_persistence.py')
          old_test='''    assert not candidate_is_rewrite_eligible(candidate, existing), (\n        "editorially locked articles are never rewritten, even with new URLs"\n    )\n    print("eligibility: editorial lock respected — OK")'''
          new_test='''    assert candidate_is_rewrite_eligible(candidate, existing), (\n        "a genuinely new source URL must be allowed to update a locked canonical story"\n    )\n    print("eligibility: editorial lock blocks churn but permits new-source updates — OK")'''
          if old_test not in at: raise SystemExit('editorial-lock regression assertion not found')
          wr('scraper/test_archive_persistence.py',at.replace(old_test,new_test,1))

          # Unknown machine geography must not silently become Rochdale.
          ag=rd('scraper/article_gate.py')
          old='''    if area not in CANONICAL_AREAS:\n        notes.append(f"'{ident}': unknown area '{area}' -> '{AREA_FALLBACK}'")\n        area = AREA_FALLBACK\n    elif article.get("area") != area:\n'''
          new='''    if area not in CANONICAL_AREAS:\n        if _is_manual(article) or str(article.get("source_kind") or "").lower() == "editorial":\n            notes.append(f"'{ident}': unknown editor area '{area}' -> '{AREA_FALLBACK}'")\n            area = AREA_FALLBACK\n        else:\n            notes.append(f"'{ident}': dropped automated article with unknown area '{area or 'blank'}'")\n            return None\n    elif article.get("area") != area:\n'''
          if old not in ag: raise SystemExit('article area fallback block not found')
          wr('scraper/article_gate.py',ag.replace(old,new,1))
          gat=rd('scraper/test_article_gate.py')
          marker='def test_unknown_category_falls_back_to_news() -> None:\n'
          addition='''def test_unknown_automated_area_is_dropped() -> None:\n    notes: list[str] = []\n    fixed = normalise_article(\n        manual(area="atlantis", publication_route="ai-grounded-rewrite"), notes\n    )\n    assert fixed is None\n    assert any("unknown area" in note for note in notes)\n\n\n'''
          if addition not in gat:
              if marker not in gat: raise SystemExit('article gate test insertion marker missing')
              gat=gat.replace(marker,addition+marker,1)
          wr('scraper/test_article_gate.py',gat)

          print('Corrected newsroom code alignment applied.')
          PY
      - name: Run aligned regression suite
        env:
          PYTHONPATH: scraper
        run: |
          python -m py_compile scraper/*.py
          python scraper/check_data_files.py
          python scraper/test_frontpage_pipeline.py
          python scraper/test_frontpage_freshness_guard.py
          python scraper/test_newspaper_freshness.py
          python scraper/test_locality.py
          python scraper/test_story_identity.py
          python scraper/test_selection_policy.py
          python scraper/test_search_queries.py
          python scraper/test_rewrite_safety.py
          python scraper/test_editorial_length.py
          python scraper/test_food_hygiene.py
          python scraper/test_content_hygiene.py
          python scraper/test_archive_persistence.py
          python scraper/test_event_identity.py
          python scraper/test_article_gate.py
          python scraper/test_resolve_google_news_sources.py
          python scraper/test_ensure_article_images.py
          python scraper/test_councillor_photos.py
          python scraper/test_generate_news_sitemap.py
          python scraper/test_update_homepage_static_latest.py
          python scraper/test_update_homepage_weekly_news.py
          python scraper/test_homepage_discovery_metadata.py
          python scraper/test_article_time_metadata.py
          python scraper/test_externalise_article_css.py
          python scraper/test_enhance_image_alt_text.py
      - name: Commit validated code alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper/
          git commit -m 'Align newsroom policies with fresh borough-wide coverage'
          git push origin HEAD:main
