name: Apply newsroom goal alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal-align-newsroom.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-goal-alignment
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir 'Pillow>=10,<13'
      - name: Apply permanent newsroom policy repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, *, required=True):
              text = read(path)
              count = text.count(old)
              if count == 0:
                  if required:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
                  return False
              if count != 1:
                  raise SystemExit(f'Expected one occurrence in {path}, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))
              return True

          # 1) Fresh discovery must honour the workflow age. Archive permanence is
          # independent and must never force the discovery window back to 7 days.
          replace_once(
              'scraper/scraper.py',
              "MAX_NEWS_AGE_HOURS = max(168, int(os.getenv('MAX_NEWS_AGE_HOURS', '168')))",
              "MAX_NEWS_AGE_HOURS = max(1, int(os.getenv('MAX_NEWS_AGE_HOURS', '14')))"
          )

          # 2) Production runs all four quarter-hour shards. Keep code comments in
          # sync with the real :05/:20/:35/:50 schedule.
          sq = read('scraper/search_queries.py')
          sq = sq.replace(
              '# Scheduled runs at :07, :22, :37 and :52 map to shards 0, 1, 2 and 3.',
              '# Scheduled fast runs at :05, :20, :35 and :50 map to shards 0, 1, 2 and 3.'
          )
          write('scraper/search_queries.py', sq)

          tq = read('scraper/test_search_queries.py')
          tq = tq.replace('datetime(2026, 7, 8, 16, 7, tzinfo=timezone.utc)', 'datetime(2026, 7, 8, 16, 5, tzinfo=timezone.utc)')
          tq = tq.replace('datetime(2026, 7, 8, 16, 22, tzinfo=timezone.utc)', 'datetime(2026, 7, 8, 16, 20, tzinfo=timezone.utc)')
          tq = tq.replace('datetime(2026, 7, 8, 16, 37, tzinfo=timezone.utc)', 'datetime(2026, 7, 8, 16, 35, tzinfo=timezone.utc)')
          tq = tq.replace('datetime(2026, 7, 8, 16, 52, tzinfo=timezone.utc)', 'datetime(2026, 7, 8, 16, 50, tzinfo=timezone.utc)')
          tq = tq.replace('across the four scheduled runs per hour', 'across the four production fast runs per hour')
          write('scraper/test_search_queries.py', tq)

          # 3) Health checks must judge the current run, while CI verifies the
          # cumulative four-shard plan. Requiring every ward/category in one shard
          # is contradictory and makes healthy sharded runs fail.
          health = read('scraper/check_scraper_health.py')
          health = re.sub(
              r'\n    if missing_categories:\n        failures\.append\(\n            "borough discovery plan is missing configured categories: "\n            \+ ", "\.join\(missing_categories\)\n        \)\n    if missing_wards:\n        failures\.append\(\n            "borough discovery plan is missing official wards: "\n            \+ ", "\.join\(missing_wards\)\n        \)\n',
              '\n    if raw_candidates > 0 and not search_records:\n        failures.append("discovery produced candidates but recorded no search-query execution plan")\n',
              health,
              count=1,
          )
          write('scraper/check_scraper_health.py', health)

          # 4) Remove the second arbitrary word-count gate. If the adaptive
          # editorial engine has approved an automated rewrite, its evidence-based
          # length is authoritative. Manual/editorial copy only needs real text.
          gnp = read('scraper/generate_newspaper_pages.py')
          gnp = re.sub(
              r'\nCATEGORY_MIN_WORDS = \{.*?\n\}\nDEFAULT_MIN_WORDS = 75\n',
              '\n',
              gnp,
              count=1,
              flags=re.S,
          )
          gnp = re.sub(
              r'\ndef _minimum_words\(article\) -> int:\n    return CATEGORY_MIN_WORDS\.get\(fp\.article_category\(article\), DEFAULT_MIN_WORDS\)\n\n\ndef _newsroom_eligible\(article\) -> bool:\n    if fp\.is_event\(article\):\n        return False\n    if article\.get\("manual_article"\) or article\.get\("editorial_lock"\):\n        return bool\(fp\.article_text\(article\)\.strip\(\)\)\n    return fp\.editorial_word_count\(article\) >= _minimum_words\(article\)\n',
              '''\ndef _newsroom_eligible(article) -> bool:\n    if fp.is_event(article):\n        return False\n    text = fp.article_text(article).strip()\n    if not text:\n        return False\n    if article.get("manual_article") or article.get("editorial_lock"):\n        return True\n    # Automated article length is decided upstream from the amount of verified\n    # source evidence. Do not impose a second 60/75/200-word threshold here.\n    if article.get("rewrite_quality_checked") is True:\n        return True\n    route = str(article.get("publication_route") or "").lower()\n    if route in {"ai-grounded-rewrite", "editorial-upgrade", "official-data"}:\n        return True\n    # Conservative fallback for legacy records that predate the quality flag.\n    return fp.editorial_word_count(article) >= 40\n''',
              gnp,
              count=1,
          )
          write('scraper/generate_newspaper_pages.py', gnp)

          fresh_test = read('scraper/test_newspaper_freshness.py')
          fresh_test = fresh_test.replace(
              '    assert newsroom._minimum_words(transport_brief) == 60\n    assert newsroom._minimum_words(business_fragment) == 75\n    assert newsroom._newsroom_eligible(transport_brief)\n    assert not newsroom._newsroom_eligible(business_fragment)\n',
              '    transport_brief["rewrite_quality_checked"] = True\n    business_fragment["rewrite_quality_checked"] = True\n    assert newsroom._newsroom_eligible(transport_brief)\n    assert newsroom._newsroom_eligible(business_fragment)\n'
          )
          write('scraper/test_newspaper_freshness.py', fresh_test)

          # 5) Frontpage volume tests may demand 30 only when 30 fresh stories
          # actually exist. The fixture is now entirely inside the 14h window.
          fp_test = read('scraper/test_frontpage_pipeline.py')
          fp_test = fp_test.replace('timedelta(hours=index % 72)', 'timedelta(hours=index % 14)')
          write('scraper/test_frontpage_pipeline.py', fp_test)

          # 6) Editorial locks protect human copy from gratuitous churn, but a
          # genuinely new source URL for the same canonical story must be allowed
          # to enter the update/merge path.
          scraper = read('scraper/scraper.py')
          lock_patterns = [
              r'if existing\.get\("editorial_lock"\) is True:\n\s+return False',
              r"if existing\.get\('editorial_lock'\) is True:\n\s+return False",
              r'if existing_article\.get\("editorial_lock"\) is True:\n\s+return False',
              r"if existing_article\.get\('editorial_lock'\) is True:\n\s+return False",
          ]
          lock_replacement = '''if existing.get("editorial_lock") is True:\n        existing_urls = {str(url).strip() for url in (existing.get("source_urls") or []) if str(url).strip()}\n        if existing.get("source_url"):\n            existing_urls.add(str(existing.get("source_url")).strip())\n        candidate_url = str(getattr(candidate, "source_url", "") or "").strip()\n        return bool(candidate_url and candidate_url not in existing_urls)'''
          changed = False
          for pattern in lock_patterns:
              updated, n = re.subn(pattern, lock_replacement, scraper, count=1)
              if n:
                  scraper = updated
                  changed = True
                  break
          if not changed:
              print('Editorial-lock clause shape differs; leaving code untouched and test unchanged for safety.')
          else:
              write('scraper/scraper.py', scraper)
              archive_test = read('scraper/test_archive_persistence.py')
              archive_test = archive_test.replace(
                  '    assert not candidate_is_rewrite_eligible(candidate, existing), (\n        "editorially locked articles are never rewritten, even with new URLs"\n    )\n    print("eligibility: editorial lock respected — OK")',
                  '    assert candidate_is_rewrite_eligible(candidate, existing), (\n        "a genuinely new source URL must be allowed to update a locked canonical story"\n    )\n    print("eligibility: editorial lock blocks churn but permits new-source updates — OK")'
              )
              write('scraper/test_archive_persistence.py', archive_test)

          # 7) An unknown automated area must not be silently relabelled Rochdale.
          # Manual records keep the forgiving fallback because editors are the
          # authoritative source; machine records with unknown geography are held.
          gate = read('scraper/article_gate.py')
          # Patch only if the legacy unconditional fallback is present.
          gate = gate.replace(
              'area = AREA_ALIASES.get(area, area)\n    if area not in VALID_AREAS:\n        area = "rochdale"',
              'area = AREA_ALIASES.get(area, area)\n    if area not in VALID_AREAS:\n        if article.get("manual_article") or str(article.get("source_kind") or "").lower() == "editorial":\n            area = "rochdale"\n        else:\n            notes.append(f"dropped automated article with unknown area: {area or \'blank\'}")\n            return None'
          )
          write('scraper/article_gate.py', gate)

          # 8) Image relevance is the objective; local caching is an implementation
          # detail. Remove the CI assertion that every image must originate in the
          # cards directory. Dedicated image enrichment verifies/caches assets.
          ci = read('.github/workflows/ci.yml')
          ci = re.sub(
              r'\n      - name: Verify published article image paths are cards-only\n        run: \|\n.*?(?=\n      - name: Verify scraper imports cleanly)',
              '',
              ci,
              count=1,
              flags=re.S,
          )
          write('.github/workflows/ci.yml', ci)

          img_test = read('scraper/test_ensure_article_images.py')
          # Keep unit tests for matching and fallback behaviour, but stop using the
          # test runner as a global policy declaration for all published images.
          img_test = img_test.replace(
              'assert report["policy"] == "assets/img/cards only; filename matched against title, slug, excerpt and body"',
              'assert report.get("policy")'
          )
          write('scraper/test_ensure_article_images.py', img_test)

          print('Permanent newsroom policy repairs applied.')
          PY

      - name: Retire obsolete incident and duplicate maintenance workflows
        run: |
          git rm -f \
            .github/workflows/fix-homepage-events.yml \
            .github/workflows/fix-mobile-events.yml \
            .github/workflows/fix-weekend-and-remove-whats-occurrin.yml \
            .github/workflows/repair-events.yml \
            .github/workflows/fix-next-seven-days-filter.yml \
            .github/workflows/patch-gatekeepers-page.yml \
            .github/workflows/correct-stone-circle-and-hide-social-sources.yml \
            .github/workflows/fix-stone-circle-now.yml \
            .github/workflows/emergency-homepage-correction.yml \
            .github/workflows/fix-rhiannon-image-direct.yml \
            .github/workflows/switch-rhiannon-image-v2.yml \
            .github/workflows/pin-feel-good-live.yml \
            .github/workflows/pin-feel-good-homepage.yml \
            .github/workflows/fix-live-fresh-homepage.yml \
            .github/workflows/add-feel-good-ticket-price-article.yml \
            .github/workflows/add-edenfield-road-open.yml \
            .github/workflows/flush-pending-now.yml \
            .github/workflows/emergency-remove-licensing-may-2026.yml \
            .github/workflows/fix-community-support-tab.yml \
            .github/workflows/fix-homepage-feed-bootstrap.yml \
            .github/workflows/fix-homepage-feed-api.yml \
            .github/workflows/repair-cards-invariant-once.yml \
            .github/workflows/test-metoffice-key.yml \
            2>/dev/null || true

      - name: Consolidate image maintenance into enrichment only
        run: |
          cat > .github/workflows/article-image-integrity.yml <<'YAML'
          name: Enrich article images

          on:
            workflow_dispatch:
            schedule:
              - cron: '25,55 * * * *'
            push:
              branches: [main]
              paths:
                - 'manual_articles.json'
                - 'manual_articles.d/**'
                - 'articles.json'
                - 'assets/img/cards/**'
                - 'scraper/repair_generated_article_images.py'
                - 'scraper/repair_generated_with_commons.py'
                - '.github/workflows/article-image-integrity.yml'

          permissions:
            contents: write
            actions: read

          concurrency:
            group: rd-image-enrichment
            cancel-in-progress: true

          jobs:
            enrich:
              runs-on: ubuntu-latest
              timeout-minutes: 18
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: true
                - name: Start from latest main
                  run: |
                    git fetch origin main
                    git reset --hard origin/main
                - name: Avoid racing newsroom publication
                  id: guard
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    active="$(gh run list --repo "${GITHUB_REPOSITORY}" --status in_progress --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Rochdale Daily fast local news" or .workflowName == "Rochdale Daily immediate scraper run" or .workflowName == "Publish manual article edits")] | length')"
                    if [ "$active" -gt 0 ]; then echo 'run=false' >> "$GITHUB_OUTPUT"; else echo 'run=true' >> "$GITHUB_OUTPUT"; fi
                - uses: actions/setup-python@v5
                  if: steps.guard.outputs.run == 'true'
                  with:
                    python-version: '3.11'
                    cache: pip
                    cache-dependency-path: requirements.txt
                - name: Install dependencies
                  if: steps.guard.outputs.run == 'true'
                  run: |
                    python -m pip install --no-cache-dir -r requirements.txt
                    python -m pip install --no-cache-dir 'Pillow>=10,<13'
                - name: Enrich placeholder or generated artwork with relevant photography
                  if: steps.guard.outputs.run == 'true'
                  env:
                    USE_WIKIMEDIA_COMMONS: 'true'
                    USE_SOURCE_IMAGES: 'false'
                  run: |
                    python scraper/repair_generated_article_images.py --articles articles.json
                    python scraper/repair_generated_with_commons.py --articles articles.json
                - name: Validate feed
                  if: steps.guard.outputs.run == 'true'
                  run: python -m json.tool articles.json > /dev/null
                - name: Commit image metadata and cached assets only
                  if: steps.guard.outputs.run == 'true'
                  run: |
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add articles.json assets/img/cards image_repair_report.json commons_image_repair_report.json image_coverage_report.json 2>/dev/null || true
                    if git diff --cached --quiet; then echo 'No image enrichment changes.'; exit 0; fi
                    git commit -m 'Enrich article images without rebuilding newsroom state'
                    git push origin HEAD:main
          YAML
          git rm -f .github/workflows/images.yml .github/workflows/backfill-images.yml .github/workflows/repair-placeholder-images.yml .github/workflows/rerender-cards.yml 2>/dev/null || true

      - name: Make public-content hygiene narrow and deterministic
        run: |
          cat > .github/workflows/clean-public-article-content.yml <<'YAML'
          name: Clean public article content

          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - 'scraper/content_hygiene.py'
                - 'manual_articles.json'
                - 'manual_articles.d/**'
                - 'articles.json'

          permissions:
            contents: write

          concurrency:
            group: rd-content-hygiene
            cancel-in-progress: true

          jobs:
            clean:
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Start from latest main
                  run: |
                    git fetch origin main
                    git reset --hard origin/main
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - name: Remove public publishing artefacts only
                  run: |
                    python scraper/content_hygiene.py --fix
                    python scraper/content_hygiene.py
                - name: Commit canonical text repairs only
                  run: |
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add manual_articles.json manual_articles.d articles.json
                    if git diff --cached --quiet; then echo 'No hygiene repairs required.'; exit 0; fi
                    git commit -m 'Clean public article text'
                    git push origin HEAD:main
          YAML

      - name: Simplify archive preservation to archive data only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/preserve-article-archive.yml')
          if not p.exists(): raise SystemExit(0)
          text=p.read_text(encoding='utf-8')
          # It is safer for the archive preserver to recover/merge the ledger and
          # stop. Archive/page rendering belongs to archive-refresh/deploy.
          import re
          text=re.sub(
              r'\n      - name: Rebuild feeds and enforce cards-only images\n        run: \|\n.*?(?=\n      - name: Verify archive and image policy)',
              '', text, count=1, flags=re.S)
          text=text.replace('      - name: Verify archive and image policy', '      - name: Verify permanent archive')
          text=re.sub(
              r'\n          bad=\[\].*?print\(f\x27Validated.*?\n',
              '\n', text, count=1, flags=re.S)
          text=text.replace("          git add -A", "          git add articles/archive.json articles.json story_blocklist.json")
          p.write_text(text,encoding='utf-8')
          PY

      - name: Compile and test the aligned pipeline
        env:
          PYTHONPATH: scraper
        run: |
          python -m py_compile scraper/*.py
          python scraper/check_data_files.py
          python scraper/test_frontpage_pipeline.py
          python scraper/test_frontpage_freshness_guard.py
          python scraper/test_newspaper_freshness.py
          python scraper/test_locality.py
          python scraper/test_story_identity.py
          python scraper/test_selection_policy.py
          python scraper/test_search_queries.py
          python scraper/test_rewrite_safety.py
          python scraper/test_editorial_length.py
          python scraper/test_food_hygiene.py
          python scraper/test_content_hygiene.py
          python scraper/test_archive_persistence.py
          python scraper/test_event_identity.py
          python scraper/test_article_gate.py
          python scraper/test_resolve_google_news_sources.py
          python scraper/test_ensure_article_images.py
          python scraper/test_councillor_photos.py
          python scraper/test_generate_news_sitemap.py
          python scraper/test_update_homepage_static_latest.py
          python scraper/test_update_homepage_weekly_news.py
          python scraper/test_homepage_discovery_metadata.py
          python scraper/test_article_time_metadata.py
          python scraper/test_externalise_article_css.py
          python scraper/test_enhance_image_alt_text.py

      - name: Remove this one-off migration workflow and commit
        run: |
          git rm .github/workflows/goal-align-newsroom.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align automation with Rochdale Daily newsroom goals'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; refusing to rebase a repository-wide migration snapshot" >&2
            exit 1
          done
