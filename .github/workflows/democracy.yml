name: Refresh democracy source data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/img/cards/**'
      - 'council_roster.json'
      - 'council_votes.json'
      - 'ward_areas.json'
      - 'scraper/councillor_photos.py'
      - 'scraper/test_councillor_photos.py'
      - '.github/workflows/democracy.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  democracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require a local portrait for every councillor
        run: python scraper/test_councillor_photos.py
      - name: Rebuild councillor portrait source index
        run: python scraper/councillor_photos.py
      - name: Commit democracy source data only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add councillor_photos.json
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Democracy source data already current.'
            exit 0
          fi
          git commit -m 'Refresh councillor portrait source data'
          if git push origin HEAD:main; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python scraper/test_councillor_photos.py
            python scraper/councillor_photos.py
            git add councillor_photos.json
            if git diff --cached --quiet; then
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Refresh councillor portrait source data (race-safe rebuild)'
            if git push origin HEAD:main; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Hand democracy changes to canonical publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
