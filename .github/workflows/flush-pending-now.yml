name: Flush pending manual articles now
on:
  push:
    paths:
      - flush_pending_now.txt
permissions:
  contents: write
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Merge queued manual stories
        run: python scraper/publish_pending_manual.py
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Rebuild site
        run: |
          python -m json.tool manual_articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
      - name: Commit and push
        run: |
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f flush_pending_now.txt
          git add -A
          git commit -m 'Publish queued community and environment stories' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
