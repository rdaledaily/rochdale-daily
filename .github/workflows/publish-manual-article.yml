name: Publish pending manual article

on:
  push:
    paths:
      - manual_article_pending.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rochdale-daily-15-minute-scraper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Materialise optional attached image
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from PIL import Image

          pending = Path('manual_image_pending.json')
          if not pending.exists():
              raise SystemExit(0)

          payload = json.loads(pending.read_text(encoding='utf-8'))
          relative_path = str(payload.get('path') or '').replace('\\', '/').lstrip('/')
          if not relative_path.startswith(('assets/img/cards/', 'assets/article-images/')):
              raise SystemExit('Manual image path must be inside an approved article image folder')

          encoded = str(payload.get('content_base64') or '')
          if not encoded:
              raise SystemExit('Manual image payload is empty')

          destination = Path(relative_path)
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(base64.b64decode(encoded, validate=True))

          with Image.open(destination) as image:
              image.verify()

          pending.unlink()
          PY

      - name: Replace and validate article
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = Path('manual_articles.json')
          pending = Path('manual_article_pending.json')
          articles = json.loads(target.read_text(encoding='utf-8'))
          replacements = json.loads(pending.read_text(encoding='utf-8'))

          replacement_by_id = {
              str(article.get('id')): article
              for article in replacements
              if isinstance(article, dict) and article.get('id')
          }
          replacement_by_slug = {
              str(article.get('slug')): article
              for article in replacements
              if isinstance(article, dict) and article.get('slug')
          }

          updated = []
          used = set()
          for article in articles:
              article_id = str(article.get('id', '')) if isinstance(article, dict) else ''
              article_slug = str(article.get('slug', '')) if isinstance(article, dict) else ''
              replacement = replacement_by_id.get(article_id) or replacement_by_slug.get(article_slug)
              if replacement is not None:
                  updated.append(replacement)
                  used.add(id(replacement))
              else:
                  updated.append(article)

          for replacement in replacements:
              if id(replacement) not in used:
                  updated.insert(0, replacement)

          target.write_text(json.dumps(updated, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(target.read_text(encoding='utf-8'))
          pending.unlink()
          PY

      - name: Promote manual articles into public feed
        env:
          FRONTPAGE_PRIMARY_DAYS: "1"
          FRONTPAGE_FALLBACK_DAYS: "3"
          FRONTPAGE_MIN_ARTICLES: "50"
          FRONTPAGE_TARGET_ARTICLES: "80"
        run: python scraper/frontpage_pipeline.py

      - name: Ensure article images
        run: python scraper/ensure_article_images.py --limit 0

      - name: Validate and rebuild site
        run: |
          python -m json.tool manual_articles.json > /dev/null
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py

      - name: Commit publication
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            manual_articles.json \
            manual_article_pending.json \
            manual_image_pending.json \
            articles.json \
            scraper_status.json \
            event_dates.json \
            image_coverage_report.json \
            assets/img/cards \
            assets/img/generated \
            assets/article-images \
            articles \
            sitemap.xml \
            index.html

          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git commit -m "Publish manual article to live site"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || {
              git checkout --ours -- .
              git add .
              git commit --no-edit
            }
          done
          exit 1
