name: Fix Christine article image

on:
  push:
    paths:
      - fix_christine_image_trigger.txt
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fix-christine-article-image
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Crop portrait photograph for article cards
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          path = Path('assets/img/cards/christine-found-newhey-community-search-2026.jpeg')
          if not path.exists():
              raise SystemExit('Christine image is missing')

          with Image.open(path) as source:
              image = ImageOps.exif_transpose(source).convert('RGB')

          width, height = image.size
          crop_height = round(width * 9 / 16)
          top = min(400, max(0, height - crop_height))
          image = image.crop((0, top, width, top + crop_height))
          image.save(path, 'JPEG', quality=90, optimize=True, progressive=True)

          page = Path('articles/elderly-lady-found-after-incredible-community-effort-newhey.html')
          if page.exists():
              text = page.read_text(encoding='utf-8')
              text = text.replace(
                  '.hero img{width:100%;max-height:720px;object-fit:cover;display:block;background:#ddd}',
                  '.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#ddd}'
              )
              page.write_text(text, encoding='utf-8')

          Path('fix_christine_image_trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/fix-christine-image.yml').unlink()
          PY

      - name: Commit corrected photograph
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Christine article image crop"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              git merge --no-edit "origin/${GITHUB_REF_NAME}"
            }
          done
          exit 1
