name: Enforce universal Rochdale Daily theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "articles/**/*.html"
      - "news/**/*.html"
      - "wards/**/*.html"
      - "showbiz/**/*.html"
      - "assets/css/rd-tokens.css"
      - "assets/css/newspaper-global.css"
      - "assets/css/public-families.css"
      - "assets/css/editorial-theme.css"
      - "assets/css/legacy-routing-pages.css"
      - "scraper/normalise_public_theme.py"
      - ".github/workflows/theme-normalise.yml"

permissions:
  contents: write

concurrency:
  group: rd-universal-theme
  cancel-in-progress: true

jobs:
  normalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply publication theme contract
        run: |
          python scraper/normalise_public_theme.py
          python scraper/normalise_public_theme.py --check

      - name: Commit normalised public pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u

          if git diff --cached --quiet; then
            echo "All public pages already use the universal newspaper theme."
            exit 0
          fi

          git commit -m "Normalise public pages to universal newspaper theme"
          if git push origin HEAD:main; then
            exit 0
          fi

          echo "main moved while normalising; rebuilding from latest main."
          git fetch origin main
          git reset --hard origin/main
          python scraper/normalise_public_theme.py
          python scraper/normalise_public_theme.py --check
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalise public pages to universal newspaper theme"
          git push origin HEAD:main
