name: Enforce universal Rochdale Daily theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "articles/**/*.html"
      - "news/**/*.html"
      - "wards/**/*.html"
      - "showbiz/**/*.html"
      - "assets/css/rd-tokens.css"
      - "assets/css/newspaper-global.css"
      - "assets/css/public-families.css"
      - "assets/css/editorial-theme.css"
      - "assets/css/legacy-routing-pages.css"
      - "scraper/normalise_public_theme.py"
      - "scraper/editorial_contract.py"
      - "scraper/ward_postcode_evidence.py"
      - "ward_areas.json"
      - "scraper/rochdale_streets.json"
      - ".github/workflows/theme-normalise.yml"

permissions:
  contents: write

concurrency:
  group: rd-universal-theme
  cancel-in-progress: true

jobs:
  normalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install newsroom dependencies
        run: pip install -r requirements.txt

      - name: Apply publication theme contract
        run: |
          python scraper/normalise_public_theme.py
          python scraper/normalise_public_theme.py --check

      - name: Commit normalised public pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage() {
            git add -u
            git add assets/img/cards archive_quality_report.json archive_quality_reviews.json ward_postcode_evidence.json ward_street_evidence.json
          }

          # Several changes can land on main within the same minute (four did
          # on 13 Nov 2026, and the single retry this step used to have lost
          # the race twice and failed the run). Rebuild on the latest main and
          # try again, up to five times.
          for attempt in 1 2 3 4 5; do
            stage
            if git diff --cached --quiet; then
              echo "All public pages already use the universal newspaper theme."
              exit 0
            fi
            git commit -m "Normalise public pages to universal newspaper theme"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved while normalising (attempt ${attempt}); rebuilding from latest main."
            sleep $((attempt * 5))
            git fetch origin main
            git reset --hard origin/main
            python scraper/normalise_public_theme.py
            python scraper/normalise_public_theme.py --check
          done
          echo "::error::main kept moving through five attempts; the pages will be normalised by the next publish."
          exit 1
