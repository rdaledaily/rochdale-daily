name: Fast publish manual articles

on:
  push:
    paths:
      - manual_fast_publish_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rochdale-daily-15-minute-scraper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"

      - name: Inject manual articles without external collection
        env:
          FRONTPAGE_PRIMARY_DAYS: "1"
          FRONTPAGE_FALLBACK_DAYS: "3"
          FRONTPAGE_MIN_ARTICLES: "50"
          FRONTPAGE_TARGET_ARTICLES: "80"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scraper')
          import frontpage_pipeline
          frontpage_pipeline.collect_ticket_events = lambda: ([], None)
          raise SystemExit(frontpage_pipeline.main())
          PY

      - name: Rebuild article pages
        run: |
          python scraper/ensure_article_images.py --limit 0
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py

      - name: Commit live publication
        run: |
          git config user.name "Rochdale Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f manual_article_pending.json manual_fast_publish_trigger.txt
          git add -A \
            manual_article_pending.json \
            manual_fast_publish_trigger.txt \
            articles.json \
            scraper_status.json \
            event_dates.json \
            image_coverage_report.json \
            assets/img/generated \
            assets/article-images \
            articles \
            sitemap.xml \
            index.html
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish Rhiannon Thompson article to live site"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || {
              git checkout --ours -- .
              git add .
              git commit --no-edit
            }
          done
          exit 1
