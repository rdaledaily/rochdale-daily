name: One-off newsletter layout repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-newsletter-section.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair newsletter contrast and mobile spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          global_css = Path('assets/css/newspaper-global.css')
          text = global_css.read_text(encoding='utf-8')
          old = ".page-shell,\n.section,\nmain {"
          new = ".page-shell,\n.section:not(.newsletter-band),\nmain {"
          if old not in text and new not in text:
              raise SystemExit('Could not find global section background rule')
          text = text.replace(old, new, 1)
          global_css.write_text(text, encoding='utf-8')

          theme = Path('assets/css/editorial-theme.css')
          css = theme.read_text(encoding='utf-8')
          start = '/* RD NEWSLETTER MOBILE FIX */'
          end = '/* END RD NEWSLETTER MOBILE FIX */'
          if start in css and end in css:
              before = css.split(start, 1)[0].rstrip()
              after = css.split(end, 1)[1].lstrip()
              css = before + '\n\n' + after

          block = r'''/* RD NEWSLETTER MOBILE FIX */
/* Keep this component deliberately compact on phones. The global compatibility
   layer must not turn it back into a paper-white generic section. */
#newsletter.newsletter-band {
  background: var(--brand-navy) !important;
  color: var(--on-dark) !important;
  padding: 30px 0 !important;
}
#newsletter .newsletter-inner {
  gap: 24px;
}
#newsletter .section-title {
  color: var(--on-dark) !important;
}
#newsletter .story-kicker {
  color: var(--brand-accent-lift) !important;
}
#newsletter .newsletter-copy p,
#newsletter .newsletter-podcast,
#newsletter .newsletter-consent {
  color: var(--on-dark-mut) !important;
}
#newsletter .newsletter-consent a {
  color: var(--on-dark) !important;
}
#newsletter .newsletter-row input,
#newsletter .newsletter-row button {
  min-height: 48px;
}

@media (max-width: 820px) {
  #newsletter.newsletter-band {
    padding: 22px 0 24px !important;
  }
  #newsletter .newsletter-inner {
    gap: 15px;
  }
  #newsletter .section-title {
    margin: 4px 0 7px;
    font-size: clamp(29px, 9vw, 38px) !important;
    line-height: 1.02 !important;
  }
  #newsletter .newsletter-copy p {
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.42;
  }
  #newsletter .newsletter-podcast {
    margin-bottom: 0;
  }
  #newsletter .newsletter-row {
    gap: 8px;
  }
  #newsletter .newsletter-row input {
    min-height: 46px;
    padding: 11px 12px;
    font-size: 16px;
  }
  #newsletter .newsletter-row button {
    min-height: 46px;
    padding: 11px 15px;
  }
  #newsletter .newsletter-consent {
    margin-top: 8px;
    gap: 8px;
    font-size: 12px;
    line-height: 1.35;
  }
  #newsletter .newsletter-status {
    min-height: 0;
    margin-top: 6px;
  }
}
/* END RD NEWSLETTER MOBILE FIX */'''

          theme.write_text(css.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY

          git config user.name "Rochdale Daily Site Update"
          git config user.email "bot@rochdaledaily.co.uk"
          git add assets/css/newspaper-global.css assets/css/editorial-theme.css
          git commit -m "Tighten mobile newsletter and restore dark block"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
