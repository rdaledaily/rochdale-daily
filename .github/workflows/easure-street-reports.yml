name: Measure FixMyStreet ward reports

# Measurement only. This runs street_reports.py on its own, prints the real
# ward and topic counts to the Actions log, and writes nothing - no commit, no
# articles.json change, no deploy. It exists so the thresholds in
# street_reports.py are set from Rochdale's actual volume rather than a guess.
#
# Run it from the Actions tab. It is never scheduled.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Comma-separated day windows to measure"
        required: false
        default: "7,14,28"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Measure ward report volume
        env:
          WINDOWS: ${{ inputs.windows }}
        run: |
          cd scraper
          python - <<'PY'
          import json, os, sys
          import requests
          from street_reports import fetch_ward_counts, WARDS, TOPIC_LABELS

          windows = [int(w) for w in os.environ.get("WINDOWS", "7,14,28").split(",") if w.strip()]
          session = requests.Session()
          summary = []

          for days in windows:
              result = fetch_ward_counts(session.get, days=days)
              print(f"\n{'=' * 60}\nWINDOW: {days} days\n{'=' * 60}")
              print(f"TOTAL REPORTS: {result['total']}")

              if result["wards_unavailable"]:
                  print(f"\n!! {len(result['wards_unavailable'])} WARD FEED(S) UNAVAILABLE:")
                  for slug in result["wards_unavailable"]:
                      print(f"   - {slug}")
                  print("   Every total above understates the real figure.")
              else:
                  print(f"All {len(WARDS)} ward feeds returned data.")

              print("\nBY TOPIC:")
              if result["topics"]:
                  for key, count in result["topics"].most_common():
                      print(f"  {count:>5}  {TOPIC_LABELS[key]}")
              else:
                  print("  (none matched)")
              matched = sum(result["topics"].values())
              if result["total"]:
                  pct = 100 * matched / result["total"]
                  print(f"  {result['total'] - matched:>5}  unmatched "
                        f"({pct:.0f}% of reports fell into a topic)")

              print("\nBY WARD:")
              for data in sorted(result["wards"].values(),
                                 key=lambda d: (-d["count"], d["label"])):
                  print(f"  {data['count']:>5}  {data['label']}")

              summary.append((days, result["total"], len(result["wards_unavailable"])))

          print(f"\n{'=' * 60}\nSUMMARY\n{'=' * 60}")
          for days, total, missing in summary:
              flag = f"  ({missing} feed(s) missing)" if missing else ""
              print(f"  {days:>3} days: {total} reports{flag}")
          print("\nMIN_TOTAL_TO_PUBLISH is currently 12 with a 7-day window.")
          print("If the 7-day total is well above that, the weekly roundup works.")
          print("If it is close to or below it, widen the window instead.")
          PY

      - name: Confirm nothing was written
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::This job modified the working tree. It should not."
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean - measurement only, as intended."
