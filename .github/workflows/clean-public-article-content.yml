name: Clean public article content

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-content-hygiene
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove public publishing artefacts only
        run: |
          python scraper/content_hygiene.py --fix
          python scraper/content_hygiene.py
      - name: Commit canonical text repairs only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_articles.json manual_articles.d articles.json
          if git diff --cached --quiet; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'No hygiene repairs required.'
            exit 0
          fi
          git commit -m 'Clean public article text'
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Re-render through canonical publisher
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
