name: Clean public article content

on:
  workflow_dispatch:
  push:
    paths:
      - 'scraper/content_hygiene.py'
      - 'manual_articles.json'
      - 'manual_articles.d/**'
      - 'articles.json'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove emojis, machine citations and internal wording
        run: python scraper/content_hygiene.py --fix

      - name: Rebuild generated article pages and feeds
        run: |
          if [ -f scraper/frontpage_pipeline.py ]; then
            python scraper/frontpage_pipeline.py || true
          fi
          if [ -f scraper/generate_pages.py ]; then
            python scraper/generate_pages.py || true
          fi
          python scraper/content_hygiene.py --fix

      - name: Verify public article content is clean
        run: python scraper/content_hygiene.py

      - name: Commit repaired content without rebasing generated files
        run: |
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          rebuild_clean() {
            python scraper/content_hygiene.py --fix
            if [ -f scraper/frontpage_pipeline.py ]; then python scraper/frontpage_pipeline.py || true; fi
            if [ -f scraper/generate_pages.py ]; then python scraper/generate_pages.py || true; fi
            python scraper/content_hygiene.py --fix
            python scraper/content_hygiene.py
          }
          stage_clean() {
            git add manual_articles.json manual_articles.d articles.json articles scraper/content_hygiene.py
          }
          stage_clean
          if git diff --cached --quiet; then echo 'No article hygiene changes required.'; exit 0; fi
          git commit -m 'Remove emojis and publishing artefacts from articles'
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            git clean -fd
            rebuild_clean
            stage_clean
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Remove emojis and publishing artefacts from articles (race-safe rebuild)'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
