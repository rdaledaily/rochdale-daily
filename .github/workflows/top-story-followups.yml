name: Top-story follow-ups

# Re-researches the stories in the homepage's top positions and updates the
# same story in place when a later report carries a meaningful development:
# a charge, court date, conviction or sentence, a person who died being named,
# a road reopening, or an MP's or councillor's comment (editor, 15 Nov 2026).
# Each story is looked at no more than hourly. Legal developments not from an
# official source are held for the editor on /checked.
#
# Each run starts the next one (wait_minutes later). Measured 15 Nov 2026: the
# cron below did not fire once between 18:00 and 20:45, and the repo's other
# scheduled lanes fire with gaps of an hour or more, so the cron is only a
# backstop that restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research and report only; change no story"
        required: false
        default: "false"
      wait_minutes:
        description: "Minutes to wait before starting (used by the chain)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-top-story-followups
  cancel-in-progress: false

jobs:
  followups:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-4o-mini"
      RD_FOLLOWUP_MINUTES: "18"
      # Switched on 15 Nov after three dry runs on the real top nine: 115
      # search hits, all older reports; no development existed to apply yet.
      RD_FOLLOWUP_APPLY: "true"
      PYTHONPATH: scraper
    steps:
      - name: Wait for this run's slot
        if: github.event.inputs.wait_minutes != '' && github.event.inputs.wait_minutes != '0'
        run: sleep $(( ${{ github.event.inputs.wait_minutes }} * 60 ))
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Restore follow-up memory
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/top_story_followups_state.json
            reports/top_story_followups_events.json
          key: followups-state-${{ github.run_id }}
          restore-keys: followups-state-
      - name: Test the follow-up desk
        run: python scraper/test_top_story_followups.py
      - name: Research the top stories
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scraper/top_story_followups.py --dry-run
          else
            python scraper/top_story_followups.py
          fi
      - name: Save follow-up memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reports/top_story_followups_state.json
            reports/top_story_followups_events.json
          key: followups-state-${{ github.run_id }}
      - name: Summarise the run
        if: always()
        run: python scraper/top_story_followups.py --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Validate before publishing
        run: python scraper/check_data_files.py
      - name: Commit updates and the follow-up report
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run memory lives in the Actions cache: committing it every half hour
          # would be ~1,400 deployments a month. The public report is committed
          # only when a story was updated or the editor's held list changed.
          paths=(manual_articles.d manual_articles.json)
          if ! git diff --quiet -- reports/top_story_followups.json 2>/dev/null || ! git ls-files --error-unmatch reports/top_story_followups.json >/dev/null 2>&1; then
            if python scraper/top_story_followups.py --report-changed; then
              paths+=(reports/top_story_followups.json)
            fi
          fi
          stage() { for p in "${paths[@]}"; do [ -e "$p" ] && git add -- "$p"; done; return 0; }
          stage
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^manual_articles'; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            msg="Top-story follow-ups: update stories with new developments"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            msg="Top-story follow-ups: research report"
          fi
          git commit -m "$msg"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Publish updated stories
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scraper/gh_dispatch.sh publish.yml --ref main
      - name: Start the next run in half an hour
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scraper/gh_dispatch.sh top-story-followups.yml --ref main -f dry_run=false -f wait_minutes=25
