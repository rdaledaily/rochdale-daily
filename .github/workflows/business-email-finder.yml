name: Business email finder

# Read-only. Looks up published contact emails for the active borough companies
# in tools/business_companies.csv. Publishes nothing and commits nothing: the
# results are uploaded as the "business-emails" artifact on the run page.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Check only the first N companies (0 = all 883)"
        required: false
        default: "0"
      print_rows:
        description: "Also print the found rows in the log (for the newsdesk to read; delete the run logs afterwards)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: rd-business-email-finder
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FINDER_LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir requests beautifulsoup4 lxml pytest
      - name: Test the finder
        run: python -m pytest -q tools/test_business_email_finder.py
      - name: Find published emails
        run: python tools/business_email_finder.py
      - name: Print found rows
        if: github.event.inputs.print_rows == 'true'
        run: |
          python -c "import csv;[print('ROW\t'+'\t'.join([r['company_name'],r['company_number'],r['website'],r['email'],r['found_on'],r['evidence'],r['confidence']])) for r in csv.DictReader(open('business_emails.csv')) if r['email']]"
      - name: Write job summary
        if: always()
        run: |
          if [ -f business_emails_summary.md ]; then cat business_emails_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-emails
          path: |
            business_emails.csv
            business_emails_summary.md
          if-no-files-found: warn
          retention-days: 14
