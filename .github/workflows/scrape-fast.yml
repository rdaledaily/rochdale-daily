name: Rochdale Daily fast local news

on:
  workflow_dispatch:
  schedule:
    - cron: "5,35 * * * *"
    - cron: "10 */2 * * *"

permissions:
  contents: write

# Keep the time-critical half-hour scrape independent from the slower browser
# discovery. GitHub concurrency retains only one pending run per group, so a
# long deep-browser run must never cause the next fast-news run to be replaced
# while waiting. Both jobs publish through publish_newsroom_snapshot.sh, which
# safely merges canonical article feeds and regenerates derived pages if main
# moves during publication.
concurrency:
  group: ${{ github.event.schedule == '10 */2 * * *' && 'rd-deep-news-writer' || 'rd-fast-news-writer' }}
  cancel-in-progress: false

jobs:
  fast-news:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5,35 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "false"
      # The fast lane is for current news. Older material can still be found
      # by deep discovery and retained in the archive, but must not consume
      # half-hour scrape time or compete with the 14-hour homepage window.
      MAX_NEWS_AGE_HOURS: "14"
      SAME_DAY_ONLY: "false"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "2"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      MAX_AI_ARTICLES_PER_RUN: "40"
      MAX_AI_ARTICLES_INITIAL: "70"
      RESPECT_ROBOTS: "true"
      # Fast discovery must fail away from slow third-party sites quickly.
      # The two-hour deep lane still has the wider timeout/budget below.
      REQUEST_TIMEOUT: "5"
      SLOW_DOMAIN_FAILURE_THRESHOLD: "1"
      SLOW_DOMAIN_BENCH_HOURS: "24"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      # Preserve the full query/category set (including environment/fire), but
      # reduce work inside each source/query so the fast lane cannot become a
      # second deep crawl. Broad/deep collection remains below.
      DISCOVERY_LINKS_PER_SOURCE: "14"
      RSS_ITEMS_PER_SOURCE: "45"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_PAGE_LIMIT: "1"
      DISCOVERY_WORKERS: "16"
      DISCOVERY_LINK_WORKERS: "16"
      AI_WORKERS: "8"
      MIN_BALANCED_SELECTION_LIMIT: "30"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      MIN_LIVE_STORIES: "20"
      SCRAPER_HEALTH_FRESH_HOURS: "24"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      BROWSER_RENDER_ENABLED: "false"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "false"
      COMMIT_MESSAGE: "Update Rochdale Daily fast local news"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Run resilient Rochdale newsroom pipeline
        timeout-minutes: 18
        run: python scraper/run_newspaper_pipeline.py
      - name: Resolve article images before page generation
        timeout-minutes: 8
        run: |
          python scraper/ensure_article_images.py
          python scraper/repair_generated_article_images.py
          python scraper/repair_generated_with_commons.py
      - name: Validate article feed
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
      - name: Generate site with newsroom freshness rules
        # Generation now rebuilds ward pages, the full newspaper, Google News
        # sitemap and health report. Ten minutes is an execution ceiling only;
        # every editorial, image and freshness validation still runs.
        timeout-minutes: 10
        run: |
          python scraper/repair_merged_bodies.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/generate_news_sitemap.py
          python scraper/check_scraper_health.py
      - name: Refresh weather
        timeout-minutes: 2
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: python scraper/weather_forecast.py
      - name: Commit and push race-safe newsroom snapshot
        run: bash scraper/publish_newsroom_snapshot.sh

  deep-browser:
    if: github.event.schedule == '10 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      FACEBOOK_EVENTS_DISCOVERY_URL: "https://www.facebook.com/events/?date_filter_option=ANY_DATE&discover_tab=CUSTOM&location_id=108023932551149"
      FACEBOOK_EVENTS_MAX: "18"
      OPENAI_MODEL: "gpt-4o-mini"
      # Deep discovery may collect older context for archive/merging, while the
      # homepage boundary independently enforces the 14-hour fresh-news order.
      MAX_NEWS_AGE_HOURS: "72"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "2"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      MAX_AI_ARTICLES_PER_RUN: "40"
      MAX_AI_ARTICLES_INITIAL: "80"
      REQUEST_TIMEOUT: "10"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_LINKS_PER_SOURCE: "36"
      RSS_ITEMS_PER_SOURCE: "100"
      DISCOVERY_PAGE_LIMIT: "3"
      DISCOVERY_WORKERS: "12"
      DISCOVERY_LINK_WORKERS: "12"
      AI_WORKERS: "6"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      MIN_LIVE_STORIES: "20"
      SCRAPER_HEALTH_FRESH_HOURS: "24"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "true"
      BROWSER_RENDER_ENABLED: "true"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "true"
      GOOGLE_NEWS_RESOLVE_MAX: "120"
      GOOGLE_NEWS_RESOLVE_BUDGET_SECONDS: "300"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
      COMMIT_MESSAGE: "Update Rochdale Daily deep discovery"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Run deep resilient Rochdale newsroom discovery
        timeout-minutes: 27
        run: python scraper/run_newspaper_pipeline.py
      - name: Resolve article images before page generation
        timeout-minutes: 10
        run: |
          python scraper/ensure_article_images.py
          python scraper/repair_generated_article_images.py
          python scraper/repair_generated_with_commons.py
      - name: Validate and generate site
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/generate_news_sitemap.py
          python scraper/check_scraper_health.py
      - name: Commit and push race-safe newsroom snapshot
        run: bash scraper/publish_newsroom_snapshot.sh