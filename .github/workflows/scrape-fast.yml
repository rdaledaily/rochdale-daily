name: Rochdale Daily fast local news

on:
  workflow_dispatch:
  schedule:
    - cron: "5,35 * * * *"
    - cron: "10 */2 * * *"

permissions:
  contents: write
  actions: write

# Fast, immediate and deep newsroom runs all generate the same canonical
# articles/site snapshot. They must never rebuild and push that snapshot at the
# same time: the race-safe publisher can recover from an occasional unrelated
# main update, but two newsroom publishers continuously invalidate one another.
# Keep cancel-in-progress false so an active validated newsroom run finishes;
# the next run queues behind it instead of destroying its publication attempt.
concurrency:
  group: rd-fast-news-writer
  cancel-in-progress: false

jobs:
  fast-news:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5,35 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "true"
      MAX_NEWS_AGE_HOURS: "14"
      PUBLISH_MAX_NEWS_AGE_HOURS: "14"
      MIN_AUTOMATED_ARTICLE_WORDS: "200"
      CANDIDATE_RESERVOIR_HOURS: "96"
      SAME_DAY_ONLY: "false"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "7"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      FRONTPAGE_FRESH_HOURS: "14"
      MAX_AI_ARTICLES_PER_RUN: "24"
      MAX_AI_ARTICLES_INITIAL: "40"
      RESPECT_ROBOTS: "true"
      REQUEST_TIMEOUT: "5"
      SLOW_DOMAIN_FAILURE_THRESHOLD: "1"
      SLOW_DOMAIN_BENCH_HOURS: "24"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
      CSS_SOURCE_PATH: assets/css/article-inline.css
      RIGHT_TO_REPLY_EMAIL: "news@rochdaledaily.co.uk"
      SOCIAL_CONTEXT_ENABLED: "true"
      FACEBOOK_COMMENTS_ENABLED: "true"
      SOCIAL_MIN_PUBLIC_REACTIONS: "3"
      SOCIAL_MAX_PUBLIC_REACTIONS: "12"
      SOCIAL_MAX_OFFICIAL_UPDATES: "4"
      X_RECENT_SEARCH_MAX: "100"
      DISCOVERY_LINKS_PER_SOURCE: "14"
      RSS_ITEMS_PER_SOURCE: "45"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_PAGE_LIMIT: "1"
      DISCOVERY_WORKERS: "16"
      DISCOVERY_LINK_WORKERS: "16"
      AI_WORKERS: "8"
      MIN_BALANCED_SELECTION_LIMIT: "30"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      HTTP_POOL_CONNECTIONS: "64"
      HTTP_POOL_MAXSIZE: "64"
      MIN_LIVE_STORIES: "8"
      MIN_FRESH_FRONTPAGE_STORIES: "6"
      SCRAPER_HEALTH_FRESH_HOURS: "14"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "false"
      BROWSER_RENDER_ENABLED: "false"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "false"
      COMMIT_MESSAGE: "Update Rochdale Daily fast local news"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Run resilient Rochdale newsroom pipeline
        timeout-minutes: 24
        run: python scraper/run_newspaper_pipeline.py
      - name: Enforce substantial automated articles
        run: python scraper/enforce_automated_article_floor.py
      - name: Resolve article images before page generation
        timeout-minutes: 8
        run: |
          python scraper/ensure_article_images.py
          python scraper/repair_generated_article_images.py
          python scraper/repair_generated_with_commons.py
      - name: Validate article feed
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
      - name: Generate site with strict newsroom freshness rules
        timeout-minutes: 10
        run: |
          python scraper/repair_merged_bodies.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/enforce_frontpage_freshness.py
          python scraper/enforce_live_homepage_window.py
          python scraper/generate_news_sitemap.py
          python scraper/check_scraper_health.py
      - name: Refresh weather
        timeout-minutes: 2
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: python scraper/weather_forecast.py
      - name: Commit and push race-safe newsroom snapshot
        id: publish
        run: bash scraper/publish_newsroom_snapshot.sh
      - name: Deploy published newsroom snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

  deep-browser:
    if: github.event.schedule == '10 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      FACEBOOK_GRAPH_VERSION: "v22.0"
      FACEBOOK_EVENTS_DISCOVERY_URL: "https://www.facebook.com/events/?date_filter_option=ANY_DATE&discover_tab=CUSTOM&location_id=108023932551149"
      FACEBOOK_EVENTS_MAX: "18"
      OPENAI_MODEL: "gpt-4o-mini"
      AI_REWRITE_REQUIRED: "true"
      MAX_NEWS_AGE_HOURS: "72"
      PUBLISH_MAX_NEWS_AGE_HOURS: "14"
      MIN_AUTOMATED_ARTICLE_WORDS: "200"
      CANDIDATE_RESERVOIR_HOURS: "96"
      FRONTPAGE_PRIMARY_DAYS: "1"
      FRONTPAGE_FALLBACK_DAYS: "7"
      FRONTPAGE_MIN_ARTICLES: "12"
      FRONTPAGE_TARGET_ARTICLES: "30"
      FRONTPAGE_FRESH_HOURS: "14"
      MAX_AI_ARTICLES_PER_RUN: "40"
      MAX_AI_ARTICLES_INITIAL: "80"
      REQUEST_TIMEOUT: "10"
      GOOGLE_SEARCH_QUERY_LIMIT: "68"
      DISCOVERY_LINKS_PER_SOURCE: "36"
      RSS_ITEMS_PER_SOURCE: "100"
      DISCOVERY_PAGE_LIMIT: "3"
      DISCOVERY_WORKERS: "12"
      DISCOVERY_LINK_WORKERS: "12"
      AI_WORKERS: "6"
      MAX_SELECTED_PER_SOURCE: "8"
      MAX_SELECTED_PER_CATEGORY: "24"
      MIN_LIVE_STORIES: "20"
      MIN_FRESH_FRONTPAGE_STORIES: "6"
      SCRAPER_HEALTH_FRESH_HOURS: "14"
      FACEBOOK_EVENTS_BROWSER_ENABLED: "true"
      BROWSER_RENDER_ENABLED: "true"
      GOOGLE_NEWS_BROWSER_RESOLUTION: "true"
      GOOGLE_NEWS_RESOLVE_MAX: "120"
      GOOGLE_NEWS_RESOLVE_BUDGET_SECONDS: "300"
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
      CSS_SOURCE_PATH: assets/css/article-inline.css
      COMMIT_MESSAGE: "Update Rochdale Daily deep discovery"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Run deep resilient Rochdale newsroom discovery
        timeout-minutes: 32
        run: python scraper/run_newspaper_pipeline.py
      - name: Enforce substantial automated articles
        run: python scraper/enforce_automated_article_floor.py
      - name: Resolve article images before page generation
        timeout-minutes: 10
        run: |
          python scraper/ensure_article_images.py
          python scraper/repair_generated_article_images.py
          python scraper/repair_generated_with_commons.py
      - name: Validate and generate site
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
          python scraper/enforce_frontpage_freshness.py
          python scraper/enforce_live_homepage_window.py
          python scraper/generate_news_sitemap.py
          python scraper/check_scraper_health.py
      - name: Commit and push race-safe newsroom snapshot
        id: publish
        run: bash scraper/publish_newsroom_snapshot.sh
      - name: Deploy published newsroom snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
