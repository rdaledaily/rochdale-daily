name: Rochdale Daily dual-agent bridge

# Read-only model review lane. It may read repo context, call the two model APIs
# through secrets, upload a report artifact, and post an issue/PR comment. It
# cannot write repository contents, push commits, merge PRs, or dispatch other
# workflows.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to review and comment back on"
        required: false
        type: string
      pr_number:
        description: "PR number to review and comment back on"
        required: false
        type: string
      task_json:
        description: "Structured JSON task payload when no issue or PR is used"
        required: false
        type: string
      openai_model:
        description: "OpenAI proposer model"
        required: false
        type: string
        default: "gpt-5.2"
      anthropic_model:
        description: "Anthropic reviewer model"
        required: false
        type: string
        default: "claude-sonnet-5"
      max_rounds:
        description: "Proposal/review rounds (1-3)"
        required: false
        type: string
        default: "1"
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: >-
    rd-dual-agent-bridge-${{
      github.event_name == 'workflow_dispatch'
      && github.run_id
      || github.event.issue.number
    }}
  cancel-in-progress: true

jobs:
  bridge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[bridge]') ||
      contains(github.event.issue.body, '<!-- dual-agent-bridge -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_MODEL: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && inputs.openai_model
          || 'gpt-5.2'
        }}
      ANTHROPIC_MODEL: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && inputs.anthropic_model
          || 'claude-sonnet-5'
        }}
      BRIDGE_ARTIFACT_NAME: dual-agent-bridge-report-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dual-agent bridge
        run: |
          python scraper/dual_agent_bridge.py \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}" \
            --pr-number "${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}" \
            --task-json "${{ github.event_name == 'workflow_dispatch' && inputs.task_json || '' }}" \
            --max-rounds "${{ github.event_name == 'workflow_dispatch' && inputs.max_rounds || '1' }}"

      - name: Upload bridge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-agent-bridge-report-${{ github.run_id }}
          path: reports/
          retention-days: 14