name: Fix weekend event filter and remove What's Occurrin

on:
  push:
    paths:
      - '.github/workflows/fix-weekend-and-remove-whats-occurrin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rochdale-daily-15-minute-scraper
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Fix date filter and remove source
        run: |
          python scraper/fix_homepage_event_filters.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          source_name = "What's Occurrin' Events"
          domain = 'whatsoccurrinevents.co.uk'

          scraper = root / 'scraper' / 'scraper.py'
          text = scraper.read_text(encoding='utf-8')
          pattern = re.compile(r"^\s*\{'name': \"What's Occurrin' Events\".*?\},\n", re.MULTILINE)
          text, removed = pattern.subn('', text)
          if removed != 1:
              raise SystemExit(f'Expected to remove one discovery source, removed {removed}')
          scraper.write_text(text, encoding='utf-8')

          def is_blocked(record):
              if not isinstance(record, dict):
                  return False
              fields = [record.get('source_name'), record.get('source_url')]
              fields += list(record.get('source_names') or [])
              fields += list(record.get('source_urls') or [])
              joined = ' '.join(str(v or '') for v in fields).lower()
              return "what's occurrin" in joined or domain in joined

          for filename in ['articles.json', 'articles/whats-on.json']:
              path = root / filename
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(data, list):
                  cleaned = [r for r in data if not is_blocked(r)]
              elif isinstance(data, dict) and isinstance(data.get('events'), list):
                  data['events'] = [r for r in data['events'] if not is_blocked(r)]
                  data['count'] = len(data['events'])
                  cleaned = data
              else:
                  raise SystemExit(f'Unexpected JSON shape in {filename}')
              path.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          event_dates = root / 'event_dates.json'
          if event_dates.exists():
              data = json.loads(event_dates.read_text(encoding='utf-8'))
              if isinstance(data, dict):
                  cleaned = {k: v for k, v in data.items() if domain not in str(k).lower() and domain not in str(v).lower()}
              elif isinstance(data, list):
                  cleaned = [r for r in data if domain not in json.dumps(r).lower() and "what's occurrin" not in json.dumps(r).lower()]
              else:
                  cleaned = data
              event_dates.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild published pages and feeds
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_pages.py
      - name: Verify repair
        run: |
          grep -q 'daysToSaturday' index.html
          ! grep -qi 'whatsoccurrinevents.co.uk' scraper/scraper.py
          ! grep -qi 'whatsoccurrinevents.co.uk' articles/whats-on.json
      - name: Commit complete fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-weekend-and-remove-whats-occurrin.yml
          git add index.html scraper/scraper.py scraper/fix_homepage_event_filters.py articles.json articles/whats-on.json event_dates.json scraper_status.json articles sitemap.xml
          git commit -m "Fix this-weekend event window and remove What's Occurrin source"
          git push
