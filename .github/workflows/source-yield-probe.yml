name: Rochdale Daily source yield probe

# Read-only measurement of candidate new sources. Publishes nothing, writes
# nothing to the site, and adds no source to the newsroom. Run it, read the job
# summary, and only then decide which collectors are worth building.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rd-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROBE_RECENT_DAYS: "14"
      PROBE_TIMEOUT: "20"
      # Present only if the free keys have been registered and stored as secrets.
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      CHARITY_COMMISSION_API_KEY: ${{ secrets.CHARITY_COMMISSION_API_KEY }}
      NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Probe candidate sources
        run: python scraper/source_yield_probe.py
      - name: Commit source yield report
        if: always()
        run: |
          mkdir -p reports
          if [ -f source_yield_report.json ]; then mv source_yield_report.json reports/source_yield_report.json; fi
          git config user.name "Rochdale Daily Bot"
          git config user.email "bot@rochdaledaily.co.uk"
          git add reports/source_yield_report.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Record candidate source yield measurement"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 7))
          done
          echo "::warning::source yield report could not push after five attempts"
