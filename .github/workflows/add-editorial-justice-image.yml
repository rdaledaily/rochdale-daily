name: Add editorial justice article image

on:
  push:
    paths:
      - '.github/workflows/add-editorial-justice-image.yml'

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Wikimedia image metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('manual_articles.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          target_slug = 'editorial-justice-remains-unfinished-rochdale'
          image_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rochdale_Police_Station_%282%29.JPG'
          credit_url = 'https://commons.wikimedia.org/wiki/File:Rochdale_Police_Station_%282%29.JPG'

          changed = False
          for article in data:
              if article.get('slug') == target_slug:
                  article['image_url'] = image_url
                  article['image_credit'] = 'Rept0n1x / Wikimedia Commons'
                  article['image_credit_url'] = credit_url
                  changed = True
                  break

          if not changed:
              raise SystemExit(f'Article not found: {target_slug}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit source update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_articles.json
          git rm .github/workflows/add-editorial-justice-image.yml
          git commit -m "Add Rochdale Police Station image to justice editorial"
          git push
