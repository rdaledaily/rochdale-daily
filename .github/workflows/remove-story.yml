name: Remove story

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Page slugs, comma-separated"
        required: false
        default: ""
      title_patterns:
        description: "Title substrings, comma-separated, case-insensitive"
        required: false
        default: ""
      source_urls:
        description: "Source URLs, comma-separated"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# Emergency removals must not wait behind a long newsroom scrape. The takedown
# itself is race-safe: if main moves while it is running, it resets to newest
# main and reapplies the permanent blocklist/removal before pushing again.
concurrency:
  group: rd-emergency-takedown
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply permanent editorial takedown
        run: |
          python scraper/remove_story.py \
            --slugs "${{ github.event.inputs.slugs }}" \
            --title-patterns "${{ github.event.inputs.title_patterns }}" \
            --source-urls "${{ github.event.inputs.source_urls }}"
      - name: Commit takedown against newest canonical state
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          stage_takedown() {
            git add story_blocklist.json articles.json event_dates.json articles sitemap.xml news-sitemap.xml articles/frontpage.json index.html 2>/dev/null || true
          }

          reapply_takedown() {
            python scraper/remove_story.py \
              --slugs "${{ github.event.inputs.slugs }}" \
              --title-patterns "${{ github.event.inputs.title_patterns }}" \
              --source-urls "${{ github.event.inputs.source_urls }}"
          }

          stage_takedown
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed; story may already be blocklisted. Deployment will still be refreshed."
            exit 0
          fi
          git commit -m "Editorial takedown via Remove story workflow"
          if git push origin HEAD:main; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "main moved during takedown; reapplying on latest main (${attempt}/5)."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            reapply_takedown
            stage_takedown
            if git diff --cached --quiet; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Reapply editorial takedown on latest main"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Deploy takedown immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Emergency takedown deployment requested from latest main, including already-blocklisted cases."