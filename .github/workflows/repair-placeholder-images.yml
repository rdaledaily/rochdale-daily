name: Repair Rochdale Daily article placeholders

on:
  workflow_dispatch:
  schedule:
    - cron: "20,50 * * * *"
  push:
    branches: [main]
    paths:
      - "manual_articles.json"
      - "manual_articles.d/**"
      - "articles.json"
      - "assets/img/cards/**"
      - "scraper/ensure_article_images.py"
      - "scraper/repair_generated_article_images.py"
      - "scraper/repair_generated_with_commons.py"

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Repair article placeholder images')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Load manual articles into published feed
        run: python scraper/run_fast_local_pipeline.py --manual-only || true
      - name: Match local article images
        run: python scraper/ensure_article_images.py --articles articles.json
      - name: Rebuild feeds
        run: python scraper/frontpage_pipeline.py
      - name: Replace remaining placeholders with real images
        run: |
          python scraper/ensure_article_images.py --articles articles.json
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
      - name: Validate and rebuild all public pages
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/generate_archive.py
          python scraper/generate_ward_pages.py
          python scraper/generate_pages.py
          python - <<'PY'
          import json
          rows=json.load(open('articles.json',encoding='utf-8'))
          bad=[]
          for a in rows:
              if not isinstance(a,dict) or str(a.get('status') or 'published').lower()!='published':
                  continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/'):
                  bad.append((a.get('slug'),image))
          if bad:
              raise SystemExit(f'{len(bad)} non-local article images remain: {bad[:20]}')
          PY
      - name: Commit image repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json image_coverage_report.json image_repair_report.json commons_image_repair_report.json assets/img/cards articles sitemap.xml wards/ index.html
          git add articles/frontpage.json articles/categories articles/areas 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Repair article placeholder images"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git reset --hard HEAD
            git clean -fd
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
