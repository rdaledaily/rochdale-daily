name: Repair Rochdale Daily article placeholders

on:
  workflow_dispatch:
  schedule:
    - cron: "20,50 * * * *"
  push:
    branches: [main]
    paths:
      - "manual_articles.json"
      - "manual_articles.d/**"
      - "articles.json"
      - "assets/img/cards/**"
      - "scraper/ensure_article_images.py"
      - "scraper/repair_generated_article_images.py"
      - "scraper/repair_generated_with_commons.py"
      - ".github/workflows/repair-placeholder-images.yml"

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Repair article placeholder images')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USE_SOURCE_IMAGES: "false"
      USE_WIKIMEDIA_COMMONS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Match existing local photographs
        run: python scraper/ensure_article_images.py --articles articles.json
      - name: Replace remaining placeholders with real photographs
        run: |
          python scraper/repair_generated_article_images.py --articles articles.json
          python scraper/repair_generated_with_commons.py --articles articles.json
      - name: Validate repaired images and rebuild public pages
        run: |
          python -m json.tool articles.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open('articles.json',encoding='utf-8'))
          bad=[]
          repaired_statuses={'source-photo-cached','commons-photo-cached','cards-library-photo'}
          for a in rows:
              if not isinstance(a,dict): continue
              if str(a.get('image_status') or '').lower() not in repaired_statuses: continue
              image=str(a.get('image_url') or a.get('img') or '').replace('\\','/').lstrip('/')
              if not image.startswith('assets/img/cards/') or not Path(image).is_file(): bad.append((a.get('slug'),image,a.get('image_status')))
          if bad: raise SystemExit(f'{len(bad)} successfully-repaired images are not cached locally: {bad[:20]}')
          PY
          python scraper/article_gate.py articles.json
          python scraper/generate_archive.py
          python scraper/generate_ward_pages.py
          python scraper/generate_newspaper_pages.py
      - name: Commit successful image repairs without rebasing generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage_repair() {
            git add articles.json image_coverage_report.json image_repair_report.json commons_image_repair_report.json assets/img/cards articles sitemap.xml wards/ index.html
            git add articles/frontpage.json articles/categories articles/areas 2>/dev/null || true
          }
          rebuild_repair() {
            python scraper/ensure_article_images.py --articles articles.json
            python scraper/repair_generated_article_images.py --articles articles.json
            python scraper/repair_generated_with_commons.py --articles articles.json
            python -m json.tool articles.json > /dev/null
            python scraper/article_gate.py articles.json
            python scraper/generate_archive.py
            python scraper/generate_ward_pages.py
            python scraper/generate_newspaper_pages.py
          }
          stage_repair
          if git diff --cached --quiet; then echo "No image changes to commit."; exit 0; fi
          git commit -m "Repair article placeholder images"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            git clean -fd
            rebuild_repair
            stage_repair
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Repair article placeholder images (race-safe rebuild)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
