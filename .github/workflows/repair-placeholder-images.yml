name: Repair Rochdale Daily placeholder images

on:
  workflow_dispatch:
  schedule:
    - cron: "20,50 * * * *"
  push:
    paths:
      - "manual_articles.json"
      - "manual_articles.d/**"
      - "articles.json"

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Repair article photography') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_SOURCE_IMAGES: "true"
      USE_WIKIMEDIA_COMMONS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir "Pillow>=10,<13"
      - name: Load manual articles into published feed
        run: python scraper/run_fast_local_pipeline.py --manual-only || true
      - name: First-pass source image resolver
        timeout-minutes: 12
        run: python scraper/ensure_article_images.py --articles articles.json --retry-placeholders
      - name: Replace remaining cards with relevant Commons photography
        timeout-minutes: 15
        run: python scraper/repair_placeholder_images.py --articles articles.json
      - name: Validate and rebuild all public pages
        run: |
          python -m json.tool articles.json > /dev/null
          python scraper/article_gate.py articles.json
          python scraper/frontpage_pipeline.py
          python scraper/generate_archive.py
          python scraper/generate_ward_pages.py
          python scraper/generate_pages.py
      - name: Commit repaired photography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json commons_image_repair_report.json image_coverage_report.json assets/article-images articles sitemap.xml index.html
          git add articles/frontpage.json articles/categories articles/areas 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Repair article photography and replace place cards"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; sleep 3; }
          done
          exit 1
