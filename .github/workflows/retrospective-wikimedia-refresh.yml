name: Retrospective Wikimedia image refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/retrospective-wikimedia-refresh.yml'

permissions:
  contents: write

concurrency:
  group: rd-site-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Refresh auto-managed archive images
        run: |
          python scraper/refresh_archive_commons.py --articles articles.json --refresh-all

      - name: Rebuild feeds and pages
        run: |
          python scraper/frontpage_pipeline.py
          python scraper/generate_pages.py
          python scraper/generate_archive.py

      - name: Commit archive image improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retrospective-wikimedia-refresh.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No archive image improvements found.'
            exit 0
          fi
          git commit -m 'Refresh archive with story-related Wikimedia images'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              git merge --no-edit origin/main || true
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep 3
          done
          exit 1
