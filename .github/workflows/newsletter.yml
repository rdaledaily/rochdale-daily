name: Rochdale Daily newsletter

# "The borough in your inbox": emails the day's Morning Briefing to everyone who
# signed up on the site. Sign-ups have been stored since the summer but nothing
# was ever sent; this is the sender.
#
# It runs whenever the canonical publisher finishes, because that is the moment
# a newly published Morning Briefing reaches articles.json. The script sends at
# most once a day (the site records the date of the last send), only between
# 09:00 and 13:00 London, and only when today's briefing exists. Every other
# run exits in a second without contacting anyone.
#
# Needs two repository secrets: RESEND_API_KEY and NEWSLETTER_ADMIN_TOKEN (the
# same value as the site's EVENTS_ADMIN_TOKEN). Without them it sends nothing
# and says which is missing.

on:
  workflow_run:
    workflows: ["Publish canonical Rochdale Daily site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report how many would be sent, send nothing"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: rd-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send today's newsletter if it is due
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_ADMIN_TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          NEWSLETTER_REPLY_TO: ${{ vars.NEWSLETTER_REPLY_TO }}
          NEWSLETTER_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scraper/send_newsletter.py
