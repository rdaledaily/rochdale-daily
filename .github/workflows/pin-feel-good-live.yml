name: Pin Feel Good live page to homepage

on:
  push:
    paths:
      - articles/frontpage.json
      - pin_feel_good_live.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pin-feel-good-live
  cancel-in-progress: true

jobs:
  pin-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Put live festival coverage first
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('articles/frontpage.json')
          data = json.loads(path.read_text())
          articles = list(data.get('articles') or [])
          live_id = 'feel-good-festival-2026-live'

          # If this workflow's own previous commit is already correct, do
          # nothing. This prevents the articles/frontpage.json push trigger
          # from looping forever.
          if articles and articles[0].get('id') == live_id:
              raise SystemExit(0)

          articles = [a for a in articles if a.get('id') != live_id]

          # Freshest stories follow the live blog. This stops old featured
          # cards from making the homepage look stale during festival day.
          def stamp(article):
              value = article.get('first_published_at') or article.get('published_at') or ''
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).timestamp()
              except Exception:
                  return 0
          articles.sort(key=stamp, reverse=True)

          now = datetime.now(timezone.utc).replace(microsecond=0)
          now_iso = now.isoformat().replace('+00:00', 'Z')
          live = {
              'id': live_id,
              'slug': '../feel-good-live',
              'story_key': 'editorial:feel-good-festival-2026-live',
              'title': 'LIVE: Rochdale Feel Good Festival 2026 — updates throughout the day',
              'excerpt': 'Follow Rochdale Daily live from Feel Good Festival 2026, with Gabrielle, Ash, Starsailor, town-centre updates, timings, food and drink, travel and everything happening across Rochdale.',
              'content_html': '<p>Follow Rochdale Daily live throughout Feel Good Festival 2026.</p>',
              'area': 'rochdale',
              'category': 'news',
              'types': ['news'],
              'source_kind': 'editorial',
              'status': 'published',
              'published_at': now_iso,
              'first_published_at': '2026-08-08T07:00:00Z',
              'last_updated_at': now_iso,
              'scraped_at': now_iso,
              'source_name': 'Rochdale Daily',
              'source_url': 'https://rochdaledaily.co.uk/feel-good-live.html',
              'source_names': ['Rochdale Daily'],
              'source_urls': ['https://rochdaledaily.co.uk/feel-good-live.html'],
              'image_url': 'assets/img/cards/rochdale-town-hall.jpg',
              'image_credit': 'Rochdale Daily',
              'byline': 'Rochdale Daily',
              'manual_article': True,
              'editorial_lock': True,
              'publication_route': 'editorial-live',
              'rewrite_quality_checked': True,
              'featured': True,
              'force_lead': True,
              'is_ongoing': True,
              'ongoing_label': 'LIVE',
              'update_count': 5
          }

          articles.insert(0, live)
          for i, article in enumerate(articles):
              article['frontpage_rank'] = i
              article['frontpage_priority'] = 10000 if i == 0 else max(1, 1000 - i)
              article['slot'] = 'lead' if i == 0 else ('secondary-1' if i == 1 else ('secondary-2' if i == 2 else ''))

          data['articles'] = articles
          data['count'] = len(articles)
          data['generated_at'] = now_iso
          title = live['title']
          old = str(data.get('breaking') or '').strip()
          data['breaking'] = title + (('     •     BREAKING     •     ' + old) if old and title not in old else '')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit homepage pin
        run: |
          if git diff --quiet -- articles/frontpage.json; then
            echo 'Homepage already pinned.'
            exit 0
          fi
          git config user.name 'Rochdale Daily Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add articles/frontpage.json
          git commit -m 'Restore Feel Good Festival live homepage lead'
          git pull --rebase origin main
          git push origin HEAD:main
